# Continuous integration on GitHub-hosted runners only: a self-hosted runner
# would let fork pull requests run code on private machines.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is preinstalled on the runner; install exactly the toolchain
      # pinned in rust-toolchain.toml.
      - name: Toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup show active-toolchain
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Pinned by version and by the sha256 of the release tarball, so a
      # replaced or truncated download fails the check instead of running.
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny reads the dependency graph through `cargo metadata`, so the
      # toolchain pinned in rust-toolchain.toml has to be installed first.
      - name: Toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustup show active-toolchain
      - name: Install cargo-deny
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP"
      - name: Licenses, advisories, bans, sources
        run: '"$RUNNER_TEMP/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny" --all-features --locked check'

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Standard-library contract checks
        run: python3 -I scripts/check_contracts.py
      - name: Install pinned validators
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check -r .github/scripts/requirements.txt
      - name: OpenAPI 3.1 and JSON Schema 2020-12 validation
        run: '"$RUNNER_TEMP/venv/bin/python" -I .github/scripts/validate_contracts.py'

  docs:
    name: Docs (mdBook)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Pinned by version and by the sha256 of the release tarball, so a
      # replaced or truncated download fails the check instead of running.
      # mdBook reads MDBOOK_* variables as configuration, so the pins use
      # another prefix.
      PINNED_MDBOOK_VERSION: v0.5.4
      PINNED_MDBOOK_SHA256: 5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mdBook
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/$PINNED_MDBOOK_VERSION/mdbook-$PINNED_MDBOOK_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$PINNED_MDBOOK_SHA256  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/mdbook"
          tar xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook"
          "$RUNNER_TEMP/mdbook/mdbook" --version
      # Builds docs/ as it is (docs/book.toml) into target/book. Nothing is
      # published from here; docs-site.yml publishes the site on a release and
      # pins the same mdBook, so keep the two pins in sync.
      - name: Build the book
        run: '"$RUNNER_TEMP/mdbook/mdbook" build docs'
      # mdBook has no built-in link checker: every Markdown file must be in
      # docs/SUMMARY.md and every relative link and anchor must resolve.
      - name: Chapters and links
        run: python3 -I scripts/check_docs_site.py

  panel:
    name: Panel (typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same Node.js the release build uses (ADR 0027, ADR 0090): pinned
      # in packaging/node.txt and verified against its sha256 before use.
      - name: Node.js
        run: |
          set -euo pipefail
          bin="$("$GITHUB_WORKSPACE/packaging/fetch-node.sh" "$RUNNER_TEMP/node")"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          "$bin/node" --version
          "$bin/npm" --version
      # Exactly the lockfile, with the flags the release build uses.
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # typecheck generates the API client from the contract first; the tests
      # import it, so they run after it.
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build

  agent-runner:
    name: Agent runner (test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/agent-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner uses only the standard library; test on the oldest Python
      # it supports, so nothing newer slips in.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Offline: the tests start a fake Quoro and the runner on 127.0.0.1.
      - name: Test
        run: python -m unittest discover -s tests -v

  release-image:
    name: Release build image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The same engine the release workflow uses.
      QUORO_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the pinned release build image (ADR 0090) and runs
      # build-release.sh inside it as the runner user, which is what the
      # release workflow does first. A pin that no longer resolves (a snapshot
      # package, the base image digest, rustup-init) fails here, not on a tag.
      - name: Build the image and read the version inside it
        run: |
          set -euo pipefail
          version="$(packaging/build-in-container.sh --print-version)"
          printf 'version: %s\n' "$version"
          test -n "$version"
