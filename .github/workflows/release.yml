# Release builds. GitHub-hosted runners only: a self-hosted runner would put
# the signing identity and the release bytes on a machine we do not control.
#
# The build itself runs in the release build image (ADR 0090,
# packaging/container/Containerfile) through packaging/build-in-container.sh,
# the same script packaging/reproduce-release.sh uses, so the runner's own
# compilers and packages never reach the release bytes.
#
# A tag push creates a DRAFT release. The maintainer reviews the artifacts and
# publishes it; nothing here publishes on its own.
#
# Workflow dispatch is a dry run (ADR 0082): it builds, attests and uploads
# WORKFLOW ARTIFACTS ONLY. It never creates a tag, a release or a draft release,
# and its attestation is bound to the branch ref it ran on, not to a tag. Use it
# to try the release path before tagging; the artifacts are named so they cannot
# be mistaken for a release.
#
# Signing is keyless: GitHub artifact attestations (Sigstore, SLSA build
# provenance) via actions/attest-build-provenance. There are no long-lived
# signing keys. Verify with packaging/verify-release.sh.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest and draft the release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Docker is preinstalled on the runner; reproduce-release.sh prefers
      # podman. Both run the same image.
      QUORO_CONTAINER_ENGINE: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Rust toolchain, Node.js, the C compiler and musl all come from the
      # release build image; the first build-in-container.sh call builds it.
      #
      # On a tag push the tag and the Cargo version must agree, otherwise the
      # artifact name (which carries the tag version) would lie about the
      # binary. A dry run has no tag: the Cargo version names the artifact and
      # the attestation is bound to the branch ref.
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="${QUORO_PACKAGE:-quoro}"
          cargo_version="$(packaging/build-in-container.sh --print-version)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version=$cargo_version
            dry_run=true
          else
            version="${REF_NAME#v}"
            dry_run=false
            if [ "$cargo_version" != "$version" ]; then
              echo "error: tag version $version does not match the Cargo version" \
                "$cargo_version of package $package" >&2
              exit 1
            fi
          fi
          case "$version" in
            "" | *[!A-Za-z0-9.+_-]*)
              echo "error: unexpected version: $version" >&2
              exit 1
              ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >>"$GITHUB_OUTPUT"

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/build-in-container.sh "$VERSION"

      # ADR 0223: the dev-only dev-warm-policy feature is for test-lab builds
      # and never ships. A release whose binary reports it fails here, before
      # anything is attested or uploaded.
      - name: No dev-only feature in the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if [ -n "${QUORO_DEV_WARM_POLICY:-}" ] && [ "$QUORO_DEV_WARM_POLICY" != 0 ]; then
            echo "error: QUORO_DEV_WARM_POLICY is set for a release build (ADR 0223)" >&2
            exit 1
          fi
          name="quoro-${VERSION}-x86_64-unknown-linux-musl"
          unpacked="$(mktemp -d)"
          tar -xzf "dist/${name}.tar.gz" -C "$unpacked"
          reported="$("$unpacked/$name/quoro" version)"
          echo "$reported"
          case "$reported" in
            *dev-warm-policy*)
              echo "error: the release binary has the dev-only dev-warm-policy feature (ADR 0223)" >&2
              exit 1
              ;;
          esac

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/quoro-*.tar.gz

      # Publish the bundle next to the artifact so verify-release.sh can use
      # it offline, and so it ships with the release.
      - name: Store the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eu
          set -- dist/quoro-*.tar.gz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "error: expected exactly one dist/quoro-*.tar.gz, found $#" >&2
            exit 1
          fi
          cp "$BUNDLE_PATH" "$1.sigstore.jsonl"

      # The CycloneDX SBOM is attested like the tarball, with the same action
      # pinned to the same commit, and its bundle ships next to it (ADR 0138).
      - name: Attest the SBOM
        id: attest-sbom
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/quoro-*.cdx.json

      - name: Store the SBOM attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          set -eu
          set -- dist/quoro-*.cdx.json
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "error: expected exactly one dist/quoro-*.cdx.json, found $#" >&2
            exit 1
          fi
          cp "$BUNDLE_PATH" "$1.sigstore.jsonl"

      # Same checks a user runs, against the files that are about to be
      # uploaded. A broken attestation fails the release here, not for users.
      # A dry run must be dispatched from a branch, so its source ref is that
      # branch and not a tag.
      - name: Verify the release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          tarball="dist/quoro-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$GITHUB_REF" in
              refs/heads/*) ;;
              *)
                echo "error: a dry run must be dispatched from a branch, got $GITHUB_REF" >&2
                exit 1
                ;;
            esac
            packaging/verify-release.sh "$tarball" --dry-run-ref "$GITHUB_REF"
          else
            packaging/verify-release.sh "$tarball" "$GITHUB_REF_NAME"
          fi

      # Dry runs keep their artifacts as workflow artifacts. The name carries
      # "dry-run" and the commit sha so it cannot be taken for a release asset.
      - name: Upload dry-run artifacts
        if: steps.version.outputs.dry_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quoro-${{ steps.version.outputs.version }}-dry-run-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS
            dist/*.sigstore.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Create draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "Quoro $VERSION" \
            --notes "Draft release. The binaries are signed with GitHub artifact attestations (Sigstore, SLSA build provenance); verify with packaging/verify-release.sh and rebuild with packaging/reproduce-release.sh." \
            dist/*.tar.gz dist/*.cdx.json dist/SHA256SUMS dist/*.sigstore.jsonl
