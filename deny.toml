# cargo-deny configuration for the Quoro workspace.
#
# Implements ADR 0080 (dependency license policy for the AGPL-3.0-only core) and
# the dependency rules in DEPENDENCIES.md. CI runs this file, so a change here is
# a policy change: it needs a decision, not a local workaround.

[graph]
# Only the targets Quoro ships are checked, so the policy applies to exactly
# what can end up in a release binary (KVM hosts, ADR 0009). A crate pulled in
# only for another target (for example wasm32) is out of scope. Adding a
# shipped target means adding it here. Dev-dependencies are included.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
]

[licenses]
version = 2
# Every license a dependency is under must be one of these. ADR 0080 is the
# source of the list; do not add a license here without a superseding ADR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "AGPL-3.0-only",
]
# Licenses are compared after normalisation; require a confident detection.
confidence-threshold = 0.93
# The allowlist is the policy, not a list of what is used today.
unused-allowed-license = "allow"

# No `exceptions`: an exception for one crate is a policy decision and needs a
# recorded decision (ADR 0080). Add it to the allowlist through a new ADR
# instead of exempting a single crate.

[licenses.private]
# Our own crates are `publish = false` and AGPL-3.0-only. They are checked
# against the allowlist like every other crate, so the workspace license cannot
# drift away from ADR 0080 unnoticed.
ignore = false

[advisories]
version = 2
# `vulnerability` keeps its default of "deny": a known vulnerability fails CI.
unmaintained = "workspace"
yanked = "deny"
# An ignore is a policy decision and needs a recorded decision with the
# advisory id, the reason and the date.
ignore = [
    # 2026-11-09, ADR 0284. Bundled SQLite before 3.54 can read uninitialised
    # memory when it opens a database together with a crafted `-wal` file.
    # Quoro opens only the SQLite files it writes in its own data directory,
    # and a restore removes stale `-wal` and `-shm` files first; the image
    # inventory reads `rpmdb.sqlite` with its own reader. No sqlx release
    # allows libsqlite3-sys 0.39 or later yet. Remove this entry with #619.
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite opens only Quoro's own files; no sqlx release takes the fix yet (ADR 0284)" },
]

[bans]
# Duplicate versions are reported by the check but are not fatal: a duplicate is
# a finding for review, not a build failure.
multiple-versions = "warn"
# Wildcard version requirements hide which version is actually used.
wildcards = "deny"
# Workspace members depend on each other by path, which is not a wildcard.
allow-wildcard-paths = true
highlight = "all"

[sources]
# crates.io is the only source; anything else must be a recorded decision.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
