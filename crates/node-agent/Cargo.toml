[package]
name = "quoro-node-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The lease agent speaks the node-agent protocol message types.
quoro-proto = { path = "../proto" }
# The self-fence path stops stateful VMs through the engine trait; tests use
# the fake engine behind it.
quoro-engine = { path = "../engine" }
# Channels for the session and the stop flag (`sync`), the paused monotonic
# clock the lease timing runs on (`time`), and `tokio::select!` in the agent
# loop (`macros`); no default features.
tokio = { version = "1", default-features = false, features = [
    "sync",
    "time",
    "macros",
] }

[dev-dependencies]
# Tests need the `#[tokio::test]` macro, a runtime, and `test-util` to pause the
# clock so lease timing and the injected stop delays are deterministic.
tokio = { version = "1", features = [
    "macros",
    "rt",
    "test-util",
    "sync",
    "time",
] }
