[package]
name = "quoro-node-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The lease agent speaks the node-agent protocol message types.
quoro-proto = { path = "../proto" }
# The self-fence path stops stateful VMs through the engine trait; tests use
# the fake engine behind it.
quoro-engine = { path = "../engine" }
# The node-side reverse proxy, tunnel connector and ACME manager it supervises
# (ADR 0024, 0094, 0096).
quoro-ingress = { path = "../ingress" }
# Tunnel run tokens and DNS records: the node holds no provider credential.
quoro-providers = { path = "../providers" }
# Channels for the session and the stop flag (`sync`), the paused monotonic
# clock the lease timing runs on (`time`), and `tokio::select!` in the agent
# loop (`macros`); no default features.
tokio = { version = "1", default-features = false, features = [
    "sync",
    "time",
    "macros",
    "net",
    "rt",
    "fs",
    "io-util",
    # The build source runs the host's Git client and streams its archive.
    "process",
] }
# TLS to the primary, pinned to its certificate fingerprint (section 2.2); the
# ring provider is the one ADR 0080 allows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The dial-out WebSocket session over that TLS stream (section 3.1).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# `StreamExt`/`SinkExt` on the WebSocket.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The enrollment POST over the same pinned TLS stream (section 2.3).
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1", default-features = false }
# The local node store (section 12) is SQLite, like the control plane's.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# The certificate pin is SHA-256 over the DER certificate.
sha2 = { version = "0.10", default-features = false }
# XChaCha20-Poly1305 AEAD for the desired-state bodies at rest, under the
# node-local key (section 12); nonces come from `getrandom`, so the crate's
# `getrandom` feature stays off.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
# Node keypair seeds, boot ids and message ids come from the OS generator.
getrandom = { version = "0.3", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The build source disk is one tar stream (section 6.6); the same pinned
# version the engine uses to read image layers.
tar = { version = "0.4", default-features = false }

[dev-dependencies]
# Tests need the `#[tokio::test]` macro, a runtime, and `test-util` to pause the
# clock so lease timing and the injected stop delays are deterministic.
tokio = { version = "1", features = [
    "macros",
    "rt",
    "test-util",
    "sync",
    "time",
] }
# The TLS test generates a self-signed certificate and keys its pin off its
# digest (section 2.2); rcgen 0.13 is already in `Cargo.lock`.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# The interactive tests decode `stream_data` and re-hash a transcript file;
# both crates are already the library's dependencies.
base64 = { version = "0.22", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
