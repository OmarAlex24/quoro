[package]
name = "quoro-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Every message is JSON on the wire (node-agent-protocol.md section 3.2).
serde = { version = "1", default-features = false, features = ["derive", "std"] }
# `float_roundtrip` parses each float as the double nearest to its text, so
# a record hashed over its RFC 8785 text re-hashes from that text (`jcs`,
# audit-log-format.md sections 4.1 and 5, ADR 0315).
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }
# desired_state and signing_key_rotate are signed with the cluster's Ed25519
# key (section 5.11, ADR 0050); both sides sign or verify through this crate.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
# Keys and signatures travel as standard base64 (section 2.4).
base64 = { version = "0.22", default-features = false, features = ["std"] }
# `inventory_sha256` is the SHA-256 of the canonical inventory object
# (sections 5.26 and 6.11).
sha2 = { version = "0.10", default-features = false }
# Custody seals are HPKE base mode with one fixed suite: DHKEM(X25519,
# HKDF-SHA256), HKDF-SHA256 and ChaCha20-Poly1305 (section 7.2, ADR 0180,
# ADR 0231). Only that suite's features are on; `getrandom` stays off, since
# every call that needs randomness takes an RNG.
hpke = { version = "0.15", default-features = false, features = ["alloc", "x25519", "chacha"] }
# The OS generator behind custody key pairs and seal ephemerals, as the
# `rand_core` 0.10 RNG hpke takes; the version and feature already in
# `Cargo.lock`.
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
# Wipes a serialized custody private key and an opened seal when dropped.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
