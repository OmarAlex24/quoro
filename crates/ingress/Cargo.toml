[package]
name = "quoro-ingress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
quoro-providers = { path = "../providers" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time", "macros", "process", "fs", "io-util"] }
# The reverse proxy: HTTP/1.1 server and client (D-0059).
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "server-auto", "client-legacy", "http1"] }
http-body-util = { version = "0.1", default-features = false }
bytes = { version = "1", default-features = false, features = ["std"] }
# TLS termination on 443 with the `ring` provider (ADR 0080).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# ACME client for DNS-01 issuance and ARI renewal (spike #65).
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "time", "x509-parser"] }
# CSR and certificate key generation; same major instant-acme uses.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Reads notAfter of stored certificates; same major instant-acme uses.
x509-parser = { version = "0.18", default-features = false }
time = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "test-util", "signal"] }
# The lab example reads a provider's credential from the node's own database
# through the control plane's in-process accessor (no HTTP path returns it).
quoro-control-plane = { path = "../control-plane" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
