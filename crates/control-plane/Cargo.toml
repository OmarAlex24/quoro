[package]
name = "quoro-control-plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# ADR 0223: dev-only, for test-lab builds. It lets `updateApp` accept
# `ha_policy: warm` before the warm policy ships, so an app's lease can turn
# `expiring` once the primary side of that mode change exists (#555). It
# creates no warm copy, no standby VM and no replication. Off by default, and
# the release build never enables it: CI fails a default or release binary
# that reports it. Removed when the warm policy merges (#533).
dev-warm-policy = []

[dependencies]
quoro-types = { path = "../types" }
# Wire messages, RFC 8785 canonical JSON and the desired-state signature.
quoro-proto = { path = "../proto" }
# Ingress backends: the primary-side tunnel controller (ADR 0094).
quoro-ingress = { path = "../ingress" }
# Provider clients: Cloudflare DNS and tunnels (ADR 0025, 0055) and the S3
# client backups use (backup-format.md section 10).
quoro-providers = { path = "../providers" }
# The backup repository format: keys, chunks, manifests, seals, config objects
# and the layout (backup-format.md sections 2 to 6).
quoro-backup = { path = "../backup" }
# `ws` serves the node-agent session (GET /api/v1/nodes/session).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
# Node public keys and credentials are base64 (node-agent-protocol.md section 2).
base64 = { version = "0.22", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
utoipa = { version = "5", default-features = false, features = ["macros"] }
sha2 = { version = "0.10", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
getrandom = { version = "0.3", default-features = false }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# AEAD for the `*_enc` columns under the cluster data-encryption key (D-0050).
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# HMAC-SHA256 signatures of webhook deliveries (D-0032).
hmac = { version = "0.12", default-features = false }
# POSTs webhook deliveries over HTTPS, with the same native-roots, no-provider
# rustls setup as the provider client (D-0032).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots-no-provider"] }
# Wipes key material and decrypted secrets from memory when they are dropped.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# The live-log SSE body is a stream built with `stream::unfold` (ADR 0057).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Reads the OSV ecosystem archives, one record at a time
# (node-agent-protocol.md section 6.11). Deflate only: flate2 is already in the
# tree, and no other compression method appears in those archives.
zip = { version = "9.3", default-features = false, features = ["deflate-flate2"] }
# `zip`'s deflate goes through flate2, whose default features are off in that
# tree, so the pure-Rust backend the engine uses is named here too (no C zlib).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Debian's version order (`1:2.36-9+deb12u4`, `2.3.1-2~bpo12+1`) for the
# Debian and Ubuntu ranges the vulnerability matcher evaluates.
debversion = { version = "0.5.5", default-features = false }
# PEP 440's version order (`2!1.0`, `1.0rc1`, `1.0.post1`) for PyPI ranges.
pep440_rs = { version = "0.7.3", default-features = false }
# CVSS base scores from a record's v3 and v4 vectors, for its severity band.
cvss = { version = "3", default-features = false, features = ["std", "v3", "v4"] }

[build-dependencies]
# `build.rs` writes the embedded component list, so it reads and rewrites the
# SBOM's JSON with the version this crate already uses.
serde_json = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
quoro-types = { path = "../types" }
# The HTTP harness serves the router with `axum::serve`.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
# The frozen contract is YAML; the diff test parses it to compare with the
# generated document (D-0048). serde_norway is the maintained serde_yaml fork
# utoipa itself offers.
serde_norway = { version = "0.9", default-features = false }
# Integration tests drive the API over real HTTP with a cookie jar.
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
# In a workspace build, feature unification gives reqwest the binary's
# no-provider rustls feature, so the tests install the ring provider first.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The node-session tests speak the WebSocket protocol against the router.
# `connect_async` needs the `connect` feature, so the tests dial a plain
# `TcpStream` and hand it to `client_async`, as the node agent does.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# State-machine tests of the draining tunnel routes (ADR 0194).
proptest = { version = "1", default-features = false, features = ["std"] }
