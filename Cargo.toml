# Workspace root. Members follow the workspace layout in
# docs/architecture/architecture.md section 17; only the crates M0 needs exist.
# Every dependency must be justified: see DEPENDENCIES.md.
[workspace]
resolver = "3"
members = [
    "crates/engine",
    "crates/init",
    "crates/proto",
    "crates/node-agent",
    "crates/types",
    "crates/control-plane",
    "crates/quoro",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

# Dev and test builds keep line tables for our crates (readable backtraces) and
# no debug info for dependencies: target/ shrinks by more than half and links
# faster. Release builds are not affected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
