    post:
      tags: [audit]
      operationId: verifyAudit
      summary: Verify the audit hash chain
      description: |
        Recomputes the hash links of a range of the audit log, by default the whole
        log. A broken link sets `ok: false` with `broken_at_seq` and `reason`, and
        emits `audit.chain_broken` (D-0031). The range bounds are optional.
        `Quoro-Justification` is required when the caller is an agent (D-0031).
      x-quoro-scope: audit:read
      parameters:
        - $ref: '#/components/parameters/QuoroJustification'
      requestBody:
        required: false
        description: Optional range to verify; the whole log by default.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditVerificationRequest'
      responses:
        '200':
          description: The verification result.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerificationResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
