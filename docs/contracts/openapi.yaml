  /api/v1/nodes/session:
    get:
      tags: [nodes]
      operationId: openNodeSession
      summary: Open the node-agent session
      description: |
        The dial-out session between a node and the control plane. The request
        carries the node credential; on success the node upgrades the connection to
        a WebSocket (HTTP 101). Nodes behind NAT dial out, so the control plane
        never connects to a node. The message types (`hello`, `heartbeat`,
        `status_report`, `desired_state`, `lease_grant`, `log_entries`,
        `stream_open`, `command`, ...), reconciliation and self-fencing are fixed by
        `docs/contracts/node-agent-protocol.md` (D-0019). This endpoint is the only
        consumer of the `node` scope value.
      x-quoro-scope: node
      security:
        - nodeCredential: []
      responses:
        '101':
          description: Switching protocols; the connection is now a WebSocket.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
            Upgrade:
              description: Always `websocket`.
              schema:
                type: string
                enum: [websocket]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
