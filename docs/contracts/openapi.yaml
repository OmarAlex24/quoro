  /api/v1/builds/{build_id}/logs/stream:
    get:
      tags: [builds]
      operationId: streamBuildLogs
      summary: Stream a build's log live
      description: |
        Server-sent events of a build's log, read from the node on demand
        (ADR 0014, ADR 0057, ADR 0119). Framing, once the response started with
        `200` and `Content-Type: text/event-stream`: `id:` carries the line's
        `seq`, `event:` carries `log` (a `BuildLogLine`), `status` (the `Build`
        whenever its status changes), `error` (a `Problem`) or `end` (sent once
        the build is terminal and every line was sent; the stream then closes).
        A client resumes with `Last-Event-ID` set to the last `seq` it saw. A
        finished build replays its log and ends. An unreachable node answers
        `node_unreachable` (504) before the stream starts, or an `error` event
        after it started.
      x-quoro-scope: app:logs
      parameters:
        - $ref: '#/components/parameters/BuildId'
        - name: tail
          in: query
          required: false
          description: Start with the last `tail` lines instead of the whole log. Ignored when `Last-Event-ID` is sent.
          schema:
            type: integer
            minimum: 0
            maximum: 5000
        - name: Last-Event-ID
          in: header
          required: false
          description: Last line `seq` the client received; the stream resumes after it.
          schema:
            type: string
      responses:
        '200':
          description: The stream started; events follow until the build is terminal or the client disconnects.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
            Cache-Control:
              description: Always `no-cache`; the stream must not be cached.
              schema:
                type: string
                enum: [no-cache]
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames. Each frame is `id: <seq>` (log lines only),
                  `event: <type>`, `data: <json>`, separated by a blank line.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/NodeUnreachable'
