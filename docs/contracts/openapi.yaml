        succeeds, the control plane sets the app's `image` to the built image
        and starts a deployment with `trigger: build`, which is why this needs
        `app:deploy`. A node runs one build at a time; further builds wait in
        `queued`. Emits `build.started`; the outcome is `build.succeeded`,
        `build.failed` or `build.cancelled`. `conflict` (409) when the app has
