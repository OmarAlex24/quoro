  /api/v1/nodes/{node_id}/declare-lost:
    post:
      tags: [nodes]
      operationId: declareNodeLost
      summary: Declare a disconnected node lost
      description: |
        Records a human's statement that a disconnected node is gone, so the
        apps it held may start elsewhere (ADR 0183, node-agent-protocol.md
        section 8.3). In one transaction the primary increments the fencing
        token of every lease the node holds and revokes each one in its own
        view, sets the node's `lost_at`, and writes the audit record. The node
        stays enrolled and stays a voter. Leases listed in its `fence_failure`
        stay ungrantable until that fence is acknowledged, and an `expiring`
        lease still waits for its gate. When the node returns, the primary
        revokes those leases on its session before anything else. The scope is
        human-only: an agent is refused with `forbidden` and
        `reason: human_only`. A connected or removed node is refused with
        `conflict`. Declaring a node already declared lost changes nothing and
        answers `200`. The call is audited (D-0031).
      x-quoro-scope: node:declare_lost
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: The node was declared lost; it is returned with `lost_at` set.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/nodes/{node_id}/tunnel:
    put:
      tags: [nodes]
      operationId: setNodeTunnel
      summary: Map a node to a tunnel provider
      description: |
        Records which `tunnel` provider runs this node's tunnel (D-0094, D-0095).
        The primary then creates or looks up the node's tunnel with that
        provider's account credential and sends the node only the tunnel id and
        its run token in desired state (node-agent-protocol.md section 5.11).
        Replacing the provider of a node that serves `tunnel` domains is refused
        with `conflict`; remove those domains first. Mapping nodes to provider
        credentials is human-only: an agent's access token is refused with
        `forbidden` and `reason: human_only` (D-0029, D-0051). The call is
        audited (D-0031).
      x-quoro-scope: provider:manage
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        description: The tunnel provider and the node's loopback origin port.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNodeTunnelRequest'
      responses:
        '200':
          description: The mapping was recorded; the node is returned with its `tunnel`.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
    delete:
      tags: [nodes]
      operationId: deleteNodeTunnel
      summary: Remove a node's tunnel mapping
      description: |
        Removes the node's tunnel mapping. The primary deletes the node's tunnel
        at the provider and stops sending `spec.ingress.tunnel`, so the node stops
        its tunnel connector. A node that still serves `tunnel` domains is refused
        with `conflict`. Human-only like the other provider operations (D-0051).
        The call is audited (D-0031).
      x-quoro-scope: provider:manage
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '204':
