  /api/v1/webhooks/{webhook_id}/test:
    post:
      tags: [webhooks]
      operationId: testWebhook
      summary: Send a signed test delivery
      description: |
        Sends one test delivery to the receiver, signed like a real delivery, and
        records it in the delivery history. It is the fastest way to check the
        receiver verifies `Quoro-Signature` correctly. Quoro has no test event
        type: the body is the newest event of the event log, replayed as-is, and
        an empty event log answers `validation_failed` (422). A test delivery is
        attempted once, never retried, never issues an incident grant and never
        carries `data.wake`. It is recorded as its own delivery, separate from
        the real deliveries of the same event, so it never replaces, blocks or
        collides with them; its `test` field is true. Human-only (D-0030).
        `Quoro-Justification` is required when the caller is an agent (D-0031).
      x-quoro-scope: webhook:write
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/QuoroJustification'
      responses:
        '202':
          description: The test delivery was attempted and recorded.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
