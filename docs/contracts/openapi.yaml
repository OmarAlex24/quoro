openapi: 3.1.0
info:
  title: Quoro API
  version: 0.1.0
  summary: HTTP API of the Quoro control plane.
  description: |
    HTTP API for the M1-M4 surface of Quoro, a self-hosted tool that unifies a
    hypervisor (Cloud Hypervisor + KVM, one microVM per app) with application
    deployment. One binary serves this API on every node: the primary is the
    single writer and the source of truth, replicas hold a copy of the change log
    and forward writes to the primary (D-0012).

    This hand-written file is the frozen source of truth: the frozen M0 contract
    (D-0033) and the reference the control plane's utoipa-generated document is
    diffed against in CI, where any semantic difference fails the build; the
    TypeScript client for the panel is generated from this file with orval
    (D-0048). Every operation carries `x-quoro-scope` and, where an MCP tool
    exposes it, `x-quoro-mcp-tool` (D-0031, D-0033). Mutating calls made by an
    agent carry a justification header that is recorded in the append-only audit
    log (D-0031).

    Vocabulary, identifiers, statuses, scopes, event types, error codes and
    headers are fixed by `docs/contracts/README.md`; the entity fields are fixed
    by the shared entity model used by every contract file. Timestamps are
    RFC 3339 UTC strings. Ids are `<prefix>_<ULID>` strings with a Crockford
    base32 ULID (26 characters). Telemetry such as app logs and metrics stays on
    each node and is read on demand through the control plane; only state is
    replicated (D-0014).
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: |
      The API as served by the node the client talks to. A write that reaches a
      replica is forwarded to the primary; if the replica cannot forward it, the
      call fails with `not_primary` (503) (D-0012).
security:
  - bearerAuth: []
  - sessionCookie: []
tags:
  - name: health
    description: Liveness and first-run setup.
  - name: auth
    description: Human sessions, agent token minting and the current identity.
  - name: tokens
    description: Personal API tokens of a human user.
  - name: cluster
    description: Cluster identity, version and change-log position.
  - name: nodes
    description: Nodes of the cluster, enrollment and the node-agent session.
  - name: projects
    description: Projects, the container of apps.
  - name: vms
    description: MicroVM lifecycle.
  - name: apps
    description: Apps, their settings, environment variables and lifecycle.
  - name: deployments
    description: Rollouts of an image to an app.
  - name: domains
    description: Hostnames routed to an app and their TLS state.
  - name: logs
    description: App logs read on demand from the node that runs the app.
  - name: users
    description: Human identities and their roles.
  - name: agents
    description: AI identities and their long-lived keys.
  - name: grants
    description: Scoped, time-limited authority of an agent.
  - name: approvals
    description: Just-in-time approval of destructive actions.
  - name: incidents
    description: Incidents opened by a detection and closed by a human or agent.
  - name: audit
    description: The append-only, hash-chained audit log and its verification.
  - name: events
    description: The event log and the event stream.
  - name: webhooks
    description: Event subscriptions that deliver to an external receiver.
  - name: providers
    description: Credentials for external providers (DNS, tunnels, load balancers, object storage).
  - name: builds
    description: Image builds of an app's Git source, run on its node in a builder microVM.
  - name: metrics
    description: Node and app CPU and memory read on demand from the nodes.
  - name: interactive
    description: Web terminal and read-only serial console sessions over WebSocket.
  - name: volumes
    description: Local persistent disks of stateful apps, one node each.
  - name: backups
    description: Encrypted backups of volumes and of the control-plane database in object storage, and their restore.
  - name: vulnerabilities
    description: Known vulnerabilities of app images, of Quoro's own components and of host kernels, matched against a local copy of OSV data.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A human API token (`tok_...`) or an agent access token (`atk_...`).
        Agent access tokens are minted from an agent key at
        `POST /api/v1/auth/agent-token` and live 5 minutes (D-0030).
    sessionCookie:
      type: apiKey
      in: cookie
      name: quoro_session
      description: |
        Session cookie set by `POST /api/v1/auth/login`. The web panel uses this
        scheme; agents never do.
    agentKey:
      type: http
      scheme: bearer
      description: |
        An agent key (`akey_...`). It authorizes nothing by itself; it is only
        accepted to mint a short-lived access token (D-0030).
    nodeCredential:
      type: http
      scheme: bearer
      description: |
        The node session credential returned by enrollment. It authenticates the
        node-agent session only (see `docs/contracts/node-agent-protocol.md`).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-chosen key for a create. A repeated call with the same key and the
        same body returns the original result instead of creating a second
        resource (D-0031 records the call either way).
      schema:
        type: string
        minLength: 1
        maxLength: 128
    QuoroJustification:
      name: Quoro-Justification
      in: header
      required: false
      description: |
        The agent's stated reason for the call. Required when the caller is an
        agent; it is recorded in the audit log (D-0031). Human callers may omit
        it.
      schema:
        type: string
        minLength: 1
        maxLength: 2000
    QuoroIncident:
      name: Quoro-Incident
      in: header
      required: false
      description: |
        The incident (`inc_...`) the call belongs to, when an agent acts on an
        incident (D-0032). Recorded in the audit log and used to evaluate
        incident grants (D-0030).
      schema:
        type: string
        pattern: '^inc_[0-9A-HJKMNP-TV-Z]{26}$'
    QuoroSetupToken:
      name: Quoro-Setup-Token
      in: header
      required: true
      description: |
        One-time token printed by the installer or by `quoro setup-token`. It is
        single use and expires one hour after it was issued (D-0054).
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (default 50, maximum 500).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `next_cursor` by the previous page.
      schema:
        type: string
    AfterSeq:
      name: after_seq
      in: query
      required: false
      description: Return only entries whose `seq` is greater than this value.
      schema:
        type: integer
        minimum: 0
    NodeId:
      name: node_id
      in: path
      required: true
      description: Node id (`nod_...`).
      schema:
        type: string
        pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
    ProjectId:
      name: project_id
      in: path
      required: true
      description: Project id (`prj_...`).
      schema:
        type: string
        pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
    VmId:
      name: vm_id
      in: path
      required: true
      description: VM id (`vm_...`).
      schema:
        type: string
        pattern: '^vm_[0-9A-HJKMNP-TV-Z]{26}$'
    AppId:
      name: app_id
      in: path
      required: true
      description: App id (`app_...`).
      schema:
        type: string
        pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      description: Deployment id (`dep_...`).
      schema:
        type: string
        pattern: '^dep_[0-9A-HJKMNP-TV-Z]{26}$'
    DomainId:
      name: domain_id
      in: path
      required: true
      description: Domain id (`dom_...`).
      schema:
        type: string
        pattern: '^dom_[0-9A-HJKMNP-TV-Z]{26}$'
    TokenId:
      name: token_id
      in: path
      required: true
      description: API token id (`tok_...`).
      schema:
        type: string
        pattern: '^tok_[0-9A-HJKMNP-TV-Z]{26}$'
    UserId:
      name: user_id
      in: path
      required: true
      description: User id (`usr_...`).
      schema:
        type: string
        pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
    AgentId:
      name: agent_id
      in: path
      required: true
      description: Agent id (`agt_...`).
      schema:
        type: string
        pattern: '^agt_[0-9A-HJKMNP-TV-Z]{26}$'
    KeyId:
      name: key_id
      in: path
      required: true
      description: Agent key id (`akey_...`).
      schema:
        type: string
        pattern: '^akey_[0-9A-HJKMNP-TV-Z]{26}$'
    GrantId:
      name: grant_id
      in: path
      required: true
      description: Grant id (`grt_...`).
      schema:
        type: string
        pattern: '^grt_[0-9A-HJKMNP-TV-Z]{26}$'
    ApprovalId:
      name: approval_id
      in: path
      required: true
      description: Approval request id (`apr_...`).
      schema:
        type: string
        pattern: '^apr_[0-9A-HJKMNP-TV-Z]{26}$'
    IncidentId:
      name: incident_id
      in: path
      required: true
      description: Incident id (`inc_...`).
      schema:
        type: string
        pattern: '^inc_[0-9A-HJKMNP-TV-Z]{26}$'
    WebhookId:
      name: webhook_id
      in: path
      required: true
      description: Webhook id (`whk_...`).
      schema:
        type: string
        pattern: '^whk_[0-9A-HJKMNP-TV-Z]{26}$'
    ProviderId:
      name: provider_id
      in: path
      required: true
      description: Provider id (`prv_...`).
      schema:
        type: string
        pattern: '^prv_[0-9A-HJKMNP-TV-Z]{26}$'
    BuildId:
      name: build_id
      in: path
      required: true
      description: Build id (`bld_...`).
      schema:
        type: string
        pattern: '^bld_[0-9A-HJKMNP-TV-Z]{26}$'
    InteractiveSessionId:
      name: session_id
      in: path
      required: true
      description: Terminal or console session id (`trm_...`).
      schema:
        type: string
        pattern: '^trm_[0-9A-HJKMNP-TV-Z]{26}$'
    VolumeId:
      name: volume_id
      in: path
      required: true
      description: Volume id (`vol_...`).
      schema:
        type: string
        pattern: '^vol_[0-9A-HJKMNP-TV-Z]{26}$'
    QuarantineId:
      name: quarantine_id
      in: path
      required: true
      description: Quarantined copy id (`qrn_...`).
      schema:
        type: string
        pattern: '^qrn_[0-9A-HJKMNP-TV-Z]{26}$'
    LostNodeId:
      name: lost_node_id
      in: query
      required: true
      description: The node whose loss the N+1 indicator simulates (`nod_...`).
      schema:
        type: string
        pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
    BackupId:
      name: backup_id
      in: path
      required: true
      description: Backup id (`bkp_...`).
      schema:
        type: string
        pattern: '^bkp_[0-9A-HJKMNP-TV-Z]{26}$'
    BackupRepositoryId:
      name: repository_id
      in: path
      required: true
      description: Backup repository id (`brp_...`).
      schema:
        type: string
        pattern: '^brp_[0-9A-HJKMNP-TV-Z]{26}$'
    AuditExportId:
      name: export_id
      in: path
      required: true
      description: Audit export id (`aex_...`).
      schema:
        type: string
        pattern: '^aex_[0-9A-HJKMNP-TV-Z]{26}$'
    Seq:
      name: seq
      in: path
      required: true
      description: Sequence number of an audit record or event.
      schema:
        type: integer
        minimum: 1
  headers:
    QuoroRequestId:
      description: |
        Correlation id of this call (`req_...`). It appears in the audit record
        of the call (D-0031).
      required: true
      schema:
        type: string
        pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'
  responses:
    Unauthenticated:
      description: |
        No valid credential was presented (`code: unauthenticated`, 401).
      headers:
        Quoro-Request-Id:
          $ref: '#/components/headers/QuoroRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        The caller is authenticated but not allowed (`code: forbidden`, 403).
        `reason` says whether the scope, the selector, the grant state or the
        identity was the obstacle.
      headers:
        Quoro-Request-Id:
          $ref: '#/components/headers/QuoroRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ApprovalRequired:
      description: |
        The action needs just-in-time approval (`code: approval_required`, 403).
        The body names the `scope` and the `target` so the agent can file an
        approval request (D-0030).
      headers:
        Quoro-Request-Id:
          $ref: '#/components/headers/QuoroRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        The addressed resource does not exist (`code: not_found`, 404).
      headers:
        Quoro-Request-Id:
          $ref: '#/components/headers/QuoroRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        The request conflicts with the current state, for example a duplicate
        slug, a non-empty project or a second setup (`code: conflict`, 409).
      headers:
        Quoro-Request-Id:
          $ref: '#/components/headers/QuoroRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: |
        The body or query is invalid (`code: validation_failed`, 422). Used also
        for an HA policy other than `none` before M5a, a scope an agent grant may
        not carry, and a missing mandatory TTL.
      headers:
        Quoro-Request-Id:
          $ref: '#/components/headers/QuoroRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: |
        Too many requests (`code: rate_limited`, 429).
      headers:
        Quoro-Request-Id:
          $ref: '#/components/headers/QuoroRequestId'
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotPrimary:
      description: |
        The write reached a replica that cannot forward it to the primary
        (`code: not_primary`, 503) (D-0012). From M5b a demoted primary, one
        that learned of a higher term, answers every request this way
        (node-agent-protocol.md section 7.4). The client may retry against the
        primary.
      headers:
        Quoro-Request-Id:
          $ref: '#/components/headers/QuoroRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NodeUnreachable:
      description: |
        On-demand telemetry could not reach the node (`code: node_unreachable`,
        504). Telemetry stays on the node and is read through the control plane
        on demand (D-0014).
      headers:
        Quoro-Request-Id:
          $ref: '#/components/headers/QuoroRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Internal:
      description: |
        An unexpected error occurred (`code: internal`, 500).
      headers:
        Quoro-Request-Id:
          $ref: '#/components/headers/QuoroRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      title: Problem
      description: |
        RFC 9457 problem detail with Quoro's extra fields. The media type is
        `application/problem+json`. `code` is the machine-readable error; `reason`
        refines `forbidden` and, from M5b, the `conflict` of a failover, a
        switchover or a delete that would remove quarantined data; `scope` plus
        `target` refine `approval_required` so an agent can file the matching
        approval request (D-0030).
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI identifying the problem type; `about:blank` when none.
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code of this response.
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI of the request that produced the problem.
        code:
          type: string
          description: Machine-readable error code.
          enum:
            - unauthenticated
            - forbidden
            - approval_required
            - not_found
            - conflict
            - validation_failed
            - rate_limited
            - not_primary
            - node_unreachable
            - internal
        reason:
          type: string
          description: |
            Why a `forbidden` response was returned: `scope_missing`,
            `selector_mismatch`, `grant_expired`, `grant_revoked`,
            `grant_exhausted`, `human_only` or `agent_disabled`. From M5b also
            why a `conflict` was returned by `failoverApp` or `switchoverApp`
            (`not_warm`, `no_copy`, `not_in_sync`, `node_disconnected`,
            `fence_failed`, `no_support`, `lease_held`, `in_progress`; each
            operation says when), by `deleteApp` and `deleteVolume`
            (`has_quarantines`), or by `rotateSigningKey` (`in_progress`).
            Absent for other codes and other conflicts.
          enum:
            - scope_missing
            - selector_mismatch
            - grant_expired
            - grant_revoked
            - grant_exhausted
            - human_only
            - agent_disabled
            - not_warm
            - no_copy
            - not_in_sync
            - node_disconnected
            - fence_failed
            - no_support
            - lease_held
            - in_progress
            - has_quarantines
        scope:
          type: string
          description: |
            The scope that was missing, or that an approval must grant
            (`approval_required`). One scope from `x-quoro-scope`.
        target:
          $ref: '#/components/schemas/Target'
    HealthStatus:
      type: object
      title: HealthStatus
      description: Liveness answer of the node that served the call.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Fixed liveness value.
    SetupRequest:
      type: object
      title: SetupRequest
      description: |
        First-run setup. Creates the first user as `owner`. Accepted only while
        no user exists; afterwards the call fails with `conflict`.
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
          description: Email of the first owner.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name of the first owner.
        password:
          type: string
          format: password
          minLength: 12
          writeOnly: true
          description: Password of the first owner. Stored as an Argon2id hash; never returned.
    LoginRequest:
      type: object
      title: LoginRequest
      description: Human login with email and password; answers with a session cookie.
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email of the user.
        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: Password of the user.
    ChangePasswordRequest:
      type: object
      title: ChangePasswordRequest
      description: The signed-in human's current password and the new one (ADR 0135).
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: The password the user signs in with today.
        new_password:
          type: string
          format: password
          minLength: 12
          writeOnly: true
          description: |
            The new password, different from the current one. Stored as an
            Argon2id hash.
    MeResponse:
      type: object
      title: MeResponse
      description: |
        The identity behind the credential. A human answers with `user`; an agent
        answers with `agent` and its active grants (D-0029, D-0030).
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - user
            - agent
          description: Kind of identity.
        user:
          $ref: '#/components/schemas/User'
        agent:
          $ref: '#/components/schemas/Agent'
        grants:
          type: array
          description: Active grants of the agent; empty for a human.
          items:
            $ref: '#/components/schemas/Grant'
    AccessTokenResponse:
      type: object
      title: AccessTokenResponse
      description: |
        A short-lived agent access token minted from an agent key. It is valid for
        5 minutes and carries no scope of its own: every call is authorized
        against the agent's grants (D-0030).
      required:
        - access_token
        - expires_at
      properties:
        access_token:
          type: string
          pattern: '^atk_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The access token. It is shown only in this response.
        expires_at:
          type: string
          format: date-time
          description: Expiry, 5 minutes after issue.
    Cluster:
      type: object
      title: Cluster
      description: |
        The single installation (D-0012). The primary is the source of truth; the
        change log is the state (D-0015).
      required:
        - id
        - name
        - version
        - primary_node_id
        - log_seq
        - log_head_hash
        - term
        - votes
        - created_at
      properties:
        id:
          type: string
          pattern: '^cls_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Cluster id.
        name:
          type: string
          description: Cluster name chosen at setup.
        version:
          type: string
          description: Version of the running binary.
        primary_node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Node that currently holds the primary status.
        log_seq:
          type: integer
          minimum: 0
          description: Sequence number of the last change-log entry.
        log_head_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hash of the last change-log entry.
        term:
          type: integer
          minimum: 1
          description: |
            Term of the current primary: 1 until the first promotion, then one
            more with each promotion, which takes it from a majority of voters
            (node-agent-protocol.md sections 7.3 and 8.8). Automatic elections
            are M6.
        votes:
          $ref: '#/components/schemas/ClusterVotes'
        signing_key_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            Id of the current cluster signing key: the lowercase hex SHA-256 of
            its public key (node-agent-protocol.md section 5.21). Absent until
            the promotion and custody work ships.
        signing_key_rotation:
          description: |
            The signing-key rotation that is running, or null when none is
            (node-agent-protocol.md section 7.5). Absent until the promotion
            and custody work ships.
          oneOf:
            - $ref: '#/components/schemas/SigningKeyRotation'
            - type: 'null'
        created_at:
          type: string
          format: date-time
          description: When the cluster was created.
    SigningKeyRotation:
      type: object
      title: SigningKeyRotation
      description: |
        A running rotation of the cluster signing key (ADR 0154,
        node-agent-protocol.md section 7.5). It completes once every machine
        that is not removed pins the next key; a machine that never returns
        holds it open until it is removed.
      required:
        - next_key_id
        - started_at
        - pending_node_ids
      properties:
        next_key_id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Id of the next signing key.
        started_at:
          type: string
          format: date-time
          description: When the rotation started.
        pending_node_ids:
          type: array
          description: Machines of any role that still pin the current key, oldest enrolled first.
          items:
            type: string
            pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
    ClusterVotes:
      type: object
      title: ClusterVotes
      description: |
        The voters of the cluster (ADR 0170): every enrolled machine with the
        `node` or `witness` role that is not removed, connected or not. An
        edge-only machine does not vote, and one machine has one vote whatever
        its roles. Below `required` the HA view says that HA needs a third vote
        and offers a witness: a join token with role `witness` for a new
        machine, or `POST /api/v1/nodes/{node_id}/roles` for an enrolled one.
      required:
        - voters
        - count
        - required
        - ha_ready
      properties:
        voters:
          type: array
          description: Every voter, oldest enrolled first.
          items:
            $ref: '#/components/schemas/ClusterVoter'
        count:
          type: integer
          minimum: 0
          description: Number of voters.
        required:
          type: integer
          minimum: 1
          description: Voters that HA needs; 3 in M5b (ADR 0017).
        ha_ready:
          type: boolean
          description: |
            Whether `count` is at least `required` and the primary holds the
            support of a majority of voters right now, so it can grant and renew
            `expiring` leases (ADR 0169, node-agent-protocol.md section 8.8). A
            primary that does not track support yet reports false.
    ClusterVoter:
      type: object
      title: ClusterVoter
      description: One voter of the cluster.
      required:
        - node_id
        - roles
        - connected
      properties:
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The voting machine.
        roles:
          type: array
          description: The machine's roles; at least one of them is `node` or `witness`.
          items:
            type: string
            enum:
              - node
              - witness
              - edge
        connected:
          type: boolean
          description: Whether the machine's node-agent session is up now.
    NodeCapacity:
      type: object
      title: NodeCapacity
      description: |
        Capacity of a node, and the part of it allocated to VMs. Both use the same
        shape.
      required:
        - cpus
        - memory_mb
        - disk_gb
      properties:
        cpus:
          type: integer
          minimum: 1
          description: Number of logical CPUs.
        memory_mb:
          type: integer
          minimum: 0
          description: Memory in mebibytes, as reported by the kernel.
        disk_gb:
          type: integer
          minimum: 0
          description: Disk in gibibytes available to VM disks.
    KvmInfo:
      type: object
      title: KvmInfo
      description: Result of the KVM probe a node runs at enrollment and on request.
      required:
        - available
        - kernel
      properties:
        available:
          type: boolean
          description: Whether `/dev/kvm` is usable.
        kernel:
          type: string
          description: Kernel release reported by the probe.
        nested:
          type: boolean
          description: Whether the node itself runs as a guest with nested virtualization.
    Node:
      type: object
      title: Node
      description: |
        A machine running the Quoro binary (D-0012). `cp_status` is the
        control-plane status; whether a node follows the change log is visible in
        its `log_seq` and `log_lag`, and whether it can be promoted in its
        `custody`, not in `cp_status` (node-agent-protocol.md section 7).
      required:
        - id
        - name
        - roles
        - cp_status
        - status
        - public_key
        - behind_nat
        - labels
        - capacity
        - allocated
        - kvm
        - desired_rev
        - applied_rev
        - log_seq
        - fence_failure
        - tunnel
        - lost_at
        - created_at
      properties:
        id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Node id.
        name:
          type: string
          description: Node name, unique in the cluster.
        roles:
          type: array
          description: Roles this node runs; they combine (D-0018).
          items:
            type: string
            enum:
              - node
              - witness
              - edge
        cp_status:
          description: |
            Control-plane status. `replica` is reserved for read serving by
            replica nodes, which is M6 (ADR 0179); until then every non-primary
            node is null, including the machines that follow the change log
            and could be promoted. After `quoro restore` onto another host, the
            restored primary moves `primary` to the node on its new host at its
            first start (backup-format.md section 8.2); `quoro cluster promote`
            moves it to the promoted node (node-agent-protocol.md section 7.3).
          oneOf:
            - type: string
              enum:
                - primary
                - replica
            - type: 'null'
        status:
          type: string
          description: Session lifecycle status of the node.
          enum:
            - pending
            - connected
            - disconnected
            - fenced
            - removed
        public_key:
          type: string
          description: Ed25519 public key of the node, base64.
        address:
          type: [string, 'null']
          description: Reachable address if the node is public, else null.
        behind_nat:
          type: boolean
          description: Whether the node dials out instead of accepting inbound sessions.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Operator labels used by placement.
        capacity:
          $ref: '#/components/schemas/NodeCapacity'
        allocated:
          $ref: '#/components/schemas/NodeCapacity'
        kvm:
          $ref: '#/components/schemas/KvmInfo'
        engine_version:
          type: [string, 'null']
          description: Version of the engine implementation on the node.
        agent_version:
          type: [string, 'null']
          description: Version of the node agent on the node.
        desired_rev:
          type: integer
          minimum: 0
          description: Revision of the desired state the control plane wants applied.
        applied_rev:
          type: integer
          minimum: 0
          description: Revision the node last reported as applied.
        log_seq:
          type: integer
          minimum: 0
          description: |
            Last change-log seq the node has verified. From M5b the newest
            acknowledgement the primary holds in memory (node-agent-protocol.md
            section 7.1).
        log_lag:
          type: [integer, 'null']
          minimum: 0
          description: |
            How many change-log entries the node is behind the primary: the
            primary's newest seq minus `log_seq`. Null for a machine that does
            not follow, one without the `node` role (node-agent-protocol.md
            section 7.1). Absent until the promotion and custody work ships.
        custody:
          description: |
            Whether the cluster keys are sealed to this machine, so it can be
            promoted (node-agent-protocol.md section 7.2): `sealed` when every
            key in use is, `pending` while a seal is missing, `none` before the
            machine reports a custody key, `key_changed` after the machine
            reported a different key, which the primary refused. Null for a
            machine without the `node` role. Absent until the promotion and
            custody work ships.
          oneOf:
            - type: string
              enum:
                - sealed
                - pending
                - none
                - key_changed
            - type: 'null'
        fence_failure:
          description: |
            Failed fences of this node that no operator has acknowledged yet, or
            null. While a lease is listed here the primary grants it to no node
            (D-0074); `POST /api/v1/nodes/{node_id}/fence-ack` clears it (D-0079).
          oneOf:
            - $ref: '#/components/schemas/NodeFenceFailure'
            - type: 'null'
        tunnel:
          description: |
            The node's Cloudflare Tunnel mapping, or null when the node is not
            mapped to a `tunnel` provider (D-0094, D-0095). Set with
            `PUT /api/v1/nodes/{node_id}/tunnel`. The run token is never returned.
          oneOf:
            - $ref: '#/components/schemas/NodeTunnel'
            - type: 'null'
        last_seen_at:
          type: [string, 'null']
          description: Last heartbeat or message from the node.
        lost_at:
          type: [string, 'null']
          format: date-time
          description: |
            When an operator declared this node lost (ADR 0183,
            `POST /api/v1/nodes/{node_id}/declare-lost`), or null. Its leases
            were revoked with new tokens at that time. Cleared once the node
            returns and has answered the revokes of those leases
            (node-agent-protocol.md sections 8.3 and 9).
        created_at:
          type: string
          format: date-time
          description: When the node first enrolled.
    NodeFenceFailure:
      type: object
      title: NodeFenceFailure
      description: |
        Unacknowledged failed fences of a node: a forced stop could not confirm
        that these VMs stopped, so they may still run (D-0074,
        node-agent-protocol.md section 8.5). Ids accumulate across failures
        until an operator acknowledges them.
      required:
        - detected_at
        - lease_ids
        - app_ids
        - vm_ids
      properties:
        detected_at:
          type: string
          format: date-time
          description: When the primary recorded the first of these failures.
        lease_ids:
          type: array
          description: Leases whose fence failed; none of them is granted again until acknowledged.
          items:
            type: string
            pattern: '^lse_[0-9A-HJKMNP-TV-Z]{26}$'
        app_ids:
          type: array
          description: Apps bound to those leases.
          items:
            type: string
            pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
        vm_ids:
          type: array
          description: VMs the node could not confirm stopped.
          items:
            type: string
            pattern: '^vm_[0-9A-HJKMNP-TV-Z]{26}$'
    NodeTunnel:
      type: object
      title: NodeTunnel
      description: |
        Which `tunnel` provider runs this node's tunnel (D-0094, D-0095). One
        tunnel per node. The primary creates or looks up the tunnel with the
        provider's account credential and sends the node only the tunnel id and
        its run token (node-agent-protocol.md section 5.11); the account
        credential never leaves the primary and the run token is never returned
        by the API.
      required:
        - provider_id
        - tunnel_id
        - origin_port
      properties:
        provider_id:
          type: string
          pattern: '^prv_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The `tunnel` provider whose account holds the tunnel.
        tunnel_id:
          type: [string, 'null']
          description: The provider's id of the tunnel, or null until the primary has created it.
        origin_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Loopback port on the node where its proxy accepts the tunnel's traffic.
    SetNodeTunnelRequest:
      type: object
      title: SetNodeTunnelRequest
      description: Map a node to the `tunnel` provider that runs its tunnel.
      required:
        - provider_id
      properties:
        provider_id:
          type: string
          pattern: '^prv_[0-9A-HJKMNP-TV-Z]{26}$'
          description: A provider of kind `tunnel`; any other kind is refused with `validation_failed`.
        origin_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8081
          description: Loopback port on the node where its proxy accepts the tunnel's traffic.
    NodeRolesRequest:
      type: object
      title: NodeRolesRequest
      description: |
        Add or remove the `witness` role of an enrolled machine (ADR 0170).
        Exactly one of `add` and `remove` is given. Only `witness` can change in
        M5b; `node` and `edge` are chosen at enrollment.
      properties:
        add:
          type: array
          minItems: 1
          uniqueItems: true
          description: Roles to add.
          items:
            type: string
            enum:
              - witness
        remove:
          type: array
          minItems: 1
          uniqueItems: true
          description: Roles to remove.
          items:
            type: string
            enum:
              - witness
        force:
          type: boolean
          default: false
          description: |
            Remove a vote even though fewer than three voters would remain while
            `expiring` leases exist.
    FenceAckRequest:
      type: object
      title: FenceAckRequest
      description: |
        The failed fences an operator verified out of band (for example by
        power-cycling the host). `lease_ids` must equal the node's outstanding
        `fence_failure.lease_ids`, so an acknowledgement never covers a failure
        the operator has not seen.
      required:
        - lease_ids
      properties:
        lease_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Lease ids of the failed fences being acknowledged.
          items:
            type: string
            pattern: '^lse_[0-9A-HJKMNP-TV-Z]{26}$'
    NodeList:
      type: object
      title: NodeList
      description: One page of nodes.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    NodeJoinToken:
      type: object
      title: NodeJoinToken
      description: |
        A one-time enrollment token (`njt_...`). The secret is shown once on
        creation; only its SHA-256 hash is stored, so the secret can never be read
        again. Like every other credential hash, the hash is not part of the API.
      required:
        - id
        - created_by
        - expires_at
      properties:
        id:
          type: string
          pattern: '^njt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Join token id.
        created_by:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: User who created the token.
        expires_at:
          type: string
          format: date-time
          description: Expiry of the token; default 1 hour after creation.
        used_at:
          type: [string, 'null']
          description: When the token was consumed, or null.
        node_id:
          type: [string, 'null']
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Node that consumed the token, or null.
    NodeJoinTokenRequest:
      type: object
      title: NodeJoinTokenRequest
      description: Create a one-time join token.
      properties:
        expires_at:
          type: string
          format: date-time
          description: Expiry of the token. Defaults to 1 hour after creation.
    NodeJoinTokenCreated:
      type: object
      title: NodeJoinTokenCreated
      description: |
        The new join token. `token` is shown once and cannot be retrieved again;
        `join_command` is the single line the operator runs on the new machine.
      required:
        - id
        - token
        - expires_at
        - join_command
      properties:
        id:
          type: string
          pattern: '^njt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Join token id.
        token:
          type: string
          readOnly: true
          description: The token secret. Shown only in this response.
        expires_at:
          type: string
          format: date-time
          description: Expiry of the token.
        join_command:
          type: string
          description: One-line command that enrolls the node and starts the node agent.
    EnrollNodeRequest:
      type: object
      title: EnrollNodeRequest
      description: |
        Node enrollment. The node proves possession of a join token and presents
        its Ed25519 public key; the reply contains a node credential (see
        `docs/contracts/node-agent-protocol.md`).
      required:
        - join_token
        - name
        - public_key
        - roles
      properties:
        join_token:
          type: string
          writeOnly: true
          description: The one-time join token secret.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Node name, unique in the cluster.
        public_key:
          type: string
          description: Ed25519 public key of the node, base64.
        roles:
          type: array
          description: Roles the node will run.
          items:
            type: string
            enum:
              - node
              - witness
              - edge
        capacity:
          $ref: '#/components/schemas/NodeCapacity'
        kvm:
          $ref: '#/components/schemas/KvmInfo'
    EnrollNodeResponse:
      type: object
      title: EnrollNodeResponse
      description: |
        Enrollment result. `credential` is the node session credential; it is
        shown once and authenticates the node-agent session.
      required:
        - node_id
        - cluster_id
        - primary_url
        - credential
        - cluster_public_key
      properties:
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Id of the enrolled node.
        cluster_id:
          type: string
          pattern: '^cls_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Id of the cluster the node joined.
        primary_url:
          type: string
          format: uri
          description: Base URL the node uses to dial the primary.
        credential:
          type: string
          readOnly: true
          description: Node session credential. Shown only in this response.
        cluster_public_key:
          type: string
          readOnly: true
          description: Base64 Ed25519 public key of the cluster. The node uses it to verify the signature on every `desired_state` (see `docs/contracts/node-agent-protocol.md`).
    Project:
      type: object
      title: Project
      description: A group of apps; also the unit a resource selector can name.
      required:
        - id
        - slug
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Project id.
        slug:
          type: string
          pattern: '^[a-z0-9-]{1,40}$'
          description: Unique slug used in selectors and the CLI.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name.
        created_at:
          type: string
          format: date-time
          description: When the project was created.
        updated_at:
          type: string
          format: date-time
          description: When the project was last changed.
    ProjectList:
      type: object
      title: ProjectList
      description: One page of projects.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    CreateProjectRequest:
      type: object
      title: CreateProjectRequest
      description: Create a project.
      required:
        - slug
        - name
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]{1,40}$'
          description: Unique slug.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name.
    UpdateProjectRequest:
      type: object
      title: UpdateProjectRequest
      description: Change a project. Absent fields stay unchanged.
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9-]{1,40}$'
          description: New unique slug.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: New display name.
    Vm:
      type: object
      title: Vm
      description: |
        One microVM managed by the engine (M1). A VM belongs to an app when
        `app_id` is set; a standalone VM has `app_id` null and belongs to its
        project. `desired_status` is what the control plane wants,
        `observed_status` what the node reports.
      required:
        - id
        - project_id
        - app_id
        - node_id
        - name
        - vcpus
        - memory_mb
        - disk_gb
        - image
        - desired_status
        - observed_status
        - restart_generation
        - restart_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^vm_[0-9A-HJKMNP-TV-Z]{26}$'
          description: VM id.
        project_id:
          type: string
          pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Project the VM belongs to.
        app_id:
          type: [string, 'null']
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: App whose instance this VM is, or null for a standalone VM.
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Node the VM is placed on.
        name:
          type: string
          description: VM name.
        vcpus:
          type: integer
          minimum: 1
          description: Number of virtual CPUs.
        memory_mb:
          type: integer
          minimum: 1
          description: Memory in mebibytes.
        disk_gb:
          type: integer
          minimum: 1
          description: Root disk in gibibytes.
        image:
          type: string
          description: OCI reference with digest, the rootfs the VM boots.
        desired_status:
          type: string
          description: Status the control plane wants.
          enum:
            - running
            - stopped
        observed_status:
          type: string
          description: |
            Status the node last reported; `unknown` while its node is not
            connected (node-agent-protocol.md section 5.3).
          enum:
            - creating
            - stopped
            - starting
            - running
            - stopping
            - crashed
            - deleted
            - unknown
        ip:
          type: [string, 'null']
          description: Private address of the VM on the node bridge.
        restart_generation:
          type: integer
          minimum: 0
          description: Counter bumped by a restart; the node restarts the VM when it changes.
        restart_count:
          type: integer
          minimum: 0
          description: Number of restarts the node has performed.
        last_exit_code:
          type: [integer, 'null']
          description: Exit code of the last VM process, or null.
        created_at:
          type: string
          format: date-time
          description: When the VM was created.
        updated_at:
          type: string
          format: date-time
          description: When the VM record last changed.
    VmList:
      type: object
      title: VmList
      description: One page of VMs.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vm'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    CreateVmRequest:
      type: object
      title: CreateVmRequest
      description: Create a standalone VM or an instance of an app.
      required:
        - project_id
        - node_id
        - name
        - vcpus
        - memory_mb
        - disk_gb
        - image
      properties:
        project_id:
          type: string
          pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Project the VM belongs to.
        app_id:
          type: [string, 'null']
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: App whose instance the VM is. Omit for a standalone VM.
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Node to place the VM on.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: VM name.
        vcpus:
          type: integer
          minimum: 1
          description: Number of virtual CPUs.
        memory_mb:
          type: integer
          minimum: 1
          description: Memory in mebibytes.
        disk_gb:
          type: integer
          minimum: 1
          description: Root disk in gibibytes.
        image:
          type: string
          description: OCI reference the VM boots.
    HealthCheck:
      type: object
      title: HealthCheck
      description: |
        Health check an app declares; the node probes it, reports events and,
        unless `restart` is false, restarts an instance that stays unhealthy
        (`node-agent-protocol.md` section 6.3, ADR 0184).
      required:
        - path
        - interval_s
        - timeout_s
        - failures
      properties:
        path:
          type: string
          default: /
          description: HTTP path probed on the app port.
        interval_s:
          type: integer
          minimum: 1
          default: 10
          description: Seconds between probes.
        timeout_s:
          type: integer
          minimum: 1
          default: 2
          description: Seconds a probe may take.
        failures:
          type: integer
          minimum: 1
          default: 3
          description: Consecutive failures before the app is declared down.
        start_period_s:
          type: integer
          minimum: 0
          default: 30
          description: |
            Seconds after an instance starts during which failed probes do not
            count toward `failures` (ADR 0184).
        restart:
          type: boolean
          default: true
          description: |
            Whether the node restarts an instance after `failures` consecutive
            failed probes outside the start period, with the crash backoff. A
            stateful instance restarts only while its node holds the app's
            lease. False keeps the report-only behaviour: `app.down` and no
            restart (ADR 0184).
    AppResources:
      type: object
      title: AppResources
      description: Resources of one app instance.
      required:
        - vcpus
        - memory_mb
        - disk_gb
      properties:
        vcpus:
          type: integer
          minimum: 1
          description: Number of virtual CPUs.
        memory_mb:
          type: integer
          minimum: 1
          description: Memory in mebibytes.
        disk_gb:
          type: integer
          minimum: 1
          description: Disk in gibibytes.
    AppPlacement:
      type: object
      title: AppPlacement
      description: Placement constraint of an app; an empty `node_ids` lets the scheduler pick.
      required:
        - node_ids
      properties:
        node_ids:
          type: array
          description: Nodes the app may run on; empty means any node.
          items:
            type: string
            pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
    App:
      type: object
      title: App
      description: |
        A deployable service. It runs as one microVM per instance (D-0008); in
        M1-M4 an app has one instance, and from M5a a stateless app runs
        `replicas` instances, one per node (ADR 0142). `ha_policy` exists from M0; M5a accepts
        `none` and `cold` (ADR 0020, ADR 0147), and M5b `warm` (ADR 0174). An app either deploys images
        given by reference (`source` null) or builds them from a Git source
        (ADR 0117). An app is stateful exactly when it has a volume (ADR 0145).
      required:
        - id
        - project_id
        - name
        - stateful
        - ha_policy
        - backup_schedule
        - replicas
        - image
        - port
        - health_check
        - resources
        - placement
        - status
        - restart_generation
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: App id.
        project_id:
          type: string
          pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Project the app belongs to.
        name:
          type: string
          pattern: '^[a-z0-9-]{1,40}$'
          description: Name, unique in the project.
        stateful:
          type: boolean
          description: |
            Whether the app has a volume. Derived: it turns true when a volume
            is created and false when the last one is deleted (ADR 0145). A
            stateful app runs only on its volume's node, which holds a `local`
            lease on it (ADR 0019).
        ha_policy:
          type: string
          description: |
            HA policy. M5a accepts `none` and `cold`; `cold` only for a stateful
            app while the cluster has a backup repository, and it runs the app's
            `backup_schedule` (ADR 0147). M5b accepts `warm` for a stateful app
            that a second node can hold a copy of (`warm`, ADR 0174). `hot`
            returns `validation_failed` until M6 (ADR 0020).
          enum:
            - none
            - cold
            - warm
            - hot
        backup_schedule:
          $ref: '#/components/schemas/BackupSchedule'
        replicas:
          type: integer
          minimum: 1
          maximum: 64
          description: |
            Instances of the app, at most one per node (ADR 0142). Only a
            stateless app may have more than one. Changing it is a state
            change, not a deployment: the scheduler adds or removes instances
            on eligible nodes.
        ha_cost:
          description: |
            What each HA policy costs this app, computed by the primary. Absent
            on a primary that does not compute it yet; null while it cannot be
            computed (no node holds the app's volume yet).
          oneOf:
            - $ref: '#/components/schemas/AppHaCost'
            - type: 'null'
        lease:
          description: |
            From M5b: the app's lease as the primary sees it (ADR 0019,
            node-agent-protocol.md section 8), on every read of the app. Absent
            when the app has no lease row, which a stateless app never has, and
            on a primary older than M5b.
          oneOf:
            - $ref: '#/components/schemas/Lease'
            - type: 'null'
        warm:
          description: |
            From M5b: the app's warm copy (ADR 0173, ADR 0174), on every read
            of the app. Null when `ha_policy` is not `warm`; absent on a primary
            older than M5b.
          oneOf:
            - $ref: '#/components/schemas/WarmCopy'
            - type: 'null'
        image:
          type: string
          description: |
            Current OCI reference of the app. For an app with a Git source it is
            the reference of its last successful build,
            `build.quoro.invalid/<app_id>:<build_id>`, or the empty string before
            the first one.
        source:
          description: |
            The Git source the app builds its images from, or null (or absent)
            for an app that deploys images given by reference (ADR 0117).
          oneOf:
            - $ref: '#/components/schemas/AppSource'
            - type: 'null'
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Container port the app listens on.
        health_check:
          $ref: '#/components/schemas/HealthCheck'
        resources:
          $ref: '#/components/schemas/AppResources'
        placement:
          $ref: '#/components/schemas/AppPlacement'
        status:
          type: string
          description: Aggregated status of the app and its instances.
          enum:
            - deploying
            - running
            - degraded
            - down
            - stopped
        current_deployment_id:
          type: [string, 'null']
          pattern: '^dep_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The deployment whose image the app runs, or null before the first one.
        restart_generation:
          type: integer
          minimum: 0
          description: Counter bumped by a restart or redeploy.
        created_at:
          type: string
          format: date-time
          description: When the app was created.
        updated_at:
          type: string
          format: date-time
          description: When the app record last changed.
    WarmCopy:
      type: object
      title: WarmCopy
      description: |
        The warm copy of a `warm` app: a second copy of its volume on another
        node, its warm node, which the node holding the app's lease (the
        source) updates every `interval_s` (ADR 0172, ADR 0173). The warm node
        also holds the app's prepared image and starts nothing until a
        failover or a switchover grants it the lease (ADR 0174). The progress
        fields are the primary's in-memory view of the two nodes' newest
        reports (node-agent-protocol.md sections 5.3 and 6.13), never stored,
        so they are null after a primary restart until the nodes report again.
      required:
        - node_id
        - node_pinned
        - interval_s
        - state
        - last_snapshot_seq
        - last_shipped_at
        - lag_s
        - extent_count
        - error
      properties:
        node_id:
          type: [string, 'null']
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            The warm node. The scheduler picks it unless an operator pinned it
            (`UpdateAppRequest.warm`). Eligible: a connected node with the
            `node` role, other than the node of the app's volume, that
            snapshots with `reflink` (ADR 0172) and that the source can reach
            over the mesh (two nodes both behind NAT cannot pair). A stateful
            app's placement names only its volume's node (ADR 0145), so it
            does not narrow the choice; pin a node to choose it (ADR 0275).
            After a failover it is the old source, which becomes the warm copy
            when it returns (ADR 0176). Null while no node is eligible;
            `state` is then `failed`. The scheduler keeps the warm node while
            it is disconnected and picks another only when it is removed,
            loses the node role, stops snapshotting with reflink or becomes
            the volume's node; an operator's pin lasts until the node is
            removed (ADR 0278).
        node_pinned:
          type: boolean
          description: Whether an operator chose `node_id` rather than the scheduler.
        interval_s:
          type: integer
          minimum: 5
          maximum: 3600
          description: |
            Seconds between two snapshots on the source; 30 unless changed
            (ADR 0173, measured in `docs/research/m5b-warm-and-leases.md`).
        state:
          type: string
          description: |
            `syncing` until the warm node holds a first complete copy (also
            during the full copy to a new warm node and the resync of a
            returning source); `in_sync` while `lag_s` is at most twice
            `interval_s`; `lagging` above that; `failed` while either node
            reports an error, is not connected, or no node is eligible
            (`error` says why). A switchover needs `in_sync` (ADR 0177).
          enum:
            - syncing
            - in_sync
            - lagging
            - failed
        last_snapshot_seq:
          type: [integer, 'null']
          minimum: 1
          description: |
            The newest complete copy on the warm node, the last shipped
            snapshot; null before the first one, and after a primary restart
            until the warm node reported again.
        last_shipped_at:
          type: [string, 'null']
          format: date-time
          description: When the warm node completed that copy.
        lag_s:
          type: [integer, 'null']
          minimum: 0
          description: |
            Seconds since the source took the snapshot of that copy, on the
            primary's clock: how much recent data a failover now would not
            have. Null when `last_snapshot_seq` is.
        extent_count:
          type: [integer, 'null']
          minimum: 0
          description: |
            Extents of the source's newest snapshot, as reported. A diff costs
            time in proportion to it, so a heavily fragmented volume ships
            more slowly.
        error:
          type: [string, 'null']
          maxLength: 500
          description: Why `state` is `failed`, or null.
    WarmSettings:
      type: object
      title: WarmSettings
      description: |
        Settings of an app's warm copy (ADR 0174). Accepted only when the
        app's `ha_policy` is `warm` or becomes `warm` in the same request
        (`validation_failed` otherwise). Absent fields stay unchanged.
      properties:
        node_id:
          type: [string, 'null']
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            Pins the warm node; null lets the scheduler pick. A node that is
            not eligible (`WarmCopy.node_id`) answers `validation_failed`. A
            new warm node receives a full copy, and the copy on the previous
            one is deleted.
        interval_s:
          type: integer
          minimum: 5
          maximum: 3600
          description: Seconds between two snapshots on the source.
    AppDetail:
      type: object
      title: AppDetail
      description: |
        An app together with its instances (its VMs) and its domains. A read of
        one app answers this shape.
      allOf:
        - $ref: '#/components/schemas/App'
        - type: object
          required:
            - instances
            - domains
          properties:
            instances:
              type: array
              description: VMs whose `app_id` is this app.
              items:
                $ref: '#/components/schemas/Vm'
            domains:
              type: array
              description: Hostnames routed to this app.
              items:
                $ref: '#/components/schemas/Domain'
            edge_backends:
              type: array
              description: |
                From M5a: the edge's view of this app's instances, one entry per
                instance the edge balances over (ADR 0143). Taken from the
                edge's newest `status_report`, which the primary keeps in
                memory and never stores, so the list is empty while no edge
                serves the app, after a primary restart until the edge reports
                again, and for an app with one replica. Absent from a primary
                older than M5a.
              items:
                $ref: '#/components/schemas/EdgeBackend'
    EdgeBackend:
      type: object
      title: EdgeBackend
      description: |
        One instance of an app as the edge that serves it sees it
        (`node-agent-protocol.md` section 5.3, edge backend entry). The
        edge's health decisions are its own: they change no replicated state.
      required:
        - edge_node_id
        - vm_id
        - node_id
        - in_rotation
        - since
      properties:
        edge_node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The machine with the `edge` role that reported it.
        vm_id:
          type: string
          pattern: '^vm_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The instance.
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Node that runs the instance.
        in_rotation:
          type: boolean
          description: Whether the edge sends it requests.
        since:
          type: string
          format: date-time
          description: When `in_rotation` last changed, or when the edge first saw the instance.
        reason:
          type: [string, 'null']
          description: |
            Why it is out of rotation: `health_check` (its probe failed
            `failures` times in a row) or `connect_failed` (a request could
            not connect or was reset); null while in rotation.
        last_error:
          type: [string, 'null']
          maxLength: 500
          description: One line from the last failed probe or connection; null when none.
    AppList:
      type: object
      title: AppList
      description: One page of apps.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/App'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    CreateAppRequest:
      type: object
      title: CreateAppRequest
      description: |
        Create an app. Exactly one of `image` and `source` is given; both or
        neither answer `validation_failed`. The first deployment (for `image`) or
        the first build (for `source`) is started separately.
      required:
        - project_id
        - name
        - port
      properties:
        project_id:
          type: string
          pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Project the app belongs to.
        name:
          type: string
          pattern: '^[a-z0-9-]{1,40}$'
          description: Name, unique in the project.
        image:
          type: string
          description: OCI reference of the app image. Required unless `source` is given.
        source:
          $ref: '#/components/schemas/AppSource'
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Container port the app listens on.
        stateful:
          type: boolean
          default: false
          description: |
            Kept for compatibility; only `false` is accepted. An app becomes
            stateful when a volume is created for it (ADR 0145); `true` here
            answers `validation_failed`.
        ha_policy:
          type: string
          default: none
          description: |
            HA policy. Only `none` at creation: `cold` and `warm` need a
            volume, which is created after the app (ADR 0145). Others answer
            `validation_failed`.
          enum:
            - none
            - cold
            - warm
            - hot
        backup_schedule:
          $ref: '#/components/schemas/BackupSchedule'
        replicas:
          type: integer
          minimum: 1
          maximum: 64
          default: 1
          description: |
            Instances of the app, one per node (ADR 0142). More than the
            eligible nodes (connected nodes with the `node` role, narrowed by
            `placement.node_ids`) answers `validation_failed`; more than 1
            with a `source`, or while no machine with the `edge` role is
            enrolled, answers `conflict` (409).
        health_check:
          $ref: '#/components/schemas/HealthCheck'
        resources:
          $ref: '#/components/schemas/AppResources'
        placement:
          $ref: '#/components/schemas/AppPlacement'
    UpdateAppRequest:
      type: object
      title: UpdateAppRequest
      description: |
        Change app settings. The image is not changed here: a new image is rolled
        out as a deployment, or built from the Git source. Absent fields stay
        unchanged. `source` replaces the whole Git source of an app that has one,
        and takes effect with the next build; it cannot be added to an app created
        from an image, nor removed, in M4 (`conflict`, 409).
      properties:
        name:
          type: string
          pattern: '^[a-z0-9-]{1,40}$'
          description: New name, unique in the project.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: New container port.
        source:
          $ref: '#/components/schemas/AppSource'
        ha_policy:
          type: string
          description: |
            HA policy. `none`, `cold` or `warm`; `cold` only for a stateful app
            while the cluster has a backup repository, otherwise `conflict`
            (409). `warm` only for an app with a volume whose node snapshots
            with `reflink` and while another node is eligible as its warm node
            (`WarmCopy.node_id`), and in M5b not for an app with a `source`,
            otherwise `validation_failed` (ADR 0172, ADR 0174, ADR 0265).
            `hot` answers `validation_failed` until M6 (ADR 0020).
          enum:
            - none
            - cold
            - warm
            - hot
        warm:
          $ref: '#/components/schemas/WarmSettings'
        backup_schedule:
          $ref: '#/components/schemas/BackupSchedule'
        replicas:
          type: integer
          minimum: 1
          maximum: 64
          description: |
            New instance count (ADR 0142). More than the eligible nodes answers
            `validation_failed`; more than 1 for a stateful app, for an app
            with a Git source (its built image exists only on the node that
            built it), or while no machine with the `edge` role is enrolled,
            answers `conflict` (409).
        health_check:
          $ref: '#/components/schemas/HealthCheck'
        resources:
          $ref: '#/components/schemas/AppResources'
        placement:
          $ref: '#/components/schemas/AppPlacement'
    AppEnvVar:
      type: object
      title: AppEnvVar
      description: |
        The readable part of an environment variable: its `name` and when it
        changed. Values are write-only and never returned (they are stored
        encrypted at rest with the cluster key).
      required:
        - app_id
        - name
        - updated_at
      properties:
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: App the variable belongs to.
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          description: Variable name.
        updated_at:
          type: string
          format: date-time
          description: When the value last changed.
    AppEnvVarInput:
      type: object
      title: AppEnvVarInput
      description: One variable in a full replacement of an app's environment.
      required:
        - name
        - value
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          description: Variable name.
        value:
          type: string
          writeOnly: true
          description: Variable value. It is stored encrypted and never returned.
    AppEnvList:
      type: object
      title: AppEnvList
      description: Names and change times of an app's environment variables.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppEnvVar'
    AppEnvReplaceRequest:
      type: object
      title: AppEnvReplaceRequest
      description: |
        Full replacement of an app's environment. Variables not listed are
        removed. Names must be unique in the list.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppEnvVarInput'
    Deployment:
      type: object
      title: Deployment
      description: |
        One rollout of an image to an app. `phase` is the current or failing phase.
        The `build` phase is reserved and never reported: a failed build is a
        failed `Build` with its own `build.failed` event and starts no deployment
        (ADR 0119). A successful build starts a deployment of the built image with
        `trigger: build`.
      required:
        - id
        - app_id
        - image
        - status
        - trigger
        - created_by_type
        - created_by_id
        - created_at
      properties:
        id:
          type: string
          pattern: '^dep_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Deployment id.
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: App the deployment rolls out.
        image:
          type: string
          description: Image reference as requested.
        image_digest:
          type: [string, 'null']
          description: Digest the reference resolved to, once known.
        status:
          type: string
          description: Deployment status.
          enum:
            - pending
            - preparing
            - starting
            - succeeded
            - failed
            - superseded
        phase:
          type: [string, 'null']
          description: Current or failing phase.
          enum:
            - pull
            - rootfs
            - boot
            - health
            - build
            - null
        error:
          type: [string, 'null']
          description: Failure message when `status` is `failed`.
        trigger:
          type: string
          description: What started the deployment.
          enum:
            - api
            - redeploy
            - rollback
            - build
        created_by_type:
          type: string
          description: Kind of identity that started the deployment.
          enum:
            - user
            - agent
            - system
        created_by_id:
          type: string
          description: Id of the identity that started the deployment.
        created_at:
          type: string
          format: date-time
          description: When the deployment started.
        finished_at:
          type: [string, 'null']
          description: When the deployment reached a terminal status.
    DeploymentList:
      type: object
      title: DeploymentList
      description: One page of deployments, newest first.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Deployment'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    CreateDeploymentRequest:
      type: object
      title: CreateDeploymentRequest
      description: Roll out a new image to an app.
      required:
        - image
      properties:
        image:
          type: string
          description: OCI reference to deploy.
    DeploymentLogEntry:
      type: object
      title: DeploymentLogEntry
      description: One progress line of a deployment.
      required:
        - time
        - phase
        - message
      properties:
        time:
          type: string
          format: date-time
          description: When the line was produced.
        phase:
          type: string
          description: Phase the line belongs to.
          enum:
            - pull
            - rootfs
            - boot
            - health
            - build
        message:
          type: string
          description: The progress line.
    DeploymentLogList:
      type: object
      title: DeploymentLogList
      description: Progress lines of a deployment in order.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentLogEntry'
    AppSource:
      type: object
      title: AppSource
      description: |
        The Git source an app builds its images from (ADR 0117). Only public
        `https://` repositories and the Dockerfile builder exist in M4; private
        repositories need a credential reference that a later contract change
        adds. Build arguments are not secrets: they end up in the image history.
        Build secrets are names of the app's environment variables; the node
        receives their values in the signed desired state and passes them to
        BuildKit as `--secret`, never as arguments, and never logs them.
      required:
        - kind
        - repo_url
        - ref
      properties:
        kind:
          type: string
          description: Kind of source. Only `git` in M4.
          enum:
            - git
        repo_url:
          type: string
          pattern: '^https://[^\s]+$'
          maxLength: 2000
          description: HTTPS URL of a public Git repository.
        ref:
          type: string
          minLength: 1
          maxLength: 255
          description: Branch, tag or full commit SHA to build. The node resolves it to a commit at the start of each build.
        dockerfile_path:
          type: string
          minLength: 1
          maxLength: 500
          default: Dockerfile
          description: Path of the Dockerfile, relative to `context_dir`; never absolute and never outside it.
        context_dir:
          type: string
          minLength: 1
          maxLength: 500
          default: .
          description: Build context, relative to the repository root; `.` is the root.
        target:
          type: [string, 'null']
          maxLength: 128
          description: Stage of a multi-stage Dockerfile to build, or null for the last stage.
        build_args:
          type: array
          maxItems: 100
          description: Build arguments, passed as `--build-arg`. Names are unique.
          items:
            $ref: '#/components/schemas/BuildArg'
        secrets:
          type: array
          maxItems: 50
          uniqueItems: true
          description: |
            Names of the app's environment variables to expose to the build as
            BuildKit secrets, with the variable name as the secret id
            (`RUN --mount=type=secret,id=<name>`). A name that is not an
            environment variable of the app fails the build in `preparing`.
          items:
            type: string
            pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    BuildArg:
      type: object
      title: BuildArg
      description: One `--build-arg` of a Git source. Not a secret.
      required:
        - name
        - value
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          description: Argument name.
        value:
          type: string
          maxLength: 4096
          description: Argument value. Stored and returned as sent; the audit log redacts it like every `value` key.
    BuildFailedStep:
      type: object
      title: BuildFailedStep
      description: |
        The BuildKit step that failed, read from BuildKit's machine-readable
        progress, with a few lines of its log and the Dockerfile excerpt. It is
        replicated with the build, so the panel shows it while the node is down
        (ADR 0119).
      required:
        - vertex
        - name
        - error
        - dockerfile_line
        - excerpt
      properties:
        vertex:
          type: integer
          minimum: 0
          description: BuildKit's step number (`#6` in the plain log).
        name:
          type: string
          description: The step's name, for example `[3/4] RUN npm ci`.
        error:
          type: string
          description: BuildKit's error for the step.
        dockerfile_line:
          type: [integer, 'null']
          minimum: 1
          description: Line of the Dockerfile the step comes from, when BuildKit names it.
        excerpt:
          type: array
          maxItems: 20
          description: The step's last log lines and the Dockerfile excerpt, at most 20 lines of at most 500 characters.
          items:
            type: string
    Build:
      type: object
      title: Build
      description: |
        One image build of an app's Git source, run on the node that runs the
        app in an ephemeral builder microVM (ADR 0117, ADR 0118). Only the
        status and the failing step are replicated; the log stays on that node
        and is read on demand (ADR 0014, ADR 0119). A build that succeeds starts
        a deployment of its image with `trigger: build`; `deployment_id` names
        it. The built image's reference is
        `build.quoro.invalid/<app_id>:<build_id>`, which no node ever pulls.
      required:
        - id
        - app_id
        - node_id
        - source
        - status
        - commit
        - image
        - image_digest
        - failed_phase
        - error
        - failed_step
        - deployment_id
        - trigger
        - refresh_base
        - created_by_type
        - created_by_id
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          pattern: '^bld_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Build id.
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: App the build belongs to.
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Node that runs the build and keeps its log.
        source:
          $ref: '#/components/schemas/AppSource'
        status:
          type: string
          description: |
            Build status. `queued` waits for the node; `preparing` boots the
            builder VM and checks out the source; `building` runs the build;
            `exporting` writes the OCI layout; `importing` turns it into a root
            disk. `succeeded`, `failed` and `cancelled` are terminal.
          enum:
            - queued
            - preparing
            - building
            - exporting
            - importing
            - succeeded
            - failed
            - cancelled
        commit:
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}$'
          description: Commit the ref resolved to, once the checkout finished.
        image:
          type: [string, 'null']
          description: The built image's reference, `build.quoro.invalid/<app_id>:<build_id>`, on success.
        image_digest:
          type: [string, 'null']
          description: Manifest digest of the built image, on success.
        failed_phase:
          type: [string, 'null']
          description: Phase the build failed in; null unless `status` is `failed`.
          enum:
            - preparing
            - building
            - exporting
            - importing
            - null
        error:
          type: [string, 'null']
          description: One-line failure reason when `status` is `failed`, for example the step error or `timeout`.
        failed_step:
          oneOf:
            - $ref: '#/components/schemas/BuildFailedStep'
            - type: 'null'
          description: The failing step, when the build failed in a build step.
        deployment_id:
          type: [string, 'null']
          pattern: '^dep_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The deployment the build started, on success.
        trigger:
          type: string
          description: What started the build. Only an explicit start (`api`) in M4.
          enum:
            - api
        refresh_base:
          type: boolean
          description: |
            Whether the build resolved every base image (`FROM`) again from its
            registry instead of reusing the builder's cached copy (ADR 0150).
        created_by_type:
          type: string
          description: Kind of identity that started the build.
          enum:
            - user
            - agent
            - system
        created_by_id:
          type: string
          description: Id of the identity that started the build.
        created_at:
          type: string
          format: date-time
          description: When the build was queued.
        started_at:
          type: [string, 'null']
          format: date-time
          description: When the node started it.
        finished_at:
          type: [string, 'null']
          format: date-time
          description: When it reached a terminal status.
    BuildList:
      type: object
      title: BuildList
      description: One page of builds, newest first.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Build'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    StartBuildRequest:
      type: object
      title: StartBuildRequest
      description: Start a build of the app's Git source. Every field is optional.
      properties:
        ref:
          type: string
          minLength: 1
          maxLength: 255
          description: Build this branch, tag or commit instead of the source's `ref`, for this build only.
        refresh_base:
          type: boolean
          default: false
          description: |
            Resolve every base image (`FROM`) again from its registry instead
            of reusing the builder's cached copy, so the build picks up a
            patched base: the "rebuild with refreshed base" action for a
            vulnerable app (ADR 0138, ADR 0150).
    BuildLogLine:
      type: object
      title: BuildLogLine
      description: One line of a build's log, as kept on the node that ran it (ADR 0119).
      required:
        - seq
        - time
        - stream
        - line
      properties:
        seq:
          type: integer
          minimum: 1
          description: Position in the build's log, gap-free from 1.
        time:
          type: string
          format: date-time
          description: When the node recorded the line.
        stream:
          $ref: '#/components/schemas/LogStreamName'
        vertex:
          type: [integer, 'null']
          minimum: 0
          description: BuildKit step the line belongs to, when it names one.
        line:
          type: string
          description: The line, without its trailing newline.
    BuildLogList:
      type: object
      title: BuildLogList
      description: One page of a build's log, oldest first.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BuildLogLine'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null when no more lines exist yet.
    Domain:
      type: object
      title: Domain
      description: |
        A hostname routed to one app. TLS is obtained with ACME for public-IP
        hosts or terminated by a Cloudflare Tunnel for hosts behind NAT (D-0024).
      required:
        - id
        - app_id
        - hostname
        - tls_mode
        - cert_status
        - serving_status
        - created_at
      properties:
        id:
          type: string
          pattern: '^dom_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Domain id.
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: App the hostname routes to.
        hostname:
          type: string
          format: hostname
          description: Hostname served for the app.
        tls_mode:
          type: string
          description: How TLS is provided.
          enum:
            - acme
            - tunnel
        cert_status:
          type: string
          description: Certificate state; `not_applicable` in tunnel mode.
          enum:
            - pending
            - issued
            - renewing
            - failed
            - not_applicable
        cert_expires_at:
          type: [string, 'null']
          description: Expiry of the current certificate, when one exists.
        serving_status:
          type: string
          description: |
            Whether a machine can serve the hostname, independently of the
            certificate (ADR 0167). `serving`: the hostname's route is in the
            desired state of a machine that can serve it (for `tunnel`, a
            machine whose tunnel carries the hostname). `unserved`: the app has
            an instance meant to run, but no machine can serve the hostname;
            `last_error` says why. For `tunnel` that is a one-replica app with
            no instance meant to run on a node with a tunnel, or an app with
            more replicas while the edge has no tunnel. `pending`: neither yet,
            because the domain was just added or the app has no instance meant
            to run. A change between `serving` and `unserved` emits
            `domain.served` or `domain.unserved`.
          enum:
            - serving
            - unserved
            - pending
        last_error:
          type: [string, 'null']
          description: Why the hostname is `unserved`; null in any other status.
        provider_id:
          type: [string, 'null']
          pattern: '^prv_[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            The provider whose credential manages the hostname's DNS records: a
            `dns` provider for `acme` (the primary writes the DNS-01 TXT records
            with it) or a `tunnel` provider for `tunnel` (the primary writes the
            tunnel ingress rule and the proxied CNAME with it) (D-0094, D-0095).
            Null only for domains created before the field existed.
        created_at:
          type: string
          format: date-time
          description: When the domain was added.
    DomainList:
      type: object
      title: DomainList
      description: One page of domains.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    CreateDomainRequest:
      type: object
      title: CreateDomainRequest
      description: Route a hostname to an app.
      required:
        - hostname
        - tls_mode
      properties:
        hostname:
          type: string
          format: hostname
          description: Hostname to serve for the app.
        tls_mode:
          type: string
          description: How TLS is provided (D-0024).
          enum:
            - acme
            - tunnel
        provider_id:
          type: string
          pattern: '^prv_[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            The provider that manages the hostname's DNS records: kind `dns` for
            `acme`, kind `tunnel` for `tunnel`. Optional when exactly one provider
            of that kind exists, which is then used; with none or several, or a
            provider of the wrong kind, the request fails with `validation_failed`.
    Volume:
      type: object
      title: Volume
      description: |
        Local persistent disk of a stateful app: a sparse file on one node's
        data disk, attached to the app's microVM as a virtio-blk device and
        mounted by the guest init at `mount_path` (ADR 0145). Its data lives
        on that node and in its backups; from M5b the volume of a `warm` app
        also has a copy on the warm node (`App.warm`, ADR 0173), and a node
        that lost the app's lease may keep its divergent writes as
        quarantined copies (ADR 0176). In M5a an app has at most one volume
        in `creating`, `ready` or `restoring`.
      required:
        - id
        - app_id
        - node_id
        - size_gb
        - mount_path
        - state
        - quarantines
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^vol_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Volume id.
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            App that owns the volume. After deleteApp it names the deleted app
            until the node removes the file and the record is dropped (ADR 0165).
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            Node holding the data. For a `warm` app, the node that holds the
            app's lease (the source); a failover or a switchover changes it.
        size_gb:
          type: integer
          minimum: 1
          maximum: 1024
          description: Size in gibibytes.
        mount_path:
          type: string
          description: Absolute mount path inside the app.
        state:
          type: string
          description: |
            `creating` until the node reports the file; `ready` when it can be
            attached and backed up; `restoring` while a restore writes it;
            `failed` with `error` when creation or a restore failed;
            `detached` once a restore was accepted to replace it: its file stays
            untouched on its node and it is never attached again; `deleting`
            after deleteVolume, or after deleteApp for every volume of the app,
            until the node removes the file; the record is then dropped
            (ADR 0165).
          enum:
            - creating
            - ready
            - restoring
            - failed
            - detached
            - deleting
        allocated_bytes:
          type: [integer, 'null']
          minimum: 0
          description: Bytes the sparse file uses on the node's disk, as last reported; null before the first report.
        restored_from_backup_id:
          type: [string, 'null']
          pattern: '^bkp_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The backup this volume was restored from, or null for a volume created empty.
        error:
          type: [string, 'null']
          maxLength: 2000
          description: One-line reason, in `failed`.
        quarantines:
          type: array
          description: |
            From M5b: the quarantined copies of this volume, oldest first;
            empty when there is none. Nothing deletes one automatically
            (ADR 0176).
          items:
            $ref: '#/components/schemas/VolumeQuarantine'
        created_at:
          type: string
          format: date-time
          description: When the volume was created.
        updated_at:
          type: string
          format: date-time
          description: When the volume record last changed.
    VolumeQuarantine:
      type: object
      title: VolumeQuarantine
      description: |
        A quarantined copy of a volume: the live file of a node that ran the
        app and lost its lease to a failover, kept as a reflink clone on that
        node's disk because it may hold writes the new source does not have
        (ADR 0176, node-agent-protocol.md section 9). Quoro offers no
        operation to read or restore it in M5b; someone with root on the node
        can copy it out. Only `deleteVolumeQuarantine` removes it.
      required:
        - id
        - node_id
        - size_bytes
        - sha256
        - state
        - created_at
      properties:
        id:
          type: string
          pattern: '^qrn_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Quarantined copy id.
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The node whose disk holds the copy.
        size_bytes:
          type: integer
          minimum: 0
          description: Bytes the copy uses on that node's disk.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the copy's content, as the node computed it.
        state:
          type: string
          description: |
            `kept`, or `deleting` after `deleteVolumeQuarantine` until the
            node no longer reports the copy; the record is then dropped.
          enum:
            - kept
            - deleting
        created_at:
          type: string
          format: date-time
          description: When the node took the copy.
    BackupSchedule:
      type: object
      title: BackupSchedule
      description: |
        When scheduled backups run and how many are kept (ADR 0147). On an app
        it applies while `ha_policy` is `cold`; for the control-plane database it
        is set on the backup repository (ADR 0148).
      required:
        - interval_h
        - keep
      properties:
        interval_h:
          type: integer
          minimum: 1
          maximum: 168
          description: |
            Hours between two scheduled backups, counted from the last succeeded
            one. The default is 24 for an app and 6 for the control-plane
            database.
        keep:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            Succeeded backups kept per source; the oldest beyond this count is
            pruned (`backup-format.md` section 7). The default is 7.
    HaCapacity:
      type: object
      title: HaCapacity
      description: Capacity an HA policy reserves on other nodes for this app.
      required:
        - vcpus
        - memory_mb
        - disk_gb
      properties:
        vcpus:
          type: integer
          minimum: 0
          description: Virtual CPUs kept for the app on other nodes.
        memory_mb:
          type: integer
          minimum: 0
          description: Memory in mebibytes kept for the app on other nodes.
        disk_gb:
          type: integer
          minimum: 0
          description: Disk in gibibytes kept for the app on other nodes.
    HaPolicyCost:
      type: object
      title: HaPolicyCost
      description: |
        What one HA policy costs this app (ADR 0020). The primary computes it
        from data it already holds: the app's resources and volume, the
        snapshot method of the volume's node (ADR 0146), the manifests of the
        app's backups (ADR 0147) and, from M5b, the warm node's reports. These
        are estimates, not reservations. For `warm`, `reserved` is disk only:
        the volume's size plus the app's root disk on the warm node; memory
        and vCPUs are needed there only after a failover (ADR 0174), which the
        N+1 indicator checks (`getClusterCapacity`).
      required:
        - policy
        - available
        - reserved
        - storage_bytes
        - restore_estimate_s
        - pause_estimate_ms
      properties:
        policy:
          type: string
          description: The HA policy this entry prices.
          enum:
            - none
            - cold
            - warm
            - hot
        available:
          type: boolean
          description: Whether the app may switch to this policy now.
        unavailable_reason:
          description: |
            Why `available` is false, or null: `stateless` (`cold` and `warm`
            need a volume), `no_repository` (`cold` needs a backup repository),
            `no_warm_node` (`warm` needs a volume node that snapshots with
            `reflink` and another eligible node, `WarmCopy.node_id`) or
            `not_in_this_release` (`hot` before M6; `warm` on a primary older
            than M5b). In M5b `warm` is also `not_in_this_release` for an app
            with a `source`: its built image exists only on the node that
            built it, so a warm node could not start it after a failover
            (ADR 0265).
          oneOf:
            - type: string
              enum:
                - stateless
                - no_repository
                - no_warm_node
                - not_in_this_release
            - type: 'null'
        reserved:
          $ref: '#/components/schemas/HaCapacity'
        storage_bytes:
          type: [integer, 'null']
          minimum: 0
          description: |
            Bytes this policy keeps outside the app's node. For `cold`, in
            object storage: the stored size of the app's kept backups, from
            their manifests; before the first backup, the volume's allocated
            bytes as an estimate. For `warm`, on the warm node's disk: the
            allocated bytes of its copy as last reported, or the volume's
            allocated bytes as an estimate before that. 0 for `none`; null
            when not computed (`hot`).
        restore_estimate_s:
          type: [integer, 'null']
          minimum: 0
          description: |
            For `cold`, seconds to restore the latest backup: its stored bytes
            divided by the download rate the primary measured on earlier
            restores, or the configured default rate before the first one. For
            `warm`, seconds to start the warm copy: the time the app's last
            start took, from the primary's request to the node reporting the
            VM running, or 10 before the primary observed one (ADR 0174). Null
            for every other policy.
        pause_estimate_ms:
          type: [integer, 'null']
          minimum: 0
          description: |
            For `cold`, how long each backup pauses the app: 0 when the volume's
            node snapshots with `reflink`; on `pause_copy`, the pause the last
            backup measured, or the volume's allocated bytes divided by the
            node's measured copy rate before the first one (ADR 0146). For
            `warm`, 0: a warm volume is only snapshotted with `reflink`
            (ADR 0172). Null for every other policy.
    AppHaCost:
      type: object
      title: AppHaCost
      description: |
        The cost of each HA policy for one app, so the panel can show what a
        policy switch changes (ADR 0020). Present from the storage epic of M5a.
      required:
        - snapshot_method
        - policies
        - computed_at
      properties:
        snapshot_method:
          description: |
            How the node that holds the app's volume snapshots it (ADR 0146), or
            null for a stateless app.
          oneOf:
            - type: string
              enum:
                - reflink
                - pause_copy
            - type: 'null'
        policies:
          type: array
          description: One entry per policy, in the order `none`, `cold`, `warm`, `hot`.
          items:
            $ref: '#/components/schemas/HaPolicyCost'
        computed_at:
          type: string
          format: date-time
          description: When the primary computed these values.
    VulnerabilitySeverity:
      type: string
      title: VulnerabilitySeverity
      description: |
        Severity from the record's CVSS base score: `critical` 9.0 or more,
        `high` 7.0 or more, `medium` 4.0 or more, `low` above 0, `unknown`
        when the record carries no score.
      enum:
        - critical
        - high
        - medium
        - low
        - unknown
    VulnerabilityFinding:
      type: object
      title: VulnerabilityFinding
      description: |
        One vulnerability in one package of one subject: the image an app runs,
        a component of the running Quoro release, or a node's host kernel
        (ADR 0138, ADR 0150). Matched by the primary against its local copy of
        OSV data; no image and no package list leaves the cluster.
      required:
        - id
        - subject_kind
        - vuln_id
        - aliases
        - ecosystem
        - package
        - installed_version
        - fixed_version
        - severity
        - cvss_score
        - kev
        - epss
        - first_seen_at
        - resolved_at
        - resolved_reason
      properties:
        id:
          type: string
          pattern: '^vln_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Finding id.
        subject_kind:
          type: string
          description: What the finding is about.
          enum:
            - app
            - quoro
            - host_kernel
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The app, when `subject_kind` is `app`.
        image_digest:
          type: string
          description: Digest of the app's image the package was found in, when `subject_kind` is `app`.
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The node, when `subject_kind` is `host_kernel`.
        component:
          type: string
          description: |
            The Quoro component, when `subject_kind` is `quoro`: a crate name,
            or one of `guest-kernel`, `cloud-hypervisor`, `cloudflared`,
            `buildkit`.
        vuln_id:
          type: string
          minLength: 1
          maxLength: 200
          description: The OSV id, for example a CVE, DSA or GHSA id.
        aliases:
          type: array
          items:
            type: string
          description: Other ids of the same vulnerability.
        summary:
          type: string
          description: One-line summary from the record, when it has one.
        ecosystem:
          type: string
          description: OSV ecosystem with its release, for example `Debian:13`, `Alpine:v3.22`, `npm`, `Linux`.
        package:
          type: string
          description: The installed package's name.
        source_package:
          type: string
          description: |
            The source package the record names, when it differs from
            `package` (Debian and Alpine records are keyed by source package).
        installed_version:
          type: string
          description: Version installed.
        fixed_version:
          type: [string, 'null']
          description: |
            The lowest version that fixes it, when the record names one. For
            an app built from Git, rebuilding with `refresh_base` picks it up
            once the base image ships it; an image app needs a new upstream
            image.
        severity:
          $ref: '#/components/schemas/VulnerabilitySeverity'
        cvss_score:
          type: [number, 'null']
          minimum: 0
          maximum: 10
          description: CVSS base score, when the record carries a vector.
        cvss_vector:
          type: string
          description: The CVSS vector the score comes from.
        kev:
          type: boolean
          description: Whether the vulnerability is in CISA's Known Exploited Vulnerabilities catalog.
        epss:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: EPSS probability of exploitation, when the primary holds EPSS data.
        upstream_version_only:
          type: boolean
          description: |
            True for a host kernel matched by its upstream version: a
            distribution kernel may carry the fix as a backport, so the finding
            can be a false positive.
        first_seen_at:
          type: string
          format: date-time
          description: When the finding was first recorded.
        resolved_at:
          type: [string, 'null']
          format: date-time
          description: When it stopped applying; null while open.
        resolved_reason:
          type: [string, 'null']
          description: Why it stopped applying; null while open.
          enum:
            - image_changed
            - data_changed
            - app_deleted
            - node_removed
            - upgraded
            - null
    VulnerabilityCounts:
      type: object
      title: VulnerabilityCounts
      description: Open findings by severity, and how many of them are in the KEV catalog.
      required:
        - critical
        - high
        - medium
        - low
        - unknown
        - kev
      properties:
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        medium:
          type: integer
          minimum: 0
        low:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
        kev:
          type: integer
          minimum: 0
    VulnerabilityDataSource:
      type: object
      title: VulnerabilityDataSource
      description: The age of the primary's copy of one OSV ecosystem.
      required:
        - ecosystem
        - source
        - data_modified_at
        - refreshed_at
        - last_error
      properties:
        ecosystem:
          type: string
          description: OSV ecosystem name.
        source:
          type: string
          description: '`download` when fetched from OSV, `import` when imported offline with `quoro vuln import`.'
          enum:
            - download
            - import
        data_modified_at:
          type: [string, 'null']
          format: date-time
          description: Newest record modification in the data held; the data's age.
        refreshed_at:
          type: [string, 'null']
          format: date-time
          description: When the primary last brought this ecosystem up to date.
        last_error:
          type: [string, 'null']
          description: The last refresh error, cleared by a successful refresh.
    ImageInventoryStatus:
      type: object
      title: ImageInventoryStatus
      description: |
        What is known about the packages of an app's current image. A finding
        list is meaningful only with `status: inventoried` and the data
        sources it needs present; otherwise the panel says so and never shows
        "no vulnerabilities".
      required:
        - status
      properties:
        status:
          type: string
          description: |
            `inventoried`: the node sent the image's package inventory and it
            was matched. `pending`: the image is running but no inventory
            arrived yet. `not_inventoried`: the node found no package database
            or manifest it can read in the image. `no_image`: the app runs no
            image yet. `pending_data`: the inventory arrived, but an
            ecosystem it needs is not in the primary's data yet.
          enum:
            - inventoried
            - pending
            - not_inventoried
            - no_image
            - pending_data
        image_digest:
          type: string
          description: The digest the status is about.
        os:
          type: string
          description: Distribution and release from the image's os-release, for example `debian 13`.
        package_count:
          type: integer
          minimum: 0
          description: Packages in the inventory.
        ecosystems:
          type: array
          items:
            type: string
          description: OSV ecosystems the inventory covers.
        not_inventoried:
          type: array
          items:
            type: string
          description: |
            Kinds of content the node saw and could not inventory, for example
            a static binary without build information.
        inventoried_at:
          type: string
          format: date-time
          description: When the node built the inventory.
    AppVulnerabilities:
      type: object
      title: AppVulnerabilities
      description: The vulnerability report of one app (ADR 0150).
      required:
        - app_id
        - inventory
        - counts
        - data
        - items
        - next_cursor
      properties:
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The app.
        inventory:
          $ref: '#/components/schemas/ImageInventoryStatus'
        counts:
          $ref: '#/components/schemas/VulnerabilityCounts'
        data:
          type: array
          items:
            $ref: '#/components/schemas/VulnerabilityDataSource'
          description: The data sources the report used, with their age.
        items:
          type: array
          items:
            $ref: '#/components/schemas/VulnerabilityFinding'
          description: |
            Findings, open ones first, then by severity (KEV first within a
            severity) and `vuln_id`.
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null.
    AppVulnerabilitySummary:
      type: object
      title: AppVulnerabilitySummary
      description: One app's line in the cluster summary.
      required:
        - app_id
        - project_id
        - name
        - inventory_status
        - counts
      properties:
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The app.
        project_id:
          type: string
          pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Its project.
        name:
          type: string
          description: The app's name.
        inventory_status:
          type: string
          description: '`ImageInventoryStatus.status` of the app''s current image.'
          enum:
            - inventoried
            - pending
            - not_inventoried
            - no_image
            - pending_data
        counts:
          $ref: '#/components/schemas/VulnerabilityCounts'
    NodeKernelVulnerabilities:
      type: object
      title: NodeKernelVulnerabilities
      description: |
        Open findings of one node's host kernel, matched by upstream version.
        Quoro reports host kernels and never upgrades them (ADR 0138).
      required:
        - node_id
        - kernel
        - counts
        - items
      properties:
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The node.
        kernel:
          type: string
          description: The kernel release the node reported.
        counts:
          $ref: '#/components/schemas/VulnerabilityCounts'
        items:
          type: array
          items:
            $ref: '#/components/schemas/VulnerabilityFinding'
          description: Open findings, most severe first.
    QuoroVulnerabilities:
      type: object
      title: QuoroVulnerabilities
      description: |
        Open findings of the running Quoro release's own components, from the
        SBOM embedded in the release (packaging/README.md).
      required:
        - version
        - counts
        - items
      properties:
        version:
          type: string
          description: The running Quoro version.
        counts:
          $ref: '#/components/schemas/VulnerabilityCounts'
        items:
          type: array
          items:
            $ref: '#/components/schemas/VulnerabilityFinding'
          description: Open findings, most severe first.
    VulnerabilitySummary:
      type: object
      title: VulnerabilitySummary
      description: |
        The cluster's vulnerability summary (ADR 0150). `apps` holds the apps
        the caller can read. `quoro` and `host_kernels` are node data: they are
        present only when the caller also holds `node:read`, with no selector
        narrower than the whole cluster.
      required:
        - data
        - apps
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VulnerabilityDataSource'
          description: Every data source the primary holds, with its age.
        apps:
          type: array
          items:
            $ref: '#/components/schemas/AppVulnerabilitySummary'
          description: One line per app, apps with critical or KEV findings first.
        quoro:
          $ref: '#/components/schemas/QuoroVulnerabilities'
        host_kernels:
          type: array
          items:
            $ref: '#/components/schemas/NodeKernelVulnerabilities'
          description: One entry per node with the `node` role.
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page of `apps`, or null.
    VolumeList:
      type: object
      title: VolumeList
      description: The volumes of one app, newest first.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Volume'
    CreateVolumeRequest:
      type: object
      title: CreateVolumeRequest
      description: Create a local volume for an app (ADR 0145).
      required:
        - size_gb
        - mount_path
      properties:
        size_gb:
          type: integer
          minimum: 1
          maximum: 1024
          description: Size in gibibytes. The file is sparse; the size counts against the node's disk.
        mount_path:
          type: string
          minLength: 2
          maxLength: 255
          pattern: '^/[A-Za-z0-9._/-]+$'
          description: |
            Absolute path inside the app's root filesystem where the guest init
            mounts the volume. It has no `.` or `..` segment, no empty segment and
            no trailing `/`, and is not `/` nor under `/proc`, `/sys` or `/dev`.
    Backup:
      type: object
      title: Backup
      description: |
        One point-in-time copy of a volume, or of the control-plane database, in
        a backup repository (ADR 0147, ADR 0148). The data never passes through
        this record: a volume is read and uploaded by the node that holds it,
        the control-plane database by the primary (`backup-format.md`).
      required:
        - id
        - repository_id
        - source_kind
        - status
        - trigger
        - created_at
      properties:
        id:
          type: string
          pattern: '^bkp_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Backup id.
        repository_id:
          type: string
          pattern: '^brp_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The backup repository it is stored in.
        source_kind:
          type: string
          description: |
            What was backed up: one app volume, or the control-plane database
            (`VACUUM INTO`, ADR 0148).
          enum:
            - volume
            - control_plane
        app_id:
          type: [string, 'null']
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The app whose volume was backed up; null for `control_plane`.
        volume_id:
          type: [string, 'null']
          pattern: '^vol_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The backed-up volume; null for `control_plane`.
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The node that took it, the volume's node or the primary.
        status:
          type: string
          description: |
            `queued` waits for its node; `running` snapshots and uploads;
            `succeeded` once its seal is written; `failed` with `error`.
          enum:
            - queued
            - running
            - succeeded
            - failed
        trigger:
          type: string
          description: |
            `schedule` (the `cold` policy or the control-plane schedule), `api`
            (`createBackup`) or `upgrade` (the control-plane backup taken before
            an upgrade, ADR 0148).
          enum:
            - schedule
            - api
            - upgrade
        snapshot_method:
          description: How the volume was snapshotted (ADR 0146); null for `control_plane` and before `running`.
          oneOf:
            - type: string
              enum:
                - reflink
                - pause_copy
            - type: 'null'
        pause_ms:
          type: [integer, 'null']
          minimum: 0
          description: How long the app was paused for a `pause_copy` snapshot; 0 for `reflink`; null otherwise.
        logical_bytes:
          type: [integer, 'null']
          minimum: 0
          description: Size of the snapshot that was chunked, on success.
        uploaded_bytes:
          type: [integer, 'null']
          minimum: 0
          description: Bytes of new chunk objects this backup uploaded, on success; chunks the repository already held cost nothing.
        chunk_count:
          type: [integer, 'null']
          minimum: 0
          description: Chunks its manifest lists, on success.
        error:
          type: [string, 'null']
          maxLength: 2000
          description: One-line reason, on `failed`.
        created_at:
          type: string
          format: date-time
          description: When the backup was requested or scheduled.
        started_at:
          type: [string, 'null']
          format: date-time
          description: When it left `queued`.
        finished_at:
          type: [string, 'null']
          format: date-time
          description: When it reached a terminal status.
        pruned_at:
          type: [string, 'null']
          format: date-time
          description: |
            When retention removed its seal and manifest from the repository.
            The record stays; a pruned backup cannot be restored.
    BackupList:
      type: object
      title: BackupList
      description: One page of backups, newest first.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Backup'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    FailoverAppRequest:
      type: object
      title: FailoverAppRequest
      description: The node to start the warm copy on.
      required:
        - node_id
      properties:
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The app's warm node, `App.warm.node_id`.
    SwitchoverAppRequest:
      type: object
      title: SwitchoverAppRequest
      description: The node to move the app to.
      required:
        - node_id
      properties:
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The app's warm node, `App.warm.node_id`.
    ClusterCapacity:
      type: object
      title: ClusterCapacity
      description: |
        The N+1 indicator: whether the apps of one node would fit on the
        others if that node were lost, or which resources are missing
        (ADR 0021, ADR 0178). The primary simulates the loss with the
        allocation it holds now; nothing is reserved.
      required:
        - lost_node_id
        - fits
        - missing
        - apps
        - computed_at
      properties:
        lost_node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The node whose loss was simulated.
        fits:
          type: boolean
          description: |
            Whether every listed app that needs a node got one, that is no app
            has `reason` `no_capacity`. An app that cannot move for another
            reason (`no_backup`, `no_warm_copy`) is listed with that reason and
            does not make `fits` false: more capacity would not help it.
        missing:
          $ref: '#/components/schemas/CapacityShortfall'
        apps:
          type: array
          description: |
            One entry per app with an instance meant to run on the lost node,
            or whose volume is there; in placement order.
          items:
            $ref: '#/components/schemas/ClusterCapacityApp'
        computed_at:
          type: string
          format: date-time
          description: When the primary computed the answer.
    CapacityShortfall:
      type: object
      title: CapacityShortfall
      description: |
        The resources of the apps left without a node for lack of capacity,
        summed; all zero when `fits` is true.
      required:
        - cpus
        - memory_mb
        - disk_gb
      properties:
        cpus:
          type: integer
          minimum: 0
          description: vCPUs.
        memory_mb:
          type: integer
          minimum: 0
          description: Memory in mebibytes.
        disk_gb:
          type: integer
          minimum: 0
          description: Disk in gibibytes.
    ClusterCapacityApp:
      type: object
      title: ClusterCapacityApp
      description: What one app of the lost node would need.
      required:
        - app_id
        - policy
        - action
        - node_id
        - reason
      properties:
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The app.
        policy:
          type: string
          description: The app's `ha_policy`.
          enum:
            - none
            - cold
            - warm
            - hot
        action:
          type: string
          description: |
            `keep`: a stateless app that still has an instance on another
            node; it only loses one replica. `start`: a stateless app whose
            only instance was on the lost node; it needs a new one on
            `node_id`. `failover`: a `warm` app whose source is the lost node;
            its warm copy starts on its warm node, which already holds the
            disk, so it needs memory and vCPUs there. `restore`: a stateful
            `none` or `cold` app; its latest backup is restored on `node_id`.
          enum:
            - keep
            - start
            - failover
            - restore
        node_id:
          type: [string, 'null']
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            Where the app would go; the node it keeps running on for `keep`.
            Null when it gets no node.
        reason:
          description: |
            Why `node_id` is null: `no_capacity` (no remaining node has room),
            `no_backup` (a stateful app with no succeeded backup: its data is
            only on the lost node) or `no_warm_copy` (the warm node holds no
            complete copy). Null otherwise.
          oneOf:
            - type: string
              enum:
                - no_capacity
                - no_backup
                - no_warm_copy
            - type: 'null'
    RestoreBackupRequest:
      type: object
      title: RestoreBackupRequest
      description: Where to restore a volume backup.
      required:
        - node_id
      properties:
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            Connected node with the `node` role that gets the new volume and
            then runs the app. It may be the volume's current node.
    BackupRepository:
      type: object
      title: BackupRepository
      description: |
        An encrypted, content-addressed store of backups in the bucket of an
        `object_store` provider (ADR 0147, `backup-format.md`). Its repository
        key is stored wrapped under the cluster data-encryption key and, in the
        bucket, under the owner's recovery key; neither key is ever returned.
        One repository per cluster in M5a.
      required:
        - id
        - name
        - provider_id
        - prefix
        - recovery_key_fingerprint
        - control_plane_schedule
        - created_by
        - created_at
      properties:
        id:
          type: string
          pattern: '^brp_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Backup repository id.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Label of the repository.
        provider_id:
          type: string
          pattern: '^prv_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The `object_store` provider whose bucket holds it.
        prefix:
          type: string
          description: Key prefix of the repository inside the bucket.
        recovery_key_fingerprint:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: |
            Identifies the current recovery key without revealing it
            (`backup-format.md` section 3), so an owner can check which key
            they hold.
        recovery_key_rotated_at:
          type: [string, 'null']
          format: date-time
          description: When the recovery key was last replaced, or null if never.
        control_plane_schedule:
          $ref: '#/components/schemas/BackupSchedule'
        created_by:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Owner who created the repository.
        created_at:
          type: string
          format: date-time
          description: When the repository was created.
    BackupRepositoryList:
      type: object
      title: BackupRepositoryList
      description: The backup repositories of the cluster.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackupRepository'
    BackupRepositoryWithRecoveryKey:
      type: object
      title: BackupRepositoryWithRecoveryKey
      description: |
        A backup repository together with its new recovery key, the only time
        the key is shown (ADR 0147). Quoro keeps no plaintext copy; an owner who
        loses it and the primary loses every backup.
      allOf:
        - $ref: '#/components/schemas/BackupRepository'
        - type: object
          required:
            - recovery_key
          properties:
            recovery_key:
              type: string
              pattern: '^qrk1(-[0-9A-HJKMNP-TV-Z]{4}){13}$'
              description: The recovery key (`backup-format.md` section 3). Shown only in this response.
    CreateBackupRepositoryRequest:
      type: object
      title: CreateBackupRepositoryRequest
      description: Create the cluster's backup repository in a provider's bucket.
      required:
        - name
        - provider_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Label of the repository.
        provider_id:
          type: string
          pattern: '^prv_[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            An `object_store` provider whose `config` names the bucket. It must
            not be the provider of an audit export: backup and audit credentials
            are separate entries (ADR 0147).
        prefix:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
          default: quoro-backups
          description: Key prefix inside the bucket. It must not hold a repository already.
        control_plane_schedule:
          $ref: '#/components/schemas/BackupSchedule'
    UpdateBackupRepositoryRequest:
      type: object
      title: UpdateBackupRepositoryRequest
      description: Change a backup repository's settings; absent fields stay unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: New label.
        control_plane_schedule:
          $ref: '#/components/schemas/BackupSchedule'
    LockStrength:
      type: string
      title: LockStrength
      description: |
        What the bucket of an audit export does against an overwrite or delete
        of an exported object, as the probe observed it (ADR 0149,
        audit-log-format.md section 8.2). `compliance`: S3 Object Lock in
        compliance mode (AWS S3, Backblaze B2); the locked version survives
        every overwrite and delete. `bucket_rule`: a Cloudflare R2 bucket lock
        rule refuses the overwrite and the delete, and anyone who may edit the
        bucket's settings can remove the rule. `none`: no lock, or the probe
        failed.
      enum:
        - none
        - bucket_rule
        - compliance
    AuditExport:
      type: object
      title: AuditExport
      description: |
        The off-site copy target of the audit log (ADR 0031, ADR 0149), with the
        lock strength its probe observed. One per cluster in M5a.
      required:
        - id
        - provider_id
        - prefix
        - lock_strength
        - last_exported_seq
        - updated_at
      properties:
        id:
          type: string
          pattern: '^aex_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Audit export id.
        provider_id:
          type: string
          pattern: '^prv_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The put-only `object_store` provider of the copy.
        prefix:
          type: string
          description: Key prefix of the copy inside the bucket.
        lock_strength:
          $ref: '#/components/schemas/LockStrength'
        probed_at:
          type: [string, 'null']
          format: date-time
          description: When the probe last ran.
        probe_detail:
          type: [string, 'null']
          maxLength: 2000
          description: What the probe saw, for example the status of the refused overwrite.
        last_exported_seq:
          type: integer
          minimum: 0
          description: The last audit `seq` in an acknowledged segment; 0 before the first.
        last_exported_hash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: The `hash` of that record, as written in its head object.
        last_error:
          type: [string, 'null']
          maxLength: 2000
          description: The last export or verification error, or null.
        updated_at:
          type: string
          format: date-time
          description: When the record last changed.
    AuditExportList:
      type: object
      title: AuditExportList
      description: The audit exports of the cluster.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditExport'
    CreateAuditExportRequest:
      type: object
      title: CreateAuditExportRequest
      description: Configure the off-site copy of the audit log.
      required:
        - provider_id
      properties:
        provider_id:
          type: string
          pattern: '^prv_[0-9A-HJKMNP-TV-Z]{26}$'
          description: |
            An `object_store` provider whose key may put and get, and should not
            be able to delete (ADR 0031). It must not be the backup repository's
            provider.
        prefix:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
          default: quoro-audit
          description: Key prefix of the copy inside the bucket.
    Lease:
      type: object
      title: Lease
      description: |
        A lease on an app or on the primary status. `fencing_token` changes only
        on ownership change: it stays the same across renewals by the same holder
        and increases strictly when the lease goes to a new holder or is granted
        again after expiry or revoke; never reused (D-0019, D-0073). From M5b
        every read of an app carries its lease (`App.lease`). The times of an
        `expiring` lease are the primary's view: renewals write nothing, so
        `renewed_at`, `expires_at` and `gate_at` come from its memory and are
        null after a primary restart until the next renewal
        (node-agent-protocol.md section 8.4).
      required:
        - id
        - resource_type
        - resource_id
        - holder_node_id
        - mode
        - fencing_token
        - granted_at
      properties:
        id:
          type: string
          pattern: '^lse_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Lease id.
        resource_type:
          type: string
          description: What the lease is on.
          enum:
            - app
            - primary
        resource_id:
          type: string
          description: Id of the leased resource (an app id or a cluster id).
        holder_node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Node holding the lease.
        mode:
          type: string
          description: |
            Local leases need no renewal; expiring leases do. When an app's
            HA policy becomes `warm`, its lease reads `local` until the primary
            answers the holder's first renewal after the mode change
            (node-agent-protocol.md section 8.4, ADR 0244).
          enum:
            - local
            - expiring
        fencing_token:
          type: integer
          minimum: 1
          description: Changes only on ownership change; the same across renewals by the same holder, strictly higher for a new holder or a grant after expiry or revoke; never reused.
        duration_ms:
          type: [integer, 'null']
          description: Lease duration in milliseconds; expiring leases only.
        granted_at:
          type: string
          format: date-time
          description: When the lease was granted.
        renewed_at:
          type: [string, 'null']
          description: When the primary last answered a renewal; expiring leases only.
        expires_at:
          type: [string, 'null']
          description: |
            When the holder has fenced at the latest if it renews no more: the
            last grant's time plus its `duration_ms`, on the primary's clock;
            expiring leases only.
        gate_at:
          type: [string, 'null']
          description: |
            The earliest time the primary may grant this lease with a new token,
            to another node or again after expiry: the latest
            `T_grant + duration_ms + 2M` over its grants to the holder, with
            the first answer after a mode change to `expiring` counted at the
            longer of its own and the conversion grant's duration
            (node-agent-protocol.md section 8.4, ADR 0254); expiring leases
            only.
        revoked_at:
          type: [string, 'null']
          description: When the lease was revoked.
    User:
      type: object
      title: User
      description: |
        A human identity. The password is stored as an Argon2id hash and is never
        part of this representation.
      required:
        - id
        - email
        - name
        - role
        - disabled
        - created_at
      properties:
        id:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: User id.
        email:
          type: string
          format: email
          description: Email, unique in the cluster.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name.
        role:
          type: string
          description: |
            Fixed scope bundle: `owner` has every scope, `operator` every scope
            except `user:write`, `viewer` every `:read` scope plus `app:logs`.
          enum:
            - owner
            - operator
            - viewer
        disabled:
          type: boolean
          description: A disabled user cannot log in or use tokens.
        created_at:
          type: string
          format: date-time
          description: When the user was created.
    UserList:
      type: object
      title: UserList
      description: One page of users.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    CreateUserRequest:
      type: object
      title: CreateUserRequest
      description: Create a human user.
      required:
        - email
        - name
        - role
        - password
      properties:
        email:
          type: string
          format: email
          description: Unique email.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name.
        role:
          type: string
          description: Fixed scope bundle.
          enum:
            - owner
            - operator
            - viewer
        password:
          type: string
          format: password
          minLength: 12
          writeOnly: true
          description: Initial password. Stored as an Argon2id hash.
        disabled:
          type: boolean
          default: false
          description: Whether the user starts disabled.
    UpdateUserRequest:
      type: object
      title: UpdateUserRequest
      description: Change a user. Absent fields stay unchanged.
      properties:
        email:
          type: string
          format: email
          description: New unique email.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: New display name.
        role:
          type: string
          description: New fixed scope bundle.
          enum:
            - owner
            - operator
            - viewer
        disabled:
          type: boolean
          description: Whether the user is disabled.
        password:
          type: string
          format: password
          minLength: 12
          writeOnly: true
          description: New password. Stored as an Argon2id hash.
    ApiToken:
      type: object
      title: ApiToken
      description: |
        A personal API token of a human. Only its hash is stored; the secret is
        shown once on creation.
      required:
        - id
        - user_id
        - name
        - created_at
      properties:
        id:
          type: string
          pattern: '^tok_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Token id.
        user_id:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: User the token belongs to.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Label of the token.
        expires_at:
          type: [string, 'null']
          description: Expiry of the token, or null when it does not expire.
        last_used_at:
          type: [string, 'null']
          description: When the token was last used.
        created_at:
          type: string
          format: date-time
          description: When the token was created.
        revoked_at:
          type: [string, 'null']
          description: When the token was revoked.
    ApiTokenList:
      type: object
      title: ApiTokenList
      description: One page of API tokens.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    ApiTokenCreated:
      type: object
      title: ApiTokenCreated
      description: |
        The new token together with its secret. The secret is shown once and
        cannot be retrieved again.
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required:
            - token
          properties:
            token:
              type: string
              readOnly: true
              description: The token secret. Shown only in this response.
    CreateTokenRequest:
      type: object
      title: CreateTokenRequest
      description: Create a personal API token.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Label of the token.
        expires_at:
          type: [string, 'null']
          description: Optional expiry.
    Agent:
      type: object
      title: Agent
      description: |
        An AI identity, separate from humans (D-0029). It records the human owner
        and the model, so the audit log can say who acted, on whose behalf and
        with which model.
      required:
        - id
        - name
        - model
        - owner_user_id
        - disabled
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^agt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Agent id.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Agent name, unique in the cluster.
        model:
          type: string
          description: Free-text model identifier the agent runs.
        owner_user_id:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Human who owns the agent and is its `on_behalf_of`.
        description:
          type: [string, 'null']
          description: What the agent is for.
        disabled:
          type: boolean
          description: |
            A disabled agent cannot mint access tokens; the attempt is refused
            with `forbidden` and `reason: agent_disabled`.
        created_at:
          type: string
          format: date-time
          description: When the agent was created.
        updated_at:
          type: string
          format: date-time
          description: When the agent record last changed.
    AgentList:
      type: object
      title: AgentList
      description: One page of agents.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    CreateAgentRequest:
      type: object
      title: CreateAgentRequest
      description: Create an agent. It starts with no grants.
      required:
        - name
        - model
        - owner_user_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Unique agent name.
        model:
          type: string
          description: Free-text model identifier.
        owner_user_id:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Human owner of the agent.
        description:
          type: string
          maxLength: 2000
          description: What the agent is for.
    UpdateAgentRequest:
      type: object
      title: UpdateAgentRequest
      description: Change an agent. Absent fields stay unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: New unique agent name.
        model:
          type: string
          description: New model identifier.
        owner_user_id:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: New human owner.
        description:
          type: string
          maxLength: 2000
          description: What the agent is for.
        disabled:
          type: boolean
          description: Disable or re-enable the agent.
    AgentKey:
      type: object
      title: AgentKey
      description: |
        A long-lived agent credential. It authorizes nothing by itself; it only
        mints short-lived access tokens (D-0030).
      required:
        - id
        - agent_id
        - created_at
      properties:
        id:
          type: string
          pattern: '^akey_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Agent key id.
        agent_id:
          type: string
          pattern: '^agt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Agent the key belongs to.
        created_at:
          type: string
          format: date-time
          description: When the key was created.
        revoked_at:
          type: [string, 'null']
          description: When the key was revoked.
        last_used_at:
          type: [string, 'null']
          description: When the key last minted an access token.
    AgentKeyCreated:
      type: object
      title: AgentKeyCreated
      description: |
        A new agent key with its secret. The secret is shown once and cannot be
        retrieved again.
      allOf:
        - $ref: '#/components/schemas/AgentKey'
        - type: object
          required:
            - key
          properties:
            key:
              type: string
              readOnly: true
              description: The key secret. Shown only in this response.
    AgentKeyList:
      type: object
      title: AgentKeyList
      description: |
        One page of an agent's keys, newest first, revoked keys included. A key
        never carries its secret here.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentKey'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    Selector:
      type: object
      title: Selector
      description: |
        The resources a grant's scopes apply to. A resource matches if it matches
        any listed entry; projects match by slug, others by id. `{"all": true}`
        matches everything and an empty object `{}` matches nothing.
      properties:
        projects:
          type: array
          description: Project slugs.
          items:
            type: string
            pattern: '^[a-z0-9-]{1,40}$'
        apps:
          type: array
          description: App ids.
          items:
            type: string
            pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
        nodes:
          type: array
          description: Node ids.
          items:
            type: string
            pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
        all:
          type: boolean
          description: Match every resource.
    Scope:
      type: string
      title: Scope
      description: |
        One scope, `<resource>:<verb>` (D-0030). Wildcards are not allowed in
        grants; scopes are listed explicitly.
      enum:
        - cluster:read
        - cluster:manage
        - node:read
        - node:enroll
        - node:remove
        - node:fence_ack
        - node:roles
        - node:declare_lost
        - project:read
        - project:write
        - project:delete
        - vm:read
        - vm:create
        - vm:start
        - vm:stop
        - vm:delete
        - vm:console
        - app:read
        - app:create
        - app:update
        - app:restart
        - app:redeploy
        - app:deploy
        - app:start
        - app:stop
        - app:delete
        - app:logs
        - app:terminal
        - app:failover
        - app:delete_quarantine
        - backup:read
        - backup:write
        - backup:restore
        - backup:manage
        - agent:read
        - agent:write
        - grant:read
        - grant:write
        - approval:read
        - approval:create
        - approval:decide
        - incident:read
        - incident:resolve
        - audit:read
        - event:read
        - webhook:read
        - webhook:write
        - provider:manage
        - user:read
        - user:write
    Grant:
      type: object
      title: Grant
      description: |
        Scope plus resource selector plus a mandatory expiry, and optionally a
        maximum number of uses (D-0030). An incident grant is scoped to one
        incident; an approval grant is the extra grant a human approval issues.
      required:
        - id
        - agent_id
        - kind
        - scopes
        - selector
        - expires_at
        - uses
        - status
        - on_behalf_of
        - created_by_type
        - created_by_id
        - reason
        - created_at
      properties:
        id:
          type: string
          pattern: '^grt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Grant id.
        agent_id:
          type: string
          pattern: '^agt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Agent the grant authorizes.
        kind:
          type: string
          description: What the grant is for.
          enum:
            - standard
            - incident
            - approval
        scopes:
          type: array
          description: Scopes granted. Listed explicitly; no wildcards.
          items:
            $ref: '#/components/schemas/Scope'
        selector:
          $ref: '#/components/schemas/Selector'
        expires_at:
          type: string
          format: date-time
          description: Expiry; a TTL is mandatory.
        max_uses:
          type: [integer, 'null']
          minimum: 1
          description: Maximum number of uses, or null when unlimited until expiry.
        uses:
          type: integer
          minimum: 0
          description: Uses consumed so far.
        status:
          type: string
          description: Grant status.
          enum:
            - active
            - expired
            - revoked
            - exhausted
        incident_id:
          type: [string, 'null']
          pattern: '^inc_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Incident the grant is scoped to, when `kind` is `incident`.
        approval_id:
          type: [string, 'null']
          pattern: '^apr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Approval request that produced the grant, when `kind` is `approval`.
        on_behalf_of:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Human who authorized the grant.
        created_by_type:
          type: string
          description: Kind of identity that created the grant.
          enum:
            - user
            - system
        created_by_id:
          type: string
          description: Id of the identity that created the grant.
        reason:
          type: string
          description: Why the grant was issued.
        created_at:
          type: string
          format: date-time
          description: When the grant was issued.
        revoked_at:
          type: [string, 'null']
          description: When the grant was revoked.
        revoked_by:
          type: [string, 'null']
          description: Id of the identity that revoked the grant.
    GrantList:
      type: object
      title: GrantList
      description: One page of grants.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    CreateGrantRequest:
      type: object
      title: CreateGrantRequest
      description: |
        Create a standard grant. Incident and approval grants are issued by the
        system when an incident opens or a request is approved, never by hand.
        `expires_at` or `ttl_s` is required: grants always expire.
      required:
        - agent_id
        - scopes
        - selector
        - reason
      properties:
        agent_id:
          type: string
          pattern: '^agt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Agent to authorize.
        kind:
          type: string
          default: standard
          description: Only `standard` is accepted here.
          enum:
            - standard
        scopes:
          type: array
          description: |
            Scopes to grant. Human-only and destructive scopes are rejected with
            `validation_failed`: an agent may never widen its own power, and a
            destructive action needs approval (D-0030).
          items:
            $ref: '#/components/schemas/Scope'
        selector:
          $ref: '#/components/schemas/Selector'
        expires_at:
          type: string
          format: date-time
          description: Absolute expiry. Either this or `ttl_s` is required.
        ttl_s:
          type: integer
          minimum: 1
          description: Lifetime in seconds. Either this or `expires_at` is required.
        max_uses:
          type: integer
          minimum: 1
          description: Optional maximum number of uses.
        reason:
          type: string
          description: Why the agent needs this grant.
    Approval:
      type: object
      title: Approval
      description: |
        A request for just-in-time approval of a destructive action (D-0030). An
        approval issues at most one extra grant: that one scope, selector limited
        to that target, `max_uses` 1, TTL 10 minutes.
      required:
        - id
        - agent_id
        - scope
        - target
        - operation
        - params
        - params_hash
        - justification
        - status
        - expires_at
        - created_at
      properties:
        id:
          type: string
          pattern: '^apr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Approval request id.
        agent_id:
          type: string
          pattern: '^agt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Agent that filed the request.
        scope:
          $ref: '#/components/schemas/Scope'
        target:
          $ref: '#/components/schemas/Target'
        operation:
          type: string
          description: |
            The operation the agent intends to call, as an endpoint template or
            an MCP tool name, for example `DELETE /api/v1/apps/{app_id}` or
            `delete_app`.
        params:
          type: object
          additionalProperties: true
          description: The intended call parameters.
        params_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 hex of the canonical params; an approved request may only run with these params.
        justification:
          type: string
          description: The agent's stated reason.
        incident_id:
          type: [string, 'null']
          pattern: '^inc_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Incident the request belongs to, if any.
        status:
          type: string
          description: Approval status.
          enum:
            - pending
            - approved
            - denied
            - expired
        expires_at:
          type: string
          format: date-time
          description: Expiry of the request; default 1 hour after filing.
        decided_by:
          type: [string, 'null']
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Human who decided the request.
        decided_at:
          type: [string, 'null']
          description: When the request was decided.
        decision_note:
          type: [string, 'null']
          description: Note the deciding human left.
        grant_id:
          type: [string, 'null']
          pattern: '^grt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Approval grant issued on approve.
        created_at:
          type: string
          format: date-time
          description: When the request was filed.
    ApprovalList:
      type: object
      title: ApprovalList
      description: One page of approval requests.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    Target:
      type: object
      title: Target
      description: One addressed resource.
      required:
        - type
        - id
      properties:
        type:
          type: string
          description: Resource kind, for example `app`, `vm`, `project` or `node`.
        id:
          type: string
          description: Id of the resource.
    Subject:
      type: object
      title: Subject
      description: The resource an event or incident is about.
      required:
        - type
        - id
      properties:
        type:
          type: string
          description: Resource kind, for example `app`, `vm`, `node` or `cluster`.
        id:
          type: string
          description: Id of the resource.
    CreateApprovalRequest:
      type: object
      title: CreateApprovalRequest
      description: |
        File an approval request. Agents only: a human does not need approval for
        a destructive action (D-0030).
      required:
        - scope
        - target
        - operation
        - params
        - justification
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
        target:
          $ref: '#/components/schemas/Target'
        operation:
          type: string
          description: Endpoint template or MCP tool name the agent intends to call.
        params:
          type: object
          additionalProperties: true
          description: The intended call parameters.
        justification:
          type: string
          minLength: 1
          maxLength: 2000
          description: Why the agent needs the exception.
        incident_id:
          type: [string, 'null']
          pattern: '^inc_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Incident the request belongs to, if any.
    DecisionRequest:
      type: object
      title: DecisionRequest
      description: Approve or deny a request, optionally with a note.
      properties:
        note:
          type: string
          maxLength: 2000
          description: Note recorded with the decision.
    Incident:
      type: object
      title: Incident
      description: |
        Opened by a detection and scoped to one subject; it scopes the incident
        grants an agent receives when an event wakes it (D-0030, D-0032).
      required:
        - id
        - status
        - title
        - trigger_event_id
        - subject
        - opened_at
      properties:
        id:
          type: string
          pattern: '^inc_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Incident id.
        status:
          type: string
          description: Incident status.
          enum:
            - open
            - resolved
        title:
          type: string
          description: One-line summary of the incident.
        trigger_event_id:
          type: string
          pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Event that opened the incident.
        subject:
          $ref: '#/components/schemas/Subject'
        project_id:
          type: [string, 'null']
          pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Project of the subject, when it has one.
        opened_at:
          type: string
          format: date-time
          description: When the incident opened.
        resolved_at:
          type: [string, 'null']
          description: When the incident was resolved.
        resolved_by_type:
          type: [string, 'null']
          description: Kind of identity that resolved the incident.
          enum:
            - user
            - agent
            - system
            - null
        resolved_by_id:
          type: [string, 'null']
          description: Id of the identity that resolved the incident.
        resolution_note:
          type: [string, 'null']
          description: What was done to resolve it.
    IncidentList:
      type: object
      title: IncidentList
      description: One page of incidents.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    IncidentDetail:
      type: object
      title: IncidentDetail
      description: An incident with the event that opened it and the grants issued for it.
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          required:
            - trigger_event
            - grants
          properties:
            trigger_event:
              $ref: '#/components/schemas/Event'
            grants:
              type: array
              description: Incident grants issued for this incident.
              items:
                $ref: '#/components/schemas/Grant'
    ResolveIncidentRequest:
      type: object
      title: ResolveIncidentRequest
      description: Close an incident and record what was done.
      properties:
        resolution_note:
          type: string
          maxLength: 2000
          description: What was done to resolve it. Recorded in the audit log.
    EventType:
      type: string
      title: EventType
      description: |
        Event type, `<subject>.<what>` in lowercase with underscores. The list is
        closed; new types are added to the contract in a standalone change.
      enum:
        - node.enrolled
        - node.connected
        - node.disconnected
        - node.fenced
        - node.fence_failed
        - node.disk_low
        - vm.created
        - vm.started
        - vm.stopped
        - vm.crashed
        - vm.deleted
        - app.created
        - app.updated
        - app.deleted
        - app.down
        - app.degraded
        - app.up
        - app.restarted
        - app.vulnerable
        - app.failed_over
        - app.switched_over
        - app.switchover_failed
        - deployment.started
        - deployment.succeeded
        - deployment.failed
        - build.started
        - build.succeeded
        - build.failed
        - build.cancelled
        - backup.succeeded
        - backup.failed
        - restore.succeeded
        - restore.failed
        - volume.quarantined
        - certificate.issued
        - certificate.expiring
        - certificate.failed
        - domain.unserved
        - domain.served
        - grant.created
        - grant.revoked
        - grant.expired
        - approval.requested
        - approval.approved
        - approval.denied
        - approval.expired
        - incident.opened
        - incident.resolved
        - audit.chain_broken
    EventSource:
      type: object
      title: EventSource
      description: What produced the event.
      required:
        - kind
      properties:
        kind:
          type: string
          description: Whether the control plane or a node produced it.
          enum:
            - control_plane
            - node
        node_id:
          type: [string, 'null']
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Node that produced the event, when `kind` is `node`.
    EventActor:
      type: object
      title: EventActor
      description: The identity behind the action the event reports, when there is one.
      required:
        - type
        - id
      properties:
        type:
          type: string
          description: Kind of identity.
          enum:
            - user
            - agent
            - node
            - system
        id:
          type: string
          description: Id of the identity.
    Event:
      type: object
      title: Event
      description: |
        One event in the append-only event log. The full envelope and the
        per-type `data` payloads are fixed by `docs/contracts/events.schema.json`.
        Webhook deliveries carry this object as their body.
      required:
        - id
        - seq
        - type
        - time
        - source
        - subject
        - data
      properties:
        id:
          type: string
          pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Event id.
        seq:
          type: integer
          minimum: 1
          description: Gap-free sequence number of the event log.
        type:
          $ref: '#/components/schemas/EventType'
        time:
          type: string
          format: date-time
          description: When the event was recorded.
        source:
          $ref: '#/components/schemas/EventSource'
        subject:
          $ref: '#/components/schemas/Subject'
        project_id:
          type: [string, 'null']
          pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Project of the subject, when it has one.
        incident_id:
          type: [string, 'null']
          pattern: '^inc_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Incident the event belongs to, if any.
        request_id:
          type: [string, 'null']
          pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'
          description: API or MCP call that caused the event.
        actor:
          $ref: '#/components/schemas/EventActor'
        data:
          type: object
          additionalProperties: true
          description: Type-specific payload, defined per event type in `events.schema.json`.
    EventList:
      type: object
      title: EventList
      description: One page of events in ascending `seq` order.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    WebhookWake:
      type: object
      title: WebhookWake
      description: |
        Present when the webhook wakes an agent: the delivery starts the agent
        with Quoro's MCP server, an incident grant over the non-destructive scopes
        listed here, and the incident context (D-0032).
      required:
        - agent_id
      properties:
        agent_id:
          type: string
          pattern: '^agt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Agent to wake.
        grant_scopes:
          type: array
          description: Non-destructive scopes the incident grant carries.
          items:
            $ref: '#/components/schemas/Scope'
        grant_ttl_s:
          type: integer
          minimum: 1
          default: 3600
          description: TTL of the incident grant in seconds.
        grant_max_uses:
          type: [integer, 'null']
          minimum: 1
          description: Optional maximum number of uses of the incident grant.
    Webhook:
      type: object
      title: Webhook
      description: |
        A subscription that delivers events to an external receiver (D-0032).
        `selector` limits which subjects fire it; an empty `event_types` list means
        every type. `secret` is write-only and shown once.
      required:
        - id
        - name
        - url
        - event_types
        - selector
        - enabled
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^whk_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Webhook id.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Label of the subscription.
        url:
          type: string
          format: uri
          description: Receiver URL. HTTPS only, except `http://localhost` for testing.
        event_types:
          type: array
          description: Event types that fire this webhook; empty means all.
          items:
            $ref: '#/components/schemas/EventType'
        selector:
          $ref: '#/components/schemas/Selector'
        secret:
          type: string
          writeOnly: true
          description: HMAC-SHA256 signing secret. Shown once on creation; stored encrypted.
        enabled:
          type: boolean
          description: Whether deliveries are attempted.
        wake:
          $ref: '#/components/schemas/WebhookWake'
        created_by:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: User who created it; also the `on_behalf_of` of the grants it wakes.
        created_at:
          type: string
          format: date-time
          description: When the webhook was created.
        updated_at:
          type: string
          format: date-time
          description: When the webhook record last changed.
    WebhookList:
      type: object
      title: WebhookList
      description: One page of webhooks.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    WebhookCreated:
      type: object
      title: WebhookCreated
      description: |
        The new webhook with its signing secret. The secret is shown once and
        cannot be retrieved again.
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          required:
            - secret
          properties:
            secret:
              type: string
              readOnly: true
              description: HMAC-SHA256 signing secret. Shown only in this response.
    CreateWebhookRequest:
      type: object
      title: CreateWebhookRequest
      description: Subscribe a receiver to events.
      required:
        - name
        - url
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Label of the subscription.
        url:
          type: string
          format: uri
          description: Receiver URL; HTTPS only, except `http://localhost`.
        event_types:
          type: array
          description: Event types that fire the webhook; empty means all.
          items:
            $ref: '#/components/schemas/EventType'
        selector:
          $ref: '#/components/schemas/Selector'
        enabled:
          type: boolean
          default: true
          description: Whether deliveries are attempted.
        wake:
          $ref: '#/components/schemas/WebhookWake'
    UpdateWebhookRequest:
      type: object
      title: UpdateWebhookRequest
      description: |
        Change a webhook. Absent fields stay unchanged. The signing secret cannot
        be changed: delete and recreate the webhook to rotate it. `wake` cannot
        be cleared here; delete and recreate the webhook without it (its secret
        rotates).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: New label.
        url:
          type: string
          format: uri
          description: New receiver URL.
        event_types:
          type: array
          description: New event types; empty means all.
          items:
            $ref: '#/components/schemas/EventType'
        selector:
          $ref: '#/components/schemas/Selector'
        enabled:
          type: boolean
          description: Whether deliveries are attempted.
        wake:
          $ref: '#/components/schemas/WebhookWake'
    WebhookDelivery:
      type: object
      title: WebhookDelivery
      description: |
        One delivery attempt of an event to a webhook. Failed deliveries are
        retried with exponential backoff from 10 seconds doubling to 1 hour, at
        most 10 attempts. A test delivery (`test` true) is attempted once and
        never retried.
      required:
        - id
        - webhook_id
        - event_id
        - attempt
        - status
        - test
        - created_at
      properties:
        id:
          type: string
          pattern: '^whd_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Delivery id; also sent as `Quoro-Delivery-Id`.
        webhook_id:
          type: string
          pattern: '^whk_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Webhook the delivery belongs to.
        event_id:
          type: string
          pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Event that was delivered.
        attempt:
          type: integer
          minimum: 1
          description: Attempt number, starting at 1.
        status:
          type: string
          description: Delivery status.
          enum:
            - pending
            - delivered
            - failed
        response_code:
          type: [integer, 'null']
          minimum: 100
          maximum: 599
          description: HTTP status the receiver answered, when it answered.
        error:
          type: [string, 'null']
          description: Transport or receiver error.
        next_attempt_at:
          type: [string, 'null']
          description: When the next attempt is due.
        test:
          type: boolean
          description: |
            True for a test delivery sent by `testWebhook`, false for every real
            delivery. A test delivery is always attempt 1 with no next attempt.
        created_at:
          type: string
          format: date-time
          description: When the attempt was made.
    WebhookDeliveryList:
      type: object
      title: WebhookDeliveryList
      description: One page of deliveries, newest first.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    ProviderKind:
      type: string
      title: ProviderKind
      description: |
        What the provider entry is used for: DNS records, tunnels, load balancing
        or object storage (D-0025, D-0051).
      enum:
        - dns
        - tunnel
        - lb
        - object_store
    Provider:
      type: object
      title: Provider
      description: |
        Credentials for one external provider (D-0025, D-0051). The secret is
        write-only: it is stored encrypted with the cluster data-encryption key
        (D-0050), never returned by the API and redacted from audit params. The
        off-site audit-copy credential is a separate `object_store` provider entry
        whose key is put-only (D-0031).
      required:
        - id
        - kind
        - name
        - config
        - has_secret
        - created_by
        - created_at
      properties:
        id:
          type: string
          pattern: '^prv_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Provider id.
        kind:
          $ref: '#/components/schemas/ProviderKind'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Label of the provider entry; unique in the cluster.
        config:
          type: object
          additionalProperties: true
          description: |
            Non-secret settings such as zone id, account id, bucket, endpoint or
            region.
        has_secret:
          type: boolean
          description: |
            Whether a secret is stored for this provider. The secret itself is
            never returned.
        created_by:
          type: string
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: User who created the provider entry.
        created_at:
          type: string
          format: date-time
          description: When the provider entry was created.
        rotated_at:
          type: [string, 'null']
          format: date-time
          description: When the secret was last replaced, or null if never.
    ProviderList:
      type: object
      title: ProviderList
      description: One page of providers.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    CreateProviderRequest:
      type: object
      title: CreateProviderRequest
      description: Add credentials for an external provider.
      required:
        - kind
        - name
        - config
        - secret
      properties:
        kind:
          $ref: '#/components/schemas/ProviderKind'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Label of the provider entry; unique in the cluster.
        config:
          type: object
          additionalProperties: true
          description: |
            Non-secret settings such as zone id, account id, bucket, endpoint or
            region. For `object_store`: `endpoint` (an `https://` URL),
            `bucket`, `access_key_id` and optionally `region` (`auto` when
            absent); the secret is the secret access key (`backup-format.md`
            section 10).
        secret:
          type: string
          writeOnly: true
          minLength: 1
          description: API token, tunnel token or access key secret. Write-only; never returned.
    RotateProviderSecretRequest:
      type: object
      title: RotateProviderSecretRequest
      description: Replace the stored secret of a provider.
      required:
        - secret
      properties:
        secret:
          type: string
          writeOnly: true
          minLength: 1
          description: API token, tunnel token or access key secret. Write-only; never returned.
    AuditRecord:
      type: object
      title: AuditRecord
      description: |
        One record of the append-only audit log; the format is fixed by
        `docs/contracts/audit-log-format.md`. It has no prefixed id: it is
        identified by `seq`. Secrets in `params` are redacted (D-0031).
      required:
        - seq
        - time
        - actor_type
        - actor_id
        - channel
        - operation
        - params
        - request_id
        - result
        - prev_hash
        - hash
      properties:
        seq:
          type: integer
          minimum: 1
          description: Gap-free sequence number of the audit log.
        time:
          type: string
          format: date-time
          description: When the call was recorded.
        actor_type:
          type: string
          description: Kind of identity behind the call.
          enum:
            - user
            - agent
            - node
            - system
        actor_id:
          type: string
          description: Id of the identity.
        agent_model:
          type: [string, 'null']
          description: Model of the agent, when the actor is an agent.
        on_behalf_of:
          type: [string, 'null']
          pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Human the actor acted for.
        channel:
          type: string
          description: Channel the call came through.
          enum:
            - api
            - panel
            - mcp
            - cli
            - system
        operation:
          type: string
          description: Endpoint or MCP tool name.
        scope:
          type: [string, 'null']
          description: Scope the call needed, when it needed one.
        target_type:
          type: [string, 'null']
          description: Kind of the addressed resource.
        target_id:
          type: [string, 'null']
          description: Id of the addressed resource.
        project_id:
          type: [string, 'null']
          pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Project of the target, when it has one.
        params:
          type: object
          additionalProperties: true
          description: Call parameters, with secrets redacted.
        justification:
          type: [string, 'null']
          description: The agent's stated reason, from `Quoro-Justification`.
        trigger_event_id:
          type: [string, 'null']
          pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Event that triggered the call.
        incident_id:
          type: [string, 'null']
          pattern: '^inc_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Incident the call belongs to.
        grant_id:
          type: [string, 'null']
          pattern: '^grt_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Grant that authorized the call.
        approval_id:
          type: [string, 'null']
          pattern: '^apr_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Approval request behind the call.
        request_id:
          type: string
          pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Correlation id of the call.
        result:
          type: string
          description: Outcome of the call.
          enum:
            - ok
            - refused
            - error
        result_detail:
          type: [string, 'null']
          description: Refusal reason or error code.
        change_seq:
          type: [integer, 'null']
          description: Change-log seq the action produced, if any.
        prev_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hash of the previous record.
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hash of this record.
    AuditList:
      type: object
      title: AuditList
      description: One page of audit records in ascending `seq` order.
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    AuditVerificationRequest:
      type: object
      title: AuditVerificationRequest
      description: Verify a range of the audit chain; both bounds default to the whole log.
      properties:
        from_seq:
          type: integer
          minimum: 1
          description: First record to verify.
        to_seq:
          type: integer
          minimum: 1
          description: Last record to verify.
    AuditVerificationResult:
      type: object
      title: AuditVerificationResult
      description: |
        Result of verifying the hash chain. `broken_at_seq` and `reason` are set
        when a link does not match; verification emits `audit.chain_broken`.
      required:
        - ok
        - checked
        - first_seq
        - last_seq
        - head_hash
      properties:
        ok:
          type: boolean
          description: Whether every checked link matched.
        checked:
          type: integer
          minimum: 0
          description: Number of records verified.
        first_seq:
          type: integer
          minimum: 1
          description: First record verified.
        last_seq:
          type: integer
          minimum: 1
          description: Last record verified.
        head_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hash of the last record in the log.
        broken_at_seq:
          type: [integer, 'null']
          description: First record whose link does not match.
        reason:
          type: [string, 'null']
          description: |
            Why the link does not match: `hash_mismatch`, `prev_mismatch` or
            `seq_gap` (audit-log-format.md section 6); from M5a, while an audit
            export exists, also `tail_truncated` or `copy_mismatch` when the
            local log disagrees with the head of the off-site copy
            (audit-log-format.md section 8.3).
    LogStreamName:
      type: string
      title: LogStreamName
      description: Which output stream a log line came from.
      enum:
        - stdout
        - stderr
    LogEntry:
      type: object
      title: LogEntry
      description: |
        One line of app output, as read from the node that runs the instance.
        Logs are not replicated; they are read on demand (D-0014).
      required:
        - time
        - vm_id
        - stream
        - line
      properties:
        time:
          type: string
          format: date-time
          description: When the node recorded the line.
        vm_id:
          type: string
          pattern: '^vm_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Instance that produced the line.
        stream:
          $ref: '#/components/schemas/LogStreamName'
        line:
          type: string
          description: The line, without its trailing newline.
    LogList:
      type: object
      title: LogList
      description: Log lines in time order.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
    NodeMetricSample:
      type: object
      title: NodeMetricSample
      description: One sample of a node's CPU and memory, taken by the node agent every `interval_s`.
      required:
        - time
        - cpu_usage
        - cpu_count
        - memory_total_bytes
        - memory_used_bytes
      properties:
        time:
          type: string
          format: date-time
          description: When the node took the sample.
        cpu_usage:
          type: number
          minimum: 0
          maximum: 1
          description: Busy fraction of all host CPUs over the sampling interval.
        cpu_count:
          type: integer
          minimum: 1
          description: Number of host CPUs.
        memory_total_bytes:
          type: integer
          minimum: 0
          description: Host memory.
        memory_used_bytes:
          type: integer
          minimum: 0
          description: Host memory in use, `MemTotal - MemAvailable`.
    NodeMetrics:
      type: object
      title: NodeMetrics
      description: |
        A node's recent CPU and memory samples, read from the node on demand
        and never stored by the control plane (ADR 0014). The node keeps the
        last 10 minutes in memory; an agent restart empties it.
      required:
        - node_id
        - interval_s
        - samples
      properties:
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The node.
        interval_s:
          type: integer
          minimum: 1
          description: Seconds between samples (5).
        samples:
          type: array
          description: Samples, oldest first.
          items:
            $ref: '#/components/schemas/NodeMetricSample'
    VmMetricSample:
      type: object
      title: VmMetricSample
      description: |
        One sample of a VM's CPU and memory as the host sees its VMM process;
        no guest agent is involved.
      required:
        - time
        - cpu_usage
        - vcpus
        - memory_rss_bytes
        - memory_bytes
      properties:
        time:
          type: string
          format: date-time
          description: When the node took the sample.
        cpu_usage:
          type: number
          minimum: 0
          description: |
            CPU time of the VM's VMM process over the interval, divided by the
            interval and by `vcpus`. 1 means every vCPU busy; the VMM's own
            threads can push it slightly above 1.
        vcpus:
          type: integer
          minimum: 1
          description: The VM's virtual CPUs.
        memory_rss_bytes:
          type: integer
          minimum: 0
          description: |
            Resident memory of the VMM process on the host. It counts the guest
            pages the guest has touched and does not shrink when the guest frees
            memory.
        memory_bytes:
          type: integer
          minimum: 0
          description: The VM's configured memory.
    AppInstanceMetrics:
      type: object
      title: AppInstanceMetrics
      description: Recent samples of one instance of an app.
      required:
        - vm_id
        - node_id
        - samples
      properties:
        vm_id:
          type: string
          pattern: '^vm_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The instance.
        node_id:
          type: string
          pattern: '^nod_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Node that runs it.
        samples:
          type: array
          description: Samples, oldest first; empty when the instance is not running.
          items:
            $ref: '#/components/schemas/VmMetricSample'
    AppMetrics:
      type: object
      title: AppMetrics
      description: |
        Recent CPU and memory samples of an app's instances, read from their
        nodes on demand and never stored by the control plane (ADR 0014).
      required:
        - app_id
        - interval_s
        - instances
      properties:
        app_id:
          type: string
          pattern: '^app_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The app.
        interval_s:
          type: integer
          minimum: 1
          description: Seconds between samples (5).
        instances:
          type: array
          description: One entry per instance.
          items:
            $ref: '#/components/schemas/AppInstanceMetrics'
    CreateTerminalSessionRequest:
      type: object
      title: CreateTerminalSessionRequest
      description: |
        Open a web terminal in one of the app's VMs (ADR 0113). The program runs
        inside the app's guest, in the app's root filesystem, with the app's
        environment and working directory.
      required:
        - rows
        - cols
      properties:
        rows:
          type: integer
          minimum: 1
          maximum: 1000
          description: Initial terminal height in rows.
        cols:
          type: integer
          minimum: 1
          maximum: 1000
          description: Initial terminal width in columns.
        command:
          type: array
          minItems: 1
          maxItems: 64
          description: |
            The argv to run. Default `["/bin/sh"]`. Only programs the image
            ships can run; a missing program ends the session with exit code 127.
          items:
            type: string
            minLength: 1
            maxLength: 4096
        user:
          type: string
          minLength: 1
          maxLength: 64
          description: User to run as, a name or uid optionally followed by `:` and a group name or gid. Default the app's own user.
        vm_id:
          type: string
          pattern: '^vm_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The instance to open it in. Default the app's running instance (M4 apps have one).
    CreateConsoleSessionRequest:
      type: object
      title: CreateConsoleSessionRequest
      description: Open a read-only view of a VM's serial console (ADR 0116). Every field is optional.
      properties:
        tail_bytes:
          type: integer
          minimum: 0
          maximum: 1048576
          description: Replay at most this many bytes of the VM's recent console output before live output. Default all the node keeps (up to 1 MiB, covering the current and the previous boot).
    InteractiveSessionTicket:
      type: object
      title: InteractiveSessionTicket
      description: |
        An opened terminal or console session and the single-use ticket that
        attaches a WebSocket to it (ADR 0114). The ticket is valid for 30
        seconds and for one upgrade; it is returned once and never stored.
      required:
        - id
        - kind
        - vm_id
        - ticket
        - expires_at
        - websocket_path
      properties:
        id:
          type: string
          pattern: '^trm_[0-9A-HJKMNP-TV-Z]{26}$'
          description: Session id.
        kind:
          type: string
          description: Whether this is a web terminal or a read-only console.
          enum:
            - terminal
            - console
        vm_id:
          type: string
          pattern: '^vm_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The VM the session is attached to.
        ticket:
          type: string
          minLength: 43
          maxLength: 64
          description: Single-use ticket, at least 256 random bits, base64url without padding.
        expires_at:
          type: string
          format: date-time
          description: When the ticket stops being accepted (30 s after the open).
        websocket_path:
          type: string
          description: Path to upgrade, `/api/v1/interactive-sessions/{session_id}/ws`; the ticket goes in the `ticket` query parameter.
    InteractiveSessionCloseReason:
      type: string
      title: InteractiveSessionCloseReason
      description: |
        Why a terminal or console session closed. It is sent to the client in
        the `closed` control message and recorded in `session.end`
        (audit-log-format.md section 3.3).

        - `exited`: the terminal's program exited.
        - `ended_by_client`: the client closed the WebSocket.
        - `ended_by_request`: `DELETE /api/v1/interactive-sessions/{session_id}`.
        - `ticket_expired`: no WebSocket attached within 30 s.
        - `idle_timeout`: no client input for 15 minutes.
        - `max_duration`: open for 8 hours.
        - `access_revoked`: the identity was disabled, its role or grant no longer covers the session.
        - `credential_expired`: the cookie or token that opened it expired or was revoked.
        - `vm_stopped`: the VM stopped (terminal) or was deleted (console).
        - `node_disconnected`: the node session dropped; sessions do not resume.
        - `transcript_limit`: the terminal's transcript reached its 16 MiB cap.
        - `primary_restarted`: the primary restarted while the session was open.
        - `error`: anything else; the `error` control message carried the detail.
      enum:
        - exited
        - ended_by_client
        - ended_by_request
        - ticket_expired
        - idle_timeout
        - max_duration
        - access_revoked
        - credential_expired
        - vm_stopped
        - node_disconnected
        - transcript_limit
        - primary_restarted
        - error
paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness of the node that served the call
      description: |
        Unauthenticated liveness probe. It answers whether this node's API is up
        and reveals no state and no secret. Readiness of the cluster, the change
        log position and the version are on `GET /api/v1/cluster`.
      x-quoro-scope: public
      security: []
      responses:
        '200':
          description: The node is alive.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/setup:
    post:
      tags: [health]
      operationId: setup
      summary: Create the first owner while no user exists
      description: |
        First-run setup. It creates the first human as `owner` and is accepted only
        while the `users` table is empty and the call carries a valid, unexpired,
        unused setup token (D-0054). This is the only way a cluster gets its first
        user. The call is public because no identity exists yet, and it is still
        listed as `security: []`. A missing, wrong, expired or already-used token
        is refused with `unauthenticated` (401); the token is consumed on success
        and every later call fails with `conflict` (409).
      x-quoro-scope: public
      security: []
      parameters:
        - $ref: '#/components/parameters/QuoroSetupToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Email, name and password of the first owner.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: The first owner was created and the setup token was consumed.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log a human in and set the session cookie
      description: |
        Email and password login for humans. On success the response sets the
        `quoro_session` cookie and answers with the identity. Agents never log in
        this way; they mint access tokens from an agent key (D-0029, D-0030).
      x-quoro-scope: public
      security: []
      requestBody:
        required: true
        description: Email and password.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded; the session cookie is set.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
            Set-Cookie:
              description: The `quoro_session` session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: |
        Deletes the session behind the current cookie. Other sessions of the same
        user stay valid. `Quoro-Justification` is required when the caller is an
        agent (D-0031).
      x-quoro-scope: authenticated
      parameters:
        - $ref: '#/components/parameters/QuoroJustification'
      responses:
        '204':
          description: The session was deleted.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Read the current identity
      description: |
        The identity behind the credential. A human answers with `user`; an agent
        answers with `agent` and its active grants, which is what the agent checks
        before it plans a call (D-0029, D-0030).
      x-quoro-scope: authenticated
      responses:
        '200':
          description: The current identity.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the signed-in human's own password
      description: |
        Self-service password change for the human behind the panel session
        (ADR 0135). It needs no `user:write`: every human may change their own
        password, and only their own. Only the `quoro_session` cookie
        authenticates this operation. A request that carries an
        `Authorization` header is `unauthenticated` (401) whatever the
        credential, so neither a personal API token nor an agent access token
        can change a password. The request must prove the current password: a
        wrong `current_password` answers `validation_failed` (422) and is
        audited as `refused` with `result_detail` `wrong_password`
        (audit-log-format.md section 3.4). `new_password` follows the rule of
        every other password (at least 12 characters) and must differ from the
        current one. Attempts are rate limited per user; a limited
        call answers `rate_limited` (429) and is audited (permission-model.md
        section 12). On success the password hash changes through the change
        log, every other panel session of the user ends, the session that made
        the call stays valid, and personal API tokens are left as they are.
      x-quoro-scope: human
      security:
        - sessionCookie: []
      requestBody:
        required: true
        description: The current password and the new one.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: The password changed and the user's other panel sessions ended.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/auth/agent-token:
    post:
      tags: [auth]
      operationId: createAgentToken
      summary: Mint a short-lived agent access token from an agent key
      description: |
        Exchanges an agent key for an access token valid 5 minutes (D-0030). The
        token carries no scope: each call is authorized against the agent's grants,
        so revoking a grant locks the agent out within seconds. A disabled agent is
        refused with `forbidden` and `reason: agent_disabled`. The call creates a
        token, so `Idempotency-Key` is accepted, and `Quoro-Justification` is
        required because the caller is an agent (D-0031).
      x-quoro-scope: authenticated
      security:
        - agentKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/QuoroJustification'
      responses:
        '200':
          description: A new access token.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List the caller's API tokens
      description: |
        Personal API tokens of the authenticated human. The secret is never
        returned; only the hash is stored.
      x-quoro-scope: human
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of the caller's tokens.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create a personal API token
      description: |
        Creates a token for the authenticated human. The secret is returned once in
        this response and cannot be read again. Only a human may call this
        operation; an agent caller is refused with `403 forbidden`,
        `reason: human_only`.
      x-quoro-scope: human
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Label and optional expiry of the token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: The token was created; the secret is in this response only.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/tokens/{token_id}:
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke one of the caller's API tokens
      description: |
        Revokes a token of the authenticated human. Revocation is immediate. The
        caller may not revoke a token of another user. Only a human may call this
        operation; an agent caller is refused with `403 forbidden`,
        `reason: human_only`.
      x-quoro-scope: human
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '204':
          description: The token was revoked.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/cluster:
    get:
      tags: [cluster]
      operationId: getCluster
      summary: Read cluster identity and change-log position
      description: |
        Cluster id and name, binary version, the node that holds the primary
        status, and the position of the change log. The primary is the single
        writer and source of truth (D-0012); `log_seq` and `log_head_hash` say how
        far the state has been written. From M5b `votes` lists the voters and
        says whether HA is ready (ADR 0170). Exposed as the MCP tool
        `get_cluster` (D-0033).
      x-quoro-scope: cluster:read
      x-quoro-mcp-tool: get_cluster
      responses:
        '200':
          description: The cluster.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/NotPrimary'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/cluster/capacity:
    get:
      tags: [cluster]
      operationId: getClusterCapacity
      summary: Simulate the loss of a node (the N+1 indicator)
      description: |
        Answers "if this node is lost, do its apps fit on the others?" with
        yes, or with no plus the missing resources (ADR 0021, ADR 0178). The
        primary takes the apps with an instance meant to run on
        `lost_node_id` or a volume there: a stateless app that keeps another
        instance loses one replica and needs nothing; a stateless app whose
        only instance was there needs a new one; a `warm` app whose source is
        there starts on its warm node; a stateful `none` or `cold` app needs a
        restore of its latest backup. It places them greedily, by memory, then
        vCPUs, then disk, largest first, against each remaining connected
        node with the `node` role: its capacity minus what is allocated,
        within the app's `placement.node_ids`. A warm app can go only to its
        warm node. Nothing is reserved and no event is emitted. The panel's
        HA view shows the answer. The MCP tool `get_capacity` under the same
        scope (ADR 0178) is added with the implementation. `404` when the
        node does not exist or was removed.
      x-quoro-scope: cluster:read
      parameters:
        - $ref: '#/components/parameters/LostNodeId'
      responses:
        '200':
          description: The simulated loss.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterCapacity'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/cluster/signing-key/rotate:
    post:
      tags: [cluster]
      operationId: rotateSigningKey
      summary: Rotate the cluster signing key
      description: |
        Starts a rotation of the key that signs desired state (ADR 0154,
        node-agent-protocol.md section 7.5). The primary generates the next
        key, seals it to every machine with a custody key, and sends every
        machine a `signing_key_rotate` signed by the current key; each machine
        pins the next key when it answers. The rotation completes once every
        machine that is not removed pins it, and `Cluster.signing_key_rotation`
        shows the machines still pending until then. One rotation runs at a
        time: another request answers `conflict` with `reason: in_progress`.
        The scope is human-only: an agent is refused with `forbidden` and
        `reason: human_only`. The call is audited (D-0031).
      x-quoro-scope: cluster:manage
      responses:
        '202':
          description: The rotation started.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyRotation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/nodes:
    get:
      tags: [nodes]
      operationId: listNodes
      summary: List nodes
      description: |
        All nodes of the cluster with capacity, allocation, KVM probe, session
        status and how far each has verified the change log. Exposed as the MCP
        tool `list_nodes` (D-0033).
      x-quoro-scope: node:read
      x-quoro-mcp-tool: list_nodes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of nodes.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/nodes/{node_id}:
    get:
      tags: [nodes]
      operationId: getNode
      summary: Read one node
      description: |
        One node. `status` is the session lifecycle, `cp_status` the control-plane
        status, `desired_rev` and `applied_rev` the reconciliation gap. Exposed as
        the MCP tool `get_node` (D-0033).
      x-quoro-scope: node:read
      x-quoro-mcp-tool: get_node
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: The node.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [nodes]
      operationId: removeNode
      summary: Remove a node from the cluster
      description: |
        Removes a node. Removing a node is destructive and human-only (D-0030):
        an agent is refused with `forbidden` and `reason: human_only`, or with
        `approval_required` when it asks for approval first. A node that still
        hosts running instances is refused with `conflict`. The node moves to
        `removed` and reconciliation stops targeting it. `Quoro-Justification` is
        required when the caller is an agent (D-0031). From M5b removing a voter
        changes the voter set, so it is also refused with `conflict` while the
        previous voter-set change has not reached a majority of voters
        (node-agent-protocol.md section 8.10). From M5b removing a node also
        drops the records of the quarantined copies it keeps
        (`Volume.quarantines`, ADR 0176); the files stay on the machine's
        disk, like the rest of its data, and Quoro no longer tracks them.
      x-quoro-scope: node:remove
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/QuoroJustification'
        - $ref: '#/components/parameters/QuoroIncident'
      responses:
        '202':
          description: Removal accepted; the node status becomes `removed`.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/nodes/{node_id}/fence-ack:
    post:
      tags: [nodes]
      operationId: ackNodeFence
      summary: Acknowledge a node's failed fences
      description: |
        Records a human's acknowledgement that the VMs of the listed failed
        fences are stopped (D-0074, D-0079). The scope is human-only: an agent is
        refused with `forbidden` and `reason: human_only`. `lease_ids` must equal
        the node's outstanding `fence_failure.lease_ids`; a node without one, or a
        list that differs, is refused with `conflict`. In one transaction the
        primary increments the fencing token of each listed lease that the node
        still holds, as when a node is declared lost, leaves the token of a
        listed lease that another node already holds as it is (ADR 0246),
        clears `fence_failure`, and queues the `fence_ack` command for the node
        (node-agent-protocol.md sections 5.17 and 8.5); from then on those
        leases may be granted again. The call is audited (D-0031).
      x-quoro-scope: node:fence_ack
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        description: The lease ids of the failed fences being acknowledged.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FenceAckRequest'
      responses:
        '200':
          description: The acknowledgement was recorded; the node is returned with `fence_failure` null.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/nodes/{node_id}/roles:
    post:
      tags: [nodes]
      operationId: updateNodeRoles
      summary: Add or remove the witness role of a machine
      description: |
        Adds or removes the `witness` role of an enrolled machine without
        enrolling it again (ADR 0170); the machine acts on its next desired
        state (node-agent-protocol.md section 6.12). Typical use is an edge that
        also becomes the third voter (ADR 0018). The scope is human-only: an
        agent is refused with `forbidden` and `reason: human_only`. Adding a role
        the machine has, or removing one it lacks, changes nothing and answers
        `200`. A change that adds or removes a vote is refused with `conflict`
        while the previous voter-set change has not reached a majority of voters
        (section 8.10), and removing a vote is refused with `conflict` when fewer
        than three voters would remain while any `expiring` lease exists, unless
        `force` is set. A request with both or neither of `add` and `remove`, or
        that would leave the machine with no role, is refused with
        `validation_failed`; a removed node with `conflict`. The call is audited
        (D-0031).
