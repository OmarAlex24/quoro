  /api/v1/apps/{app_id}/logs:
    get:
      tags: [logs]
      operationId: getAppLogs
      summary: Read an app's logs
      description: |
        Log lines of the app's instances in time order. Telemetry stays on each node;
        the control plane reads it from the node on demand, so an unreachable node
        answers `node_unreachable` (D-0014). `tail` bounds the answer; `since` and
        `until` bound the window; `instance` narrows to one VM. Exposed as the MCP
        tool `get_app_logs` (D-0033).
      x-quoro-scope: app:logs
      x-quoro-mcp-tool: get_app_logs
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: since
          in: query
          required: false
          description: Only lines recorded at or after this time.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Only lines recorded at or before this time.
          schema:
            type: string
            format: date-time
        - name: tail
          in: query
          required: false
          description: Maximum number of trailing lines to return.
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 200
        - name: instance
          in: query
          required: false
          description: Only lines of this VM (an instance of the app).
          schema:
            type: string
            pattern: '^vm_[0-9A-HJKMNP-TV-Z]{26}$'
      responses:
        '200':
          description: The requested log lines.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/NodeUnreachable'
  /api/v1/apps/{app_id}/logs/stream:
    get:
      tags: [logs]
      operationId: streamAppLogs
      summary: Stream an app's live logs
      description: |
        Server-sent events of live app output, read from the node on demand (D-0014).
        SSE (`text/event-stream`) is the transport for one-way streams;
        WebSockets are used only for bidirectional interactive sessions (D-0057).

        Framing, once the response started with `200` and
        `Content-Type: text/event-stream`: `id:` carries the log sequence number,
        `event:` carries the entry type (`log` for a line, `error` for a node
        problem, `end` when the stream closes), and `data:` carries one JSON object,
        a `LogEntry` for `log` and a `Problem` for `error`. A client resumes with
        `Last-Event-ID` set to the last `id` it saw; the node continues after that
        sequence number. An unreachable node answers `node_unreachable` (504) before
        the stream starts, or an `error` event after it started.
      x-quoro-scope: app:logs
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: instance
          in: query
          required: false
          description: Only stream this VM (an instance of the app).
          schema:
            type: string
            pattern: '^vm_[0-9A-HJKMNP-TV-Z]{26}$'
        - name: tail
          in: query
          required: false
          description: Number of existing lines to replay before live output.
          schema:
            type: integer
            minimum: 0
            maximum: 5000
            default: 0
        - name: Last-Event-ID
          in: header
          required: false
          description: Last log sequence number the client received; the stream resumes after it.
          schema:
            type: string
      responses:
        '200':
          description: The stream started; events follow until the client disconnects.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
            Cache-Control:
              description: Always `no-cache`; the stream must not be cached.
              schema:
                type: string
                enum: [no-cache]
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames. Each frame is `id: <seq>`, `event: <type>`,
                  `data: <json>`, separated by a blank line.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/NodeUnreachable'
  /api/v1/users:
