  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: List audit records
      description: |
        The append-only, hash-chained audit log in ascending `seq` order. Filter by
        actor, target, result or incident, or resume after a sequence number.
        Secrets in `params` are redacted (D-0031). Exposed as the MCP tool
        `list_audit` (D-0033).
      x-quoro-scope: audit:read
      x-quoro-mcp-tool: list_audit
      parameters:
        - name: actor_id
          in: query
          required: false
          description: Only records of this actor (user, agent or node id).
          schema:
            type: string
        - name: target_id
          in: query
          required: false
          description: Only records about this resource id.
          schema:
            type: string
        - name: result
          in: query
          required: false
          description: Only records with this result.
          schema:
            type: string
            enum: [ok, refused, error]
        - name: incident_id
          in: query
          required: false
          description: Only records that belong to this incident.
          schema:
            type: string
            pattern: '^inc_[0-9A-HJKMNP-TV-Z]{26}$'
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of audit records.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
