  /api/v1/apps/{app_id}:
    get:
      tags: [apps]
      operationId: getApp
      summary: Read one app with its instances and domains
      description: |
        One app, its instances (the VMs whose `app_id` is set) and its domains.
        Exposed as the MCP tool `get_app` (D-0033).
