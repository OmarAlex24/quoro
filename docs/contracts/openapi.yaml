    patch:
      tags: [apps]
      operationId: updateApp
      summary: Change app settings
      description: |
        Changes settings, not the image: a new image is rolled out as a deployment.
        `ha_policy: cold` needs a stateful app and a backup repository
        (`conflict`, 409, otherwise). `ha_policy: warm` needs a volume on a
        node that snapshots with `reflink` and an eligible warm node, and in
        M5b an app without a `source` (`validation_failed` otherwise, ADR
        0265); it starts the copy to the warm node,
        prepares the app's image there, moves the app's domains to the edge
        when the cluster has one, and turns the app's lease `expiring` as soon
        as the primary holds the support of a majority of voters
        (node-agent-protocol.md sections 6.13 and 8.4). Leaving `warm` deletes
        the warm copy and turns the lease `local` again. `hot` is refused with
        `validation_failed` until M6 (ADR 0020). A new `replicas`
        adds or removes instances without a deployment; it is refused with
        `validation_failed` above the eligible nodes, and with `conflict` above
        1 for a stateful app, for an app with a Git source, or while no
        machine with the `edge` role is enrolled (ADR 0142, ADR 0143). Going from 1 to more replicas, or back,
        moves the app's domains between its node and the edge. `Quoro-Justification` is required
        when the caller is an agent (D-0031).
      x-quoro-scope: app:update
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/QuoroJustification'
        - $ref: '#/components/parameters/QuoroIncident'
      requestBody:
        required: true
        description: Fields to change; absent fields stay unchanged.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppRequest'
      responses:
        '200':
          description: The updated app.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
    delete:
      tags: [apps]
      operationId: deleteApp
      summary: Delete an app and its data
      description: |
        Deletes the app, its instances, its domains and its volumes. In the
        same transaction every volume of the app, whatever its state, turns
        `deleting`: its node removes the file, and the primary drops the
        volume's record once the node reports it deleted (ADR 0165). Until
        then the volume stays readable with `getVolume`; it is no longer listed
        under the app, which is gone. Its backups stay in the repository and in
        the backup list; in M5a no operation restores or deletes them once the
        app is gone (`backup-format.md` section 9). From M5b the call is
        refused with `conflict` and `reason: has_quarantines` while a volume
        of the app keeps a quarantined copy (ADR 0176): a human deletes those
        first (`deleteVolumeQuarantine`), so an approved agent never deletes
        divergent writes nobody looked at. Deletion is
        destructive and off by default for agents: without an approval grant the
        call is refused with `approval_required`, and a human approves the filed
        request (D-0030). Exposed as the MCP tool `delete_app` (D-0033); the tool
        exists so the approval flow can be exercised. `Quoro-Justification` is
        required when the caller is an agent (D-0031).
      x-quoro-scope: app:delete
      x-quoro-mcp-tool: delete_app
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/QuoroJustification'
        - $ref: '#/components/parameters/QuoroIncident'
      responses:
        '202':
          description: Deletion accepted; the instances stop and are removed, and the app's volumes are `deleting` until their nodes remove the files.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
