      operationId: getBuildLogs
      summary: Read a build's log
      description: |
        One page of a build's log, oldest first. The log stays on the node that
        ran the build and is read from it on demand (ADR 0014, ADR 0119), so an
        unreachable node answers `node_unreachable` (504) and a node that no
        longer keeps the log (it keeps the last 20 builds of each app) answers
        `not_found`. Pages follow `next_cursor`; on a build that is still running
        the last page grows, and live lines are better read from
        `GET /api/v1/builds/{build_id}/logs/stream`.
      x-quoro-scope: app:logs
      parameters:
        - $ref: '#/components/parameters/BuildId'
        - name: limit
          in: query
          required: false
          description: Maximum number of lines to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of log lines.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildLogList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
