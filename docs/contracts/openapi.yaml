      description: |
        Adds a domain. TLS is obtained with ACME for a public-IP host or provided by
        a Cloudflare Tunnel for a host behind NAT (D-0024). The domain records the
        provider that manages its DNS records (`provider_id`, D-0095). A hostname
        already routed elsewhere is refused with `conflict`. From M5a a domain of
        an app with `replicas` above 1 is served by the cluster's edge: its DNS
        record or tunnel rule points at the edge, which balances over the app's
        instances (ADR 0143). A domain of an app with one replica is served by
