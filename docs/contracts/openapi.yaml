        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: List events
      description: |
        The event log in ascending `seq` order. `type` may be repeated to select
        several types; `subject_id` narrows to one resource and `after_seq` resumes
        a read (D-0032). Pages follow `seq` ascending; `next_cursor` is an opaque
        string that continues after the last event of the page. Exposed as the MCP tool `list_events` (D-0033).
      x-quoro-scope: event:read
      x-quoro-mcp-tool: list_events
      parameters:
        - name: type
          in: query
          required: false
          description: Only events of this type. Repeat the parameter to select several.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EventType'
        - name: subject_id
          in: query
          required: false
          description: Only events about this resource id.
          schema:
            type: string
        - $ref: '#/components/parameters/AfterSeq'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of events.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/events/stream:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Stream events
      description: |
        Server-sent events of new events. SSE (`text/event-stream`) is the
        transport for one-way streams; WebSockets are used only for bidirectional
        interactive sessions (D-0057).

        Framing, once the response started with `200` and
        `Content-Type: text/event-stream`: `id:` carries the event `seq`, `event:`
        carries the event type, and `data:` carries one JSON `Event` object. A
        client resumes with `Last-Event-ID` set to the last `seq` it saw, so no
        event is lost across a reconnect. The optional `type` filter works as on
        `GET /api/v1/events`.
      x-quoro-scope: event:read
      parameters:
        - name: type
          in: query
          required: false
          description: Only stream events of this type. Repeat to select several.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EventType'
        - name: subject_id
          in: query
          required: false
          description: Only stream events about this resource id.
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: Last event `seq` the client received; the stream resumes after it.
          schema:
            type: string
      responses:
        '200':
          description: The stream started; events follow until the client disconnects.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
            Cache-Control:
              description: Always `no-cache`; the stream must not be cached.
              schema:
                type: string
                enum: [no-cache]
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE frames. Each frame is `id: <seq>`, `event: <type>`,
                  `data: <json>`, separated by a blank line.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: List webhooks
      description: Event subscriptions of the cluster, without their signing secrets.
      x-quoro-scope: webhook:read
