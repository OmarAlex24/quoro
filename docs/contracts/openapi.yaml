  /api/v1/nodes/{node_id}/fence-ack:
    post:
      tags: [nodes]
      operationId: ackNodeFence
      summary: Acknowledge a node's failed fences
      description: |
        Records a human's acknowledgement that the VMs of the listed failed
        fences are stopped (D-0074, D-0079). The scope is human-only: an agent is
        refused with `forbidden` and `reason: human_only`. `lease_ids` must equal
        the node's outstanding `fence_failure.lease_ids`; a node without one, or a
        list that differs, is refused with `conflict`. In one transaction the
        primary increments the fencing token of each listed lease, as when a node
        is declared lost, clears `fence_failure`, and queues the `fence_ack`
        command for the node (node-agent-protocol.md sections 5.17 and 8.5); from
        then on those leases may be granted again. The call is audited (D-0031).
      x-quoro-scope: node:fence_ack
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        description: The lease ids of the failed fences being acknowledged.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FenceAckRequest'
      responses:
        '200':
          description: The acknowledgement was recorded; the node is returned with `fence_failure` null.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/nodes/{node_id}/tunnel:
    put:
      tags: [nodes]
      operationId: setNodeTunnel
      summary: Map a node to a tunnel provider
      description: |
        Records which `tunnel` provider runs this node's tunnel (D-0094, D-0095).
        The primary then creates or looks up the node's tunnel with that
        provider's account credential and sends the node only the tunnel id and
        its run token in desired state (node-agent-protocol.md section 5.11).
        Replacing the provider of a node that serves `tunnel` domains is refused
        with `conflict`; remove those domains first. Mapping nodes to provider
        credentials is human-only: an agent's access token is refused with
        `forbidden` and `reason: human_only` (D-0029, D-0051). The call is
        audited (D-0031).
      x-quoro-scope: provider:manage
      parameters:
        - $ref: '#/components/parameters/NodeId'
      requestBody:
        required: true
        description: The tunnel provider and the node's loopback origin port.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetNodeTunnelRequest'
      responses:
        '200':
          description: The mapping was recorded; the node is returned with its `tunnel`.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
    delete:
      tags: [nodes]
      operationId: deleteNodeTunnel
      summary: Remove a node's tunnel mapping
      description: |
        Removes the node's tunnel mapping. The primary deletes the node's tunnel
        at the provider and stops sending `spec.ingress.tunnel`, so the node stops
        its tunnel connector. A node that still serves `tunnel` domains is refused
        with `conflict`. Human-only like the other provider operations (D-0051).
        The call is audited (D-0031).
      x-quoro-scope: provider:manage
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '204':
          description: The mapping was removed.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
