  /api/v1/apps/{app_id}/failover:
    post:
      tags: [apps]
      operationId: failoverApp
      summary: Start a warm app's copy on its warm node
      description: |
        Starts the warm copy of a `warm` app on its warm node, for when the
        node that holds the app's lease is lost (ADR 0175). `node_id` must be
        `App.warm.node_id` (`validation_failed` otherwise). The primary moves
        the lease only when the old holder can no longer run the app, so two
        copies never write at once (ADR 0019). Refused with `conflict` and
        `reason`:
        - `not_warm`: the app's `ha_policy` is not `warm`;
        - `in_progress`: a failover or switchover of the app is running;
        - `no_copy`: as far as the primary knows, the warm node holds no
          complete copy;
        - `node_disconnected`: the warm node is not connected;
        - `fence_failed`: the lease or the warm node has a failed fence that
          no operator acknowledged (node-agent-protocol.md section 8.5);
        - `no_support`: the primary does not hold the support of a majority
          of voters, so it cannot grant an `expiring` lease (section 8.8);
        - `lease_held`: the source is not connected and may still hold the
          lease: the lease's gate (`App.lease.gate_at`, section 8.4) has not
          passed and no fence of it was confirmed. A lease that is still
          `local` (section 8.4, "Changing the mode") is held until the node is
          declared lost (`declareNodeLost`). That includes a warm app's
          lease until the primary answers its holder's first renewal after
          the mode change, because the lease stays `local` until then
          (ADR 0244).

        When the source is connected, the primary first revokes its lease
        over the session and goes on once the revoke is answered; that loses
        the writes made since the last shipped snapshot, which a planned
        switchover (`switchoverApp`) does not. Then, in one change, it grants
        the warm node an `expiring` lease with a higher fencing token, turns
        the standby VM there `running` on the last shipped snapshot, moves the
        app's volume and domains to that node (the edge's backend, or without
        an edge the tunnel route with the grace window of ADR 0168), makes the
        old source the app's warm node, and emits `app.failed_over`. The call
        answers `202` with the app once the lease moved; the instance starts
        asynchronously. The old source's lease is revoked when it reconnects;
        it keeps its divergent writes as a quarantined copy and becomes the
        warm copy (node-agent-protocol.md section 9). Destructive and off by
        default for agents: without an approval grant on `{type: app, id}`
        with `node_id` in `params` the call is refused with
        `approval_required` (ADR 0030). Automatic failover is M6.
        `Quoro-Justification` is required when the caller is an agent
        (ADR 0031).
      x-quoro-scope: app:failover
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/QuoroJustification'
        - $ref: '#/components/parameters/QuoroIncident'
      requestBody:
        required: true
        description: The warm node to start the app on.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailoverAppRequest'
      responses:
        '202':
          description: The lease moved to the warm node; the app starts there.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/apps/{app_id}/switchover:
    post:
      tags: [apps]
      operationId: switchoverApp
      summary: Move a warm app to its warm node with no data loss
      description: |
        A planned switchover (ADR 0022, ADR 0177): moves a `warm` app to its
        warm node, `node_id`, which must be `App.warm.node_id`
        (`validation_failed` otherwise). It runs as soon as it is asked;
        choosing a low-traffic window is the caller's in M5b. The primary
        pauses the app on its node (the write freeze), ships a final snapshot,
        stops the app and revokes its lease, grants the warm node the lease
        with a higher token, starts the app there and switches the edge's
        backend while the old backend's requests finish
        (node-agent-protocol.md section 6.13). The app does not serve from
        the freeze until the new instance runs, typically a few seconds.
        Refused with `conflict` and `reason`: `not_warm`; `in_progress`;
        `not_in_sync` unless `App.warm.state` is `in_sync`, a lag of at most
        two intervals; `node_disconnected` unless both nodes are connected;
        `fence_failed`; `no_support`. The call answers `202` with the app
        when the switchover started. It ends with `app.switched_over`, the old
        node becoming the warm copy with no quarantine, or, when a step before
        the revoke failed, with `app.switchover_failed`: the app resumed on
        its node and nothing moved. Destructive and off by default for agents,
        under the same scope as `failoverApp`: without an approval grant on
        `{type: app, id}` with `node_id` in `params` the call is refused with
        `approval_required` (ADR 0030). `Quoro-Justification` is required when
        the caller is an agent (ADR 0031).
      x-quoro-scope: app:failover
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/QuoroJustification'
        - $ref: '#/components/parameters/QuoroIncident'
      requestBody:
        required: true
        description: The warm node to move the app to.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchoverAppRequest'
      responses:
        '202':
          description: The switchover started.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
