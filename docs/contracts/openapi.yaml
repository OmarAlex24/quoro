  /api/v1/nodes/enroll:
    post:
      tags: [nodes]
      operationId: enrollNode
      summary: Enroll a new node with a join token
      description: |
        Self-enrollment of a node. The node presents the join token secret, its
        name, its Ed25519 public key, its roles, capacity and KVM probe; the reply
        carries the node id, cluster id, the primary URL and a node credential that
        authenticates the node-agent session. The token is consumed and cannot be
        reused. The message protocol is in `docs/contracts/node-agent-protocol.md`.
        This call is public because a node has no credential yet; the join token is
        the proof. From M5b enrolling a machine with the `node` or `witness` role
        changes the voter set, and is refused with `conflict`, without consuming
        the token, while the previous voter-set change has not reached a majority
        of voters (node-agent-protocol.md section 8.10).
      x-quoro-scope: public
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Join token, node facts and public key.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollNodeRequest'
      responses:
        '201':
          description: The node is enrolled; the credential is in this response only.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollNodeResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/nodes/session:
    get:
      tags: [nodes]
      operationId: openNodeSession
      summary: Open the node-agent session
      description: |
        The dial-out session between a node and the control plane. The request
        carries the node credential; on success the node upgrades the connection to
        a WebSocket (HTTP 101). Nodes behind NAT dial out, so the control plane
        never connects to a node. The message types (`hello`, `heartbeat`,
        `status_report`, `desired_state`, `lease_grant`, `log_entries`,
        `stream_open`, `command`, ...), reconciliation and self-fencing are fixed by
        `docs/contracts/node-agent-protocol.md` (D-0019). This endpoint is the only
        consumer of the `node` scope value.
      x-quoro-scope: node
      security:
        - nodeCredential: []
      responses:
        '101':
          description: Switching protocols; the connection is now a WebSocket.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
            Upgrade:
              description: Always `websocket`.
              schema:
                type: string
                enum: [websocket]
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/NotPrimary'
