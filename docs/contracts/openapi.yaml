  /api/v1/apps/{app_id}/builds:
    get:
      tags: [builds]
      operationId: listAppBuilds
      summary: List builds of an app
      description: |
        Builds of one app, newest first (ADR 0117). Each item carries its
        status and, for a failure, the failing step, so the panel shows a
        failure while the node is down (ADR 0119).
      x-quoro-scope: app:read
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of builds.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [builds]
      operationId: startBuild
      summary: Start a build of an app's Git source
      description: |
        Queues a build of the app's Git source on the node that runs the app,
        or on the node the scheduler picks when the app has no instance yet
        (ADR 0118). The build runs in an ephemeral builder microVM; when it
        succeeds, the control plane sets the app's `image` to the built image
        and starts a deployment with `trigger: build`, which is why this needs
        `app:deploy`. A node runs one build at a time; further builds wait in
        `queued`. Emits `build.started`; the outcome is `build.succeeded`,
        `build.failed` or `build.cancelled`. `conflict` (409) when the app has
        no Git source or already has a build that is not terminal. With
        `refresh_base` the build pulls every base image again, which is how a
        vulnerable app is rebuilt on a patched base (ADR 0150).
        `Quoro-Justification` is required when the caller is an agent (ADR 0031).
      x-quoro-scope: app:deploy
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/QuoroJustification'
        - $ref: '#/components/parameters/QuoroIncident'
      requestBody:
        required: false
        description: Optional overrides for this build.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartBuildRequest'
      responses:
        '202':
          description: The build was accepted and is `queued`.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Build'
