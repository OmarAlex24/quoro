      description: |
        Agents only: a human does not need approval for a destructive action. The
        request names one destructive scope, the target, the operation it intends to
        call and the exact params; a human approves or denies it and the approval
        issues a short-lived extra grant scoped to that target with one use and a
        10 minute TTL (D-0030). A request expires 1 hour after filing if nobody
        decides. Exposed as the MCP tool `request_approval` (D-0033); the MCP tool
        carries `justification` and the optional `incident_id` as arguments.
        `Quoro-Justification` is required when the caller is an agent (D-0031).
