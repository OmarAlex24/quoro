        build as recorded, which may still show its running status until the
        node confirms. `conflict` (409) when the build is already terminal.
        `Quoro-Justification` is required when the caller is an agent (ADR 0031).
      x-quoro-scope: app:deploy
      parameters:
        - $ref: '#/components/parameters/BuildId'
        - $ref: '#/components/parameters/QuoroJustification'
        - $ref: '#/components/parameters/QuoroIncident'
      responses:
        '202':
          description: The cancel was recorded and sent to the node.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
