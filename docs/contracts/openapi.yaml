  /api/v1/approvals/{approval_id}/approve:
    post:
      tags: [approvals]
      operationId: approveApproval
      summary: Approve a request and issue its grant
      description: |
        A human approves the request; the approval grant is issued with that one
        scope, a selector limited to the target, `max_uses` 1 and a TTL of 10
