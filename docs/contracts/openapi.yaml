          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: Create a webhook
      description: |
        Subscribes a receiver to events. The response carries the signing secret
        once; deliveries are signed with it as
        `Quoro-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>">`
        and a receiver rejects a signature older than 5 minutes (D-0032). Managing
        webhooks is human-only. `Quoro-Justification` is required when the caller is
        an agent (D-0031).
      x-quoro-scope: webhook:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/QuoroJustification'
      requestBody:
        required: true
        description: Name, URL, event filter and optional wake configuration.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: The webhook was created; the secret is in this response only.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/webhooks/{webhook_id}:
    get:
      tags: [webhooks]
      operationId: getWebhook
      summary: Read one webhook
      description: One webhook, its event filter and selector, and its wake configuration.
      x-quoro-scope: webhook:read
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: The webhook.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [webhooks]
      operationId: updateWebhook
      summary: Change a webhook
      description: |
        Changes name, URL, event filter, selector, wake configuration or the
        `enabled` flag. The signing secret cannot be changed; delete and recreate
        the webhook to rotate it. `wake` can be changed but not removed: an
        absent `wake` leaves it unchanged and `null` is not accepted. To stop a
        webhook from waking an agent, delete it and create it again without
        `wake`; the new webhook has a new signing secret. Human-only (D-0030). `Quoro-Justification` is
        required when the caller is an agent (D-0031).
      x-quoro-scope: webhook:write
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - $ref: '#/components/parameters/QuoroJustification'
      requestBody:
        required: true
        description: Fields to change; absent fields stay unchanged.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: The updated webhook.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook
      description: |
        Deletes the subscription together with its delivery history: its
        delivery rows are deleted with it (db-schema.sql, ON DELETE CASCADE).
        Pending retries stop. Human-only (D-0030). `Quoro-Justification` is required when the
        caller is an agent (D-0031).
