        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [volumes]
      operationId: createVolume
      summary: Create a local volume for an app
      description: |
        Creates a sparse local disk for the app on one node and makes the app
        stateful (ADR 0145). The volume is placed on the node that runs the
        app, or, for an app with no instance, on the node the scheduler picks;
        the app's placement is then pinned to that node and the node gets a
        `local` lease on the app, so the app runs only there until a restore
        moves it. The volume is attached at the next start of the app's
        instance, which this call does not trigger: restart or redeploy the app
        to use it. `conflict` (409) when the app already has a volume in
        `creating`, `ready` or `restoring` (one per app in M5a), runs more than
        one replica, or its node is not connected.
        `validation_failed` (422) for a bad `mount_path` or a size larger than
        the node's free disk. `Quoro-Justification` is required when the
        caller is an agent (ADR 0031).
      x-quoro-scope: app:update
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/QuoroJustification'
        - $ref: '#/components/parameters/QuoroIncident'
      requestBody:
        required: true
        description: Size and mount path.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolumeRequest'
      responses:
        '201':
          description: The volume was recorded in `creating`; it turns `ready` once its node reports the file.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/volumes/{volume_id}:
    get:
      tags: [volumes]
      operationId: getVolume
      summary: Read one volume
      description: One volume with its state and node.
      x-quoro-scope: app:read
      parameters:
        - $ref: '#/components/parameters/VolumeId'
      responses:
        '200':
          description: The volume.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [volumes]
      operationId: deleteVolume
      summary: Delete a volume and its data
      description: |
        Deletes the volume's file on its node (ADR 0145). Its backups stay in
        the repository until retention prunes them. Deletion is destructive and
        off by default for agents: without an approval grant on
        `{type: volume, id}` the call is refused with `approval_required`, and
        a human approves the filed request (ADR 0030). `conflict` (409) while
        the app's desired status is running, unless the volume is `detached`
        or `failed`: stop the app first. From M5b also `conflict` with
        `reason: has_quarantines` while the volume keeps a quarantined copy
        (ADR 0176): a human deletes those first (`deleteVolumeQuarantine`).
        Deleting the volume of a `warm` app deletes the warm copy too. Deleting the app's attached volume makes the app
        stateless once the node confirms: its `local` lease is released and
        its placement is no longer pinned. `Quoro-Justification` is required
        when the caller is an agent (ADR 0031).
      x-quoro-scope: app:delete
      parameters:
        - $ref: '#/components/parameters/VolumeId'
        - $ref: '#/components/parameters/QuoroJustification'
        - $ref: '#/components/parameters/QuoroIncident'
      responses:
        '202':
          description: Deletion accepted; the volume is `deleting` until its node removes the file.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/volumes/{volume_id}/quarantines/{quarantine_id}:
    delete:
      tags: [volumes]
      operationId: deleteVolumeQuarantine
      summary: Delete a quarantined copy of a volume
      description: |
        Deletes a quarantined copy: the divergent writes a node kept after it
        lost the app's lease to a failover (ADR 0176, node-agent-protocol.md
        section 9). Those writes are not in the app's current data; once the
        copy is deleted they are gone. The copy turns `deleting`, its node
        removes the file (`spec.quarantine_deletes`), and the record is
        dropped once the node no longer reports it. A copy on a node that
        never reconnects stays `deleting` until the node is removed
        (`removeNode`), which drops the records of every copy the node keeps.
        Nothing else deletes a quarantined copy. Destructive and human-only, so no agent can delete
        one, even with an approval: an agent is refused with `forbidden` and
        `reason: human_only`. A copy already `deleting` answers `202` again.
        The call is audited (ADR 0031).
      x-quoro-scope: app:delete_quarantine
      parameters:
        - $ref: '#/components/parameters/VolumeId'
        - $ref: '#/components/parameters/QuarantineId'
      responses:
        '202':
          description: The copy is `deleting`; the answer is its volume.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/apps/{app_id}/vulnerabilities:
    get:
      tags: [vulnerabilities]
      operationId: getAppVulnerabilities
      summary: Read an app's vulnerability report
      description: |
        The known vulnerabilities of the image the app currently runs, matched
        by the primary against its local copy of OSV data (ADR 0138, ADR 0150).
        The node that prepared the image sent its package inventory; the image
        never leaves the node. `inventory` says whether the image could be
        inventoried, and `data` how old the vulnerability data is, so an empty
        `items` is read together with them. Resolved findings are listed only
        with `include_resolved`.
      x-quoro-scope: app:read
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: severity
          in: query
          required: false
          description: Only findings of this severity or more severe.
          schema:
            $ref: '#/components/schemas/VulnerabilitySeverity'
        - name: kev
          in: query
          required: false
          description: Only findings in the KEV catalog.
          schema:
            type: boolean
        - name: include_resolved
          in: query
          required: false
          description: Also list resolved findings of the app, newest first after the open ones.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The app's report, with one page of findings.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVulnerabilities'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/vulnerabilities:
    get:
      tags: [vulnerabilities]
      operationId: getVulnerabilitySummary
      summary: Read the cluster's vulnerability summary
      description: |
        Open findings across the cluster (ADR 0150): one line per app the
        caller can read, filtered by the caller's selector like any list
        (permission-model.md section 5), plus the running Quoro release's own
        components and every node's host kernel. Those two parts are node
        data and are present only when the caller also holds `node:read` with
        no narrower selector; otherwise they are left out, never refused.
        `data` lists every data source the primary holds, with its age.
      x-quoro-scope: app:read
      parameters:
        - name: project_id
          in: query
          required: false
          description: Only apps of this project.
          schema:
            type: string
            pattern: '^prj_[0-9A-HJKMNP-TV-Z]{26}$'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The summary, with one page of apps.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VulnerabilitySummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
