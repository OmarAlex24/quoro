  /api/v1/apps/{app_id}/terminal-sessions:
    post:
      tags: [interactive]
      operationId: createTerminalSession
      summary: Open a web terminal in an app
      description: |
        Opens a PTY session inside the app's guest, started by Quoro's init
        over virtio-vsock and relayed by the node agent (ADR 0113). `app:terminal`
        is human-only in M4 (ADR 0114). This call is the audited open: its
        record carries the session id, VM, size, command and user
        (audit-log-format.md section 3.3). The answer is a single-use ticket
        valid for 30 seconds; the client upgrades
        `GET /api/v1/interactive-sessions/{session_id}/ws?ticket=...` with it.
        Every session ends with a `session.end` audit record, and its timed
        transcript stays on the node (ADR 0115). `conflict` (409) when the
        app has no running instance; `node_unreachable` (504) when the node is
        not connected; a VM started before the M4 guest init answers `conflict`
        until it restarts.
      x-quoro-scope: app:terminal
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        description: Terminal size and, optionally, the command, user and instance.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTerminalSessionRequest'
      responses:
        '201':
          description: The session is open and waits for its WebSocket.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveSessionTicket'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
        '504':
          $ref: '#/components/responses/NodeUnreachable'
  /api/v1/vms/{vm_id}/console-sessions:
    post:
      tags: [interactive]
      operationId: createConsoleSession
      summary: Open a read-only view of a VM's serial console
      description: |
        Opens a read-only session on the VM's serial console: the node replays
        its recent console output (the current and the previous boot, up to
        1 MiB) and then follows live output (ADR 0116). The console carries
        kernel and init diagnostics, such as the guest's boot output. Input is
        refused: nothing in the guest reads the serial port. `vm:console` is
        grantable to agents (ADR 0114). This call is the audited open; the
        session ends with a `session.end` record and has no transcript
        (audit-log-format.md section 3.3). The answer is a single-use ticket
        valid for 30 seconds. `node_unreachable` (504) when the node is not
        connected. `Quoro-Justification` is required when the caller is an
        agent (ADR 0031).
      x-quoro-scope: vm:console
      parameters:
        - $ref: '#/components/parameters/VmId'
        - $ref: '#/components/parameters/QuoroJustification'
        - $ref: '#/components/parameters/QuoroIncident'
      requestBody:
        required: false
        description: How much recent output to replay.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsoleSessionRequest'
      responses:
        '201':
          description: The session is open and waits for its WebSocket.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractiveSessionTicket'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
        '504':
          $ref: '#/components/responses/NodeUnreachable'
  /api/v1/interactive-sessions/{session_id}:
    delete:
      tags: [interactive]
      operationId: endInteractiveSession
      summary: End a terminal or console session
      description: |
        Closes an open session: the WebSocket gets a `closed` control message
        with reason `ended_by_request` and a normal close, and the primary
        writes the `session.end` record naming who ended it. Allowed for the
        identity that opened the session and for any human with the `owner`
        role; anyone else gets `forbidden` with reason `scope_missing`. A
        session that already ended answers `not_found`.
      x-quoro-scope: authenticated
      parameters:
        - $ref: '#/components/parameters/InteractiveSessionId'
        - $ref: '#/components/parameters/QuoroJustification'
      responses:
        '204':
          description: The session was closed.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
  /api/v1/interactive-sessions/{session_id}/ws:
    get:
      tags: [interactive]
      operationId: connectInteractiveSession
      summary: Attach a WebSocket to a terminal or console session
      description: |
        WebSocket upgrade (RFC 6455) for an opened session (ADR 0057, ADR 0114).
        The single-use `ticket` from the open authorizes the upgrade; the
        request needs no other credential, and a cookie or bearer token it
        carries is ignored. A spent, expired or unknown ticket, or one minted
        for another session, answers `401` before the upgrade. When the request
        carries an `Origin` header it must equal the panel's own origin, and a
        ticket minted for a panel session cookie requires one; otherwise `403`
        before the upgrade (cross-site WebSocket hijacking). A session accepts
        one WebSocket; a second upgrade answers `409`.

        Framing after the upgrade:

        - **Binary frames** carry raw terminal bytes in both directions: the
          program's output (or the console's) from the server, the user's
          input to the server. A console session refuses client binary frames
          with an `error` control message and ignores them.
        - **Text frames** carry one JSON control object each. Client to server:
          `{"type":"resize","rows":R,"cols":C}` (terminal only). Server to
          client: `{"type":"exit","code":N}` when the program exited,
          `{"type":"closed","reason":R}` with an `InteractiveSessionCloseReason`
          just before the server closes the WebSocket, and
          `{"type":"error","code":C,"message":M}` with a `Problem` code. Unknown
          control types are answered with `error` and ignored.
        - The server closes with status 1000 after `closed`. A client close
          ends the session with reason `ended_by_client`.

        The panel must render the stream as a terminal (xterm.js), never as
        HTML, and must not act on escape sequences that reach the browser
        (clipboard writes through OSC 52, links opened without a click),
        because the guest is untrusted. The session is re-checked while it is
        open (permission-model.md section 7.5): idle 15 minutes, at most 8 hours.
      x-quoro-scope: public
      security: []
      parameters:
        - $ref: '#/components/parameters/InteractiveSessionId'
        - name: ticket
          in: query
          required: true
          description: The single-use ticket from the open.
          schema:
            type: string
            minLength: 43
            maxLength: 64
      responses:
        '101':
          description: Switching protocols; the WebSocket carries the session.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/interactive-sessions/{session_id}/transcript:
    get:
      tags: [interactive]
      operationId: getSessionTranscript
      summary: Fetch a terminal session's transcript
      description: |
        The timed transcript of a terminal session, as asciicast v2
        (newline-delimited JSON: a header line, then `[seconds, "i"|"o"|"r", data]`
        events), relayed from the node that recorded it (ADR 0014, ADR 0115).
        Its SHA-256 equals `transcript_sha256` in the session's `session.end`
        audit record unless the file was altered. A transcript holds every
        secret that appeared in the session, so this needs `audit:read` and a
        human caller: an agent is refused with `human_only`, and every fetch is
        audited, also a human's (audit-log-format.md section 3.3). Console
        sessions have no transcript. `not_found` when the session, its
        transcript or the node's copy is gone (kept 30 days, at most 1 GiB per
        node); `node_unreachable` (504) when the node is not connected.
      x-quoro-scope: audit:read
      parameters:
        - $ref: '#/components/parameters/InteractiveSessionId'
      responses:
        '200':
          description: The transcript file, streamed from the node.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/x-asciicast:
              schema:
                type: string
                description: asciicast v2, one JSON value per line.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/NodeUnreachable'
webhooks:
  event:
    post:
      operationId: receiveEventDelivery
      summary: Receive one event delivery
      description: |
        The request a webhook receiver gets when an event fires its subscription
        (D-0032). The body is one event envelope: `id`, `seq`, `type`, `time`,
        `source`, `subject`, `project_id`, `incident_id`, `request_id`, `actor` and
        the type-specific `data`; the full envelope and every `data` payload are
        defined by `docs/contracts/events.schema.json`. The receiver is expected to
        answer `2xx`; anything else is retried with exponential backoff from 10
        seconds doubling to 1 hour, at most 10 attempts.

        Headers: `Quoro-Event-Id` is the event id, `Quoro-Event-Type` is its type,
        `Quoro-Delivery-Id` is the delivery attempt id (`whd_...`) and
        `Quoro-Signature` is `t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw
        body>">` computed with the webhook secret. A receiver rejects a signature
        older than 5 minutes and should answer `2xx` to stop retries.
      tags: [webhooks]
      parameters:
        - name: Quoro-Event-Id
          in: header
          required: true
          description: Id of the delivered event.
          schema:
            type: string
            pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
        - name: Quoro-Event-Type
          in: header
          required: true
          description: Type of the delivered event.
          schema:
            $ref: '#/components/schemas/EventType'
        - name: Quoro-Delivery-Id
          in: header
          required: true
          description: Id of this delivery attempt.
          schema:
            type: string
            pattern: '^whd_[0-9A-HJKMNP-TV-Z]{26}$'
        - name: Quoro-Signature
          in: header
          required: true
          description: |
            Signature over the raw body: `t=<unix seconds>,v1=<hex HMAC-SHA256 of
            "<t>.<raw body>">`.
          schema:
            type: string
      requestBody:
        required: true
        description: The event envelope, as defined by `docs/contracts/events.schema.json`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '2XX':
          description: |
            Any 2xx answer acknowledges the delivery and stops retries. The receiver
            body is ignored.
