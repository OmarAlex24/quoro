  /api/v1/backups/{backup_id}/restore:
    post:
      tags: [backups]
      operationId: restoreBackup
      summary: Restore a volume backup onto a node
      description: |
        Restores a succeeded, unpruned volume backup into a new volume on
        `node_id` and moves the app there (ADR 0147). The primary stops the
        app's instance and revokes its `local` lease on the old node (reason
        `moved`); in the same change it turns the app's current volume
        `detached` and creates the new volume in `restoring` with
        `restored_from_backup_id`. The target node downloads, verifies and
        writes the snapshot. When the node reports the volume `ready`, the
        primary grants the target node a new `local` lease with a higher
        fencing token, pins the app's placement there and starts the app;
        then it emits `restore.succeeded`. If the restore fails, the new
        volume turns `failed`, the app stays stopped with no lease and
        `restore.failed` is emitted; another restore may follow. A `detached`
        volume's file stays on its node until an operator deletes it with
        `deleteVolume`. The restore replaces the app's current
        data: it is destructive and off by default for agents; without an
        approval grant on `{type: backup, id}` the call is refused with
        `approval_required` (ADR 0030). `conflict` (409) when the backup did
        not succeed or was pruned, belongs to the control-plane database
        (restored only offline with `quoro restore`, ADR 0148), the volume's
        current node is not connected (remove it first, which bumps the
        lease's fencing token), the app has a restore in progress, or the
        target node has a fence failure. `Quoro-Justification` is required
        when the caller is an agent (ADR 0031).
      x-quoro-scope: backup:restore
      parameters:
        - $ref: '#/components/parameters/BackupId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/QuoroJustification'
        - $ref: '#/components/parameters/QuoroIncident'
      requestBody:
        required: true
        description: The node to restore onto.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreBackupRequest'
      responses:
        '202':
          description: The restore was accepted; the answer is the new volume in `restoring`.
          headers:
            Quoro-Request-Id:
              $ref: '#/components/headers/QuoroRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ApprovalRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/NotPrimary'
