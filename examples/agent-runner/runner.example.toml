# Quoro agent runner — example configuration.
# Copy to runner.toml, replace every value marked with ..., and keep the file
# readable only by the account that runs the runner (chmod 0600).
# Secrets are named here but never written here: the runner reads them from a
# file or from an environment variable at startup.

# Where the webhook receiver listens. Quoro's dispatcher must be able to reach
# it; the route is always POST /webhook. Put a TLS-terminating proxy in front if
# the receiver is not on the same host as Quoro.
listen = "127.0.0.1:8787"

# Base URL of Quoro's API and MCP endpoint (both are served by the same listener).
quoro_url = "https://primary.example:8443"

# TLS to Quoro's self-signed listener: pin the certificate, exactly as the
# `quoro join` command prints it. Use either tls_fingerprint or ca_file, never
# both; with neither, the system trust store is used.
tls_fingerprint = "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
# ca_file = "/etc/agent-runner/quoro-ca.pem"

# HMAC secret of the webhook, shown once by Quoro when the webhook is created.
# Set exactly one of webhook_secret_file and webhook_secret_env.
webhook_secret_file = "/etc/agent-runner/webhook-secret"
# webhook_secret_env = "QUORO_WEBHOOK_SECRET"

# A delivery from a webhook with wake names its agent and the incident grant it
# acts under in data.wake. The runner uses that agent when it is a well-formed
# agt_ id and otherwise falls back to this one, which is also what a delivery
# with no wake (a webhook without wake, or a test delivery) gets. The agent must
# have an [agents] entry below; the runner never has a key it was not configured
# with.
default_agent_id = "agt_01JAAAAAAAAAAAAAAAAAAAAAAA"

# "deterministic" restarts the app and checks it; "llm" asks the backend in
# [llm] what to do next. The rules are the same either way.
policy = "deterministic"

# Optional: after a restart, GET this URL and require 200 before calling the app
# recovered. It uses the system trust store, not the Quoro TLS options, and
# sends User-Agent quoro-agent-runner/<version>; some edges refuse Python's default.
check_url = "https://app.example/healthz"

# Optional: resolve the incident after a successful check. Needs the
# incident:resolve scope in the webhook's wake.grant_scopes.
resolve_incident = false

# Recovery polling: how many times to read the app, and how long to wait between
# reads. The defaults are 12 attempts, 5 seconds apart (one minute).
poll_attempts = 12
poll_interval_s = 5.0

# Largest webhook body accepted, in bytes. Larger deliveries get 413.
max_body_bytes = 1048576

# Timeouts for calls to Quoro and for the health check.
http_timeout_s = 30.0
health_timeout_s = 10.0

# DEBUG, INFO, WARNING, ERROR or CRITICAL. Logs go to stderr.
log_level = "INFO"

# One entry per agent the runner may wake. The runner holds the agent key so
# that Quoro never has to send a credential in a webhook. Set exactly one of
# key_file and key_env per agent.
[agents."agt_01JAAAAAAAAAAAAAAAAAAAAAAA"]
key_file = "/etc/agent-runner/agt_01JAAAAAAAAAAAAAAAAAAAAAAA.key"  # mode 0600
# key_env = "QUORO_AGENT_KEY"

# Only read when policy = "llm". `backend` is an importable class; every other
# key in this table is passed to its constructor as a keyword argument. The
# runner ships no vendor backend.
# [llm]
# backend = "my_module:MyBackend"
# model = "my-model"
